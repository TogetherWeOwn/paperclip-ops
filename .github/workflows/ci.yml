      - name: Restore toolkit-vendored files
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.dispatch == 'true'
        # Job defaults.run points at the plugin dir; the pin script lives at repo root.
        working-directory: .
        run: bash scripts/sync-toolkit.sh

      # Node 24: the version the instance runs plugins on. `node --test`
      # semantics have moved between majors, so testing on another one would be
      # testing a different program than the one installed.

      # Node 24: the version the instance runs plugins on. `node --test`
      # semantics have moved between majors, so testing on another one would be
      # testing a different program than the one installed.

      # --include=dev is NOT redundant. The SDK is a devDependency (the host
      # supplies it at runtime), and npm implies --omit=dev whenever NODE_ENV is
      # `production` — which the Paperclip instance sets. There, a bare `npm ci`
      # installs nothing, exits 0, prints "up to date", and every test then dies
      # ERR_MODULE_NOT_FOUND. See the broker area's note; same trap, same flag.
      # == area: cliproxy (was cliproxy-insight-suite; runs only when cliproxy or full changed) ==
      - name: Install pinned host packages
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.dispatch == 'true'
        working-directory: plugins/dispatch
        run: npm ci --include=dev --ignore-scripts

      # Guard the above rather than trusting it, so a silent no-op fails HERE
      # with the reason instead of later as an unexplained module error.
      - name: Verify the install actually landed
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.dispatch == 'true'
        working-directory: plugins/dispatch
        run: |
          set -euo pipefail
          [ -d "node_modules/@paperclipai/plugin-sdk" ] || {
            echo "::error::@paperclipai/plugin-sdk is missing after npm ci — dev dependencies were omitted (NODE_ENV=${NODE_ENV:-unset})"
            exit 1
          }
          echo "install ok: plugin-sdk present"

      # Pass the FILE, not the directory: `node --test test/` resolves `test` as
      # a module specifier on Node 24 and dies before running anything, which
      # looks exactly like a broken suite and is not. package.json's `test`
      # script passes the file, and is invoked here so the two cannot drift.
      - name: Dispatch suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.dispatch == 'true'
        working-directory: plugins/dispatch
        run: npm test

      # The wake action is bought with a week of report-only evidence, not with
      # an argument (case_68ec5539 Q1, retirement plan step 3). A default of `true`
      # would make INSTALLING the plugin the thing that enables it — precisely
      # the step the gate exists to hold. The suite asserts this too; it is
      # asserted again here because this is the one property whose regression
      # would be an unreviewed behaviour change in production rather than a red
      # test somebody triages.
      - name: Prove the wake action still ships disabled
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.dispatch == 'true'
        working-directory: plugins/dispatch
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { manifest } from './dist/manifest.js'
          const wake = manifest.instanceConfigSchema?.properties?.wakeEnabled
          if (!wake) throw new Error('wakeEnabled is no longer a config key')
          if (wake.default !== false) {
            throw new Error(`wakeEnabled defaults to ${wake.default}; it must ship false until the evidence gate passes`)
          }
          console.log('wake action: ships disabled')
          NODE

      # Capabilities are STATIC: the host pins them at install, and adding one
      # later puts the plugin into upgrade_pending (PLUGIN_SPEC.md §15.3). So
      # this is an exact-set equality against the reviewed list, not a denylist
      # of bad ones — a capability appearing OR disappearing both invalidate the
      # report-only week as evidence for the thing that eventually ships.
      #   `database` is absent deliberately: declaring it would require
      # `database.namespace.migrate`, i.e. a read-only reporter holding a DDL
      # capability to do a SELECT.
      - name: Prove the capability set is exactly the reviewed one
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.dispatch == 'true'
        working-directory: plugins/dispatch
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { manifest } from './dist/manifest.js'
          const reviewed = [
            'activity.log.write',
            'agents.read',
            'companies.read',
            'issue.relations.read',
            'issues.orchestration.read',
            'issues.read',
            'issues.wakeup',
            'jobs.schedule',
            'metrics.write',
            'plugin.state.read',
            'plugin.state.write',
          ]
          const declared = [...manifest.capabilities].sort()
          const added = declared.filter((c) => !reviewed.includes(c))
          const removed = reviewed.filter((c) => !declared.includes(c))
          if (added.length) throw new Error(`undeclared-in-review capabilities added: ${added.join(', ')}`)
          if (removed.length) throw new Error(`reviewed capabilities removed: ${removed.join(', ')}`)
          if (manifest.database) throw new Error('manifest.database would force database.namespace.migrate on a read-only reporter')
          console.log(`capability set: exactly the reviewed ${declared.length}`)
          NODE

      # This plugin reports and, when enabled, wakes. It NEVER assigns and never
      # writes an issue — case_68ec5539 scope item 4. A source-level assertion because
      # it is cheaper than any test and the constraint is absolute.
      - name: Prove the plugin never writes an issue
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.dispatch == 'true'
        working-directory: plugins/dispatch
        run: |
          set -uo pipefail
          rc=0
          for bad in "issues.update" "issues.create" "issues.assign" "setBlockedBy" "assigneeAgentId:"; do
            if grep -nF "$bad" dist/*.js; then
              echo "::error::dist/ reaches an issue-write surface ($bad); this plugin reports and wakes, it never assigns"
              rc=1
            fi
          done
          # requestWakeups (plural) throws on the first refusal AFTER waking every
          # prior issue and discards the whole result set (ADR 0004). The singular
          # call in its own try/catch is the only form used, at any batch size.
          #   Matched as a MEMBER CALL (`.requestWakeups(`) rather than as the bare
          # name, because worker.js's header comment explains at length why the
          # batch call is never used and a bare-name grep would fail on the
          # explanation instead of on the defect.
          if grep -nE '\.requestWakeups[[:space:]]*\(' dist/*.js; then
            echo "::error::dist/ calls the batch requestWakeups; ADR 0004 requires one call per issue in its own try/catch"
            rc=1
          fi
          [ $rc -eq 0 ] && echo "issue-write surface: absent; wake path: per-issue only"
          exit $rc

