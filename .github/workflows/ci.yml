      - name: fork-disclosure author classifier + token placement (case_092cd51d gate, offline half)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./verification/case_092cd51d-public-fork-disclosure-audit.sh --self-test

      # case_35e86d49. The activation gate for the one procedure in this company that
      # a git revert cannot undo: stopping the live service, restoring a
      # database, and recreating the server container from a Quadlet carrier.
      #
