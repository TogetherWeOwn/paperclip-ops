          REGEN_REQUIRE_POSTGRES: "1"
        run: python3 ops/case_34c2c99f/test_prune_operator_regen_dirs.py

      # case_b0e822f6: weekly Docker hygiene timer (dangling images + build
      # cache). Offline only: the 23-case suite drives the payload through a
      # stub docker binary (argv pins, forbidden-token audit, kill switch,
      # age validation, fail-closed cases) with no daemon and no network.
      - name: docker hygiene suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: bash test_docker_hygiene.sh

      - name: auth denial discriminator mutation gate
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 ./verification/auth-denial-mutation-gate.py

      # case_9e97e50d: offline, recorded-run process_lost burst evidence. The
      # errorCode is the signal; rows never prove the crash cause (EPIPE vs
      # hook-spawn OOM present identically). Dateless rows are unknown,
      # never a silent pass.
      - name: process lost probe hostile suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 ./test_process_lost_probe.py

      - name: process lost probe mutation gate
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 ./verification/process-lost-mutation-gate.py

      # case_702afdab. The platform watchdog detectors had a gate
      # (verification/platform-watchdog-gate.sh) that nothing ran, so a
      # detector, CLI-contract or writer-allowlist regression reached main
      # unseen. One explicit step: detector and CLI unit suites, the
      # all-families positive control, the quiet negative control, writer
      # allowlist compatibility (read from the checked-out recovery_writer.py
      # because actions/checkout has no origin/main), and the CLI mutation
      # gate. Offline: fixtures and temp files only, no credentials, no
      # network. Wakes with the suites core area (core/full) per ci_changes.py.
      - name: platform watchdog gate
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./verification/platform-watchdog-gate.sh

      # case_d8913f7c. Writer/detector compatibility contract as a direct suites
      # step: test_watchdog_writer_compat.py proves the WRITER_COMPAT block
      # against compatible and deliberately incompatible writer stubs. The
      # gate above also invokes this suite; the direct step keeps the
      # orphan-suite ratchet satisfied and fails the build if the suite
      # itself regresses. Offline: temp files and a fixture git repo only,
      # no host, database, or network access.
      - name: watchdog writer-compat suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_watchdog_writer_compat

      # case_ba5ec666. The offline derivation tool, and — §5 — the cross-check that
      # keeps it in step with the jq copy inside quota_brake.sh. Two
      # implementations of one formula is the price of the production path
      # needing only bash+jq+awk while the analysis path has to replay history
      # and sweep windows; what makes it survivable is that they are diffed on
      # every build rather than during the next incident.
      - name: quota burn derivation suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_quota_burn_derive.sh

      # case_6e4da19c. blocked_audit.sh reassigns and re-statuses real issues from an
      # explicitly supplied audit table in bounded batches. Three properties
      # are load-bearing and not visible by reading successful output: there is
      # no default snapshot to go stale, a board already matching the supplied
      # table is a no-op, and an ambiguous agent-id prefix must REFUSE rather
      # than bind whichever agent sorted first — two companies share one
      # database here, so a wrong bind assigns a real issue to a stranger. Each
      # property is asserted; the latter two were also mutation-checked.
      - name: cold-start detector suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_cold_start_detector.sh

      # The sibling-run guard is tracked in this repo (toolkit-tracked
      # allowlist survivor), so its offline regression suite runs here
      # against the tree, not the pinned toolkit bytes.
      - name: sibling-run guard suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_sibling_guard.sh

      # case_e77a1e99. The measuring half of the watchdog red-main detector
      # (case_311c4d5b item 6): poll company-repo mains through the fail-closed
      # reader, key the red signature per the case_9abb3daa triage contract
      # (red-main:v1:{owner}/{repo}:{sig8}), and look up the board before
      # asserting incidentExists — propose-only, no card writes, no writer
      # mutation. Offline: a stub GitHub API serves cases off repo names, and
      # a stub Paperclip API reproduces the measured issues-list behaviour
      # (500-row default window, 1000-row cap, substring q) for the board read
      # and the host wrapper's finding cards, so this needs no credential and
      # no network.
      - name: red-main poll suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_red_main_poll.sh

      # case_c3e1b6c1 (roadmap 2.18). The red-main poll suite is not vacuous:
      # remove one limb of red_main_poll.sh (or the host wrapper) at a time
      # and assert the named cases go red. Needs gh_ci_status.sh, restored by
      # the Restore toolkit-vendored files step above under this same core
      # gate, so ordering holds wherever this step runs. ~10 min: suites
      # only, never the fast tier.
      - name: red-main poll suite is not vacuous (mutation-gated)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./verification/case_e77a1e99-red-main-mutation-gate.sh

      # case_b22b58a0. This gate reads the running org-request-mcp startup event, not
      # merely the config. The production event that closed the incident carried
      # the authoritative tools array, while the original verifier searched only
      # for its convenience boolean and therefore reported no evidence. Missing
      # or contradictory journal evidence is UNKNOWN/FAIL, never a green gate.
      - name: capability-pathway host verifier suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_case_bc1705d4_verify_g4.sh

      # case_ce949cc1. model_lane_probe.sh watches the cheap/small-fast lane — the
      # profile status-recovery itself runs on, so a dead value blocks the
      # mechanism that would otherwise notice.
      #
      # THE ASSERTIONS THAT MATTER MOST ARE §2 AND §2b, AND THEY PULL IN
      # OPPOSITE DIRECTIONS ON PURPOSE.
      #
      # THE LANE IT WATCHES CHANGED ON 2026-09-16 (case_6172aa25). The owner retired
      # OmniRoute for everything but Hindsight, so the probe measures the direct
      # endpoint `http://cliproxy:8317` and the combo / x-omniroute-provider
      # gates are GONE. Do not restore them: with no OmniRoute credential in the
      # run environment they are unanswerable, which made the scheduled check
      # return exit 5 over 77 healthy rows. A standing UNKNOWN destroys the
      # signal exactly as thoroughly as a standing false alarm.
      #
      # §2 is the fail-open: an id that answers HTTP 200 from an endpoint the
      # fleet does not route through is live and tells you nothing — harder to
      # see than a dead lane, which at least breaks. §2 also pins the case no
      # single request can reveal: a run POINTED at the wrong endpoint alarms on
      # configuration alone, even when its probe cannot complete at all. If §2
      # ever "simplifies" to "200 is fine", the tool stops detecting what it
      # exists for and becomes a curl in a loop.
      #
      # §2b is the other cliff, and it is a REGRESSION TEST FOR THIS MONITOR
      # (case_af291f01). The pin gate used to be a string test for a `cliproxy/`
      # prefix. That premise was false — the prefix only ever correlated with
      # the property that mattered — so the probe paged on all 24 agents over ids
      # the owner had deliberately chosen. §2b pins that a bare id served by the
      # pinned lane is exit 0. Do not "restore" the prefix check as a cheap first
      # gate: §2b's last case pins that a PREFIXED id served elsewhere is still
      # an alarm, which is the same fact from the other side. A monitor that
      # fires on a correct configuration destroys the signal exactly as
      # thoroughly as one that stays silent on a broken one.
      #
      # §3 replays the case_68cbe8d0/case_2a23da3d disagreement: adapterConfig pinned and
      # healthy while runtimeConfig.modelProfiles.cheap is undated and 400. The
      # two surfaces drift independently and a tool that coalesced them would
      # report the healthy one and exit 0.
      #
      # §4 is the blind-monitor half: an unreadable source, zero surface rows, a
      # short read, and HTTP 000 all exit 5 and never 0. 000 is curl's "no
      # response completed" and it parses as an integer that is not 200, so the
      # naive ordering reports an unreachable endpoint as a dead lane. §4 also
      # covers the way the ROUTE goes unmeasured — a 200 carrying no
      # X-Cpa-Trace-Id, so the endpoint that served it was never identified —
      # because "alive" is not "on the pinned lane" and scoring that as ok is how
      # a status-only monitor stays green straight through a fail-open.
      #
      # §7 separates those two on the REAL curl path, not through the seam: two
      # stubbed responses differing in exactly one byte (the trace header present
      # or absent) must give exit 0 and exit 5. If the tool ever reported the URL
      # it DIALLED as the lane that SERVED, both go green and the gate is
      # decoration.
      #
      # Offline: the surface rows and the HTTP result arrive through *_CMD seams,
      # and §7's real-path cases stub `curl` on PATH — no database, no network.
      - name: web_search lane passthrough probe suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_websearch_lane_probe.py

      # case_02e23b00 ask 2. opencode_shared_budget_probe.sh decides whether the paid
      # OpenCode budget is SHARED across lanes or throttled per lane. The two
      # have opposite control surfaces: under sharing, a per-lane enable/disable
      # flag is actively harmful, because it moves the same demand onto a
      # sibling drawing the same pool.
      #
      # §1 and §2 are the assertions worth defending. They feed a KNOWN-SHARED
      # and a KNOWN-PER-LANE world carrying the SAME number of throttles and
      # demand different verdicts. The discriminator is coincidence in time, not
      # failure count — counting cannot separate the hypotheses at all, since
      # both eventually fail every lane. A tool that counted passes neither.
      #
      # §4 fails the CROSS-PROVIDER control in the same rounds every lane fails.
      # Those rounds must be excluded, or a gateway blip reads as proof of a
      # shared budget — an in-namespace control cannot tell the two apart.
      #
      # §3 pins that a quiet window is INCONCLUSIVE (exit 3), never "healthy".
      # Reading a quiet sweep as health is the artifact that made case_a2d90269's
      # "19/23 lanes verified" wrong.
      #
      # §5/§6 keep the capacity count honest in both directions: the
      # deterministic gpt-5.6-luna 500 never counts as capacity, and a
      # prefix-less "Missing API key" stays a real credential fault.
      #
      # Offline: HTTP results arrive through OPENCODE_PROBE_CMD, which defaults
      # to `false`, so a test that fell through to the live gateway fails rather
      # than passing quietly.
      - name: platform watchdog offline evidence suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_platform_watchdog_cli.py test_watchdog_sections.py test_watchdog_assignment_evidence.py

      # Offline API-export adapter: missing/malformed evidence stays unknown.
      - name: platform watchdog snapshot-builder suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_watchdog_snapshot_builder.py

      - name: platform watchdog snapshot-builder mutations are load-bearing
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 verification/watchdog-snapshot-builder-mutation-gate.py

      # lib/pcsql.sh decides how every DB-touching tool reaches PostgreSQL. It
      # is a dispatcher, so it is testable without a database: the suite puts
      # recording fakes for `podman` and `psql` on PATH and asserts the exact
      # argv, stdin and environment each backend produces. No database, no
      # credential, no network.
      - name: SQL backend seam suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_sql_backend.sh

      # case_39b2a64b. The two suites CI cannot run are the two whose green ticks
      # nobody here can check, and they were scoring themselves against nothing:
      # with COMPANY_ID set and no podman, test_request_queue.sh reported
      # 15 passed / 16 failed, because a `grep -q REFUSED` assertion is
      # satisfied by "requester not found" from an absent database just as well
      # as by the ceiling check it names.
      #
      # This suite is the part of that CI CAN run. It stubs a psql on PATH in
      # three modes and drives the real suites through it, so it proves both
      # guards: that they refuse to run at all when the backend is unreachable,
      # and — with a backend that answers the preflight but returns no rows —
      # that their reason-pinned assertions FAIL a refusal from the wrong gate.
      # The second is the one that needs a seam: once the preflight works, the
      # reason-pinning never executes anywhere else CI can see it.
      - name: suite-precondition and wrong-gate refusal suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_suite_preconditions.sh
      # case_b730ec29: the CI status reader that must never report a denial or an
      # empty result set as green. case_0020a490: nor a job GitHub never ran as a red
      # build. Offline — a stub GitHub API on 127.0.0.1 serves a different
      # permission/result case off each ref, so this needs no credential and no
      # network. The case_0020a490 cases are RECORDED responses replayed through that
      # stub (test/fixtures/gh_ci_status/), because a non-start is identical to
      # a real failure in every field and a hand-written fixture would only
      # prove the reader agrees with whoever typed it.
      - name: fail-closed CI status suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_gh_ci_status.sh

      # case_50dca137. The dark-step reporter, which names the steps a fail-fast abort
      # skipped. Both fixtures are verbatim `actions/jobs/{id}` responses: the
      # 2026-09-03 outage on pristine main (79 of 93 skipped) and the same job
      # once the expiry was re-issued (0 skipped). The suite pins the silent
      # case as hard as the loud one — a reporter that warns on every run is one
      # reviewers learn to scroll past.
      - name: dark-step reporter suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_ci_dark_steps.sh

      # case_821f1653. The failure log-drain: on a red run each failed job's log is
      # trimmed and bundled with a one-line summary naming the job, the failed
      # step and the cause, so triage starts from the summary instead of from
      # paging every failed job's full log. The suite is hermetic (recorded
      # jobs-list plus recorded per-job logs, no network, no credential); the
      # live API path runs only inside the failure-log-drain job below.
      # It regressed audibly during development (a tr range mangled every job
      # filename and the suite went red on the named test), so this green is
      # a green that has failed, not a green that cannot.
      - name: failure-drain suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_ci_failure_drain.sh

      # case_50dca137. The dark-step reporter's own vacuity gate.
      #
      # This reporter exists to make an invisible failure visible, so the way it
      # regresses is by going quiet — and a quiet reporter is indistinguishable
      # from a healthy CI at exactly the moment you need it. Nothing about
      # "20 passed, 0 failed" would tell anyone that. Hence the same contract
      # every other gate here uses: baseline must pass in the staging directory,
      # the named assertion must be PRESENT and GREEN before mutation, the
      # mutation must actually change the file and still parse, and the suite
      # must go red ON THE NAMED TEST rather than merely somewhere (case_ab86fd07).
      - name: Prove the dark-step reporter still detects a silenced report
        run: |
          set -uo pipefail
          rc=0
          # dark_mutation <label> <file> <sed-expr> <named test that must go red>
          dark_mutation() {
            local label="$1" file="$2" expr="$3" expect="$4"
            local mut; mut="$(mktemp -d)"
            cp ci_dark_steps.sh test_ci_dark_steps.sh "$mut/"
            mkdir -p "$mut/test/fixtures" "$mut/.github/workflows"
            cp -R test/fixtures/ci_dark_steps "$mut/test/fixtures/"
            # The suite asserts the ci.yml wiring, so the staging copy needs it.
            cp .github/workflows/ci.yml "$mut/.github/workflows/"

            local base
            base="$(cd "$mut" && ./test_ci_dark_steps.sh 2>&1)"
            if [ $? -ne 0 ]; then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              printf '%s\n' "$base" | grep -a 'FAIL' | head -20; rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "PASS.*$expect" <<< "$base"; then
              echo "::error::$label: no PASSING test matching /$expect/ in the baseline — the assertion this mutation pins has been renamed or deleted"
              rm -rf "$mut"; return 1
            fi

            sed -i "$expr" "$mut/$file"
            case "$file" in
              *.sh)
                if ! bash -n "$mut/$file"; then
                  echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
                  rm -rf "$mut"; return 1
                fi ;;
            esac
            if cmp -s "$file" "$mut/$file"; then
              echo "::error::$label: the sed changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi

            local out status
            out="$(cd "$mut" && ./test_ci_dark_steps.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the dark-step suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # 1. The outage itself, restated: a dark run that reports zero dark
          #    steps. This is the exact false green the card was filed for.
          dark_mutation "skipped-steps-counted-as-zero" ci_dark_steps.sh \
            's/^DARK="\$(jq.*$/DARK=0/' \
            'names the count of steps that did not execute' || rc=1

          # 2. Keep the report but drop the ::error annotation, so it exists
          #    only inside a 6000-line log nobody opens. That is precisely how
          #    the 2026-09-03 outage stayed invisible for ~21 hours.
          dark_mutation "error-annotation-downgraded" ci_dark_steps.sh \
            "s/::error title=/note: /" \
            'emits a ::error annotation' || rc=1

          # 3. An unobservable step list reports clean instead of refusing —
          #    case_70ae2474's rule that a check which did not happen is not an answer.
          dark_mutation "unobservable-reads-as-clean" ci_dark_steps.sh \
            's/|| refuse "the job object carries no step list; nothing was measured"/|| true/' \
            'REFUSES rather than reporting zero dark steps' || rc=1

          # 4. Stop attributing the aborting step. "79 steps did not run" without
          #    "because step 12 failed" sends the reader back to bisecting a log.
          dark_mutation "culprit-no-longer-attributed" ci_dark_steps.sh \
            's/^CULPRIT="\$(jq.*$/CULPRIT=""/' \
            'names the step that aborted the job' || rc=1

          # 5. Cry wolf on clean runs. A warning on all 89-of-89 runs is one
          #    every reviewer learns to scroll past, which is the same as absent.
          dark_mutation "warns-on-a-clean-run" ci_dark_steps.sh \
            's/^if \[\[ "\$DARK" -eq 0 \]\]; then/if [[ "$DARK" -lt 0 ]]; then/' \
            'raises no error annotation' || rc=1

          # 6. Drop `if: failure()` from the wiring. This silently re-blinds the
          #    job: the reporter is then skipped by the very abort it describes,
          #    and prints only on the runs that did not need it. The suite pins
          #    the workflow file for this one reason. (Main's version of this
          #    gate drops `if: always()`; the consolidated suites job wires
          #    `if: failure()` instead — case_a2b959d4 — so the mutant drops that.)
          dark_mutation "if-failure-dropped-from-wiring" .github/workflows/ci.yml \
            '/- name: Report steps that never ran/{n;/if: failure()/d;}' \
            'wired with if: failure()' || rc=1

            # 7. case_eb29f309. Count only `"skipped"` as dark again. On a fail-fast
            # abort the unreached steps still carry `conclusion: null` at
            # report time, so this reverts the tool to reading 0 dark and
            # printing "all N steps executed" over a 55-step abort — the exact
            # false green the abort-null fixture pins.
            dark_mutation "null-conclusions-not-counted-as-dark" ci_dark_steps.sh \
            's/select(.conclusion != "success" and .conclusion != "failure")/select(.conclusion=="skipped")/' \
            'an aborted run never prints the clean banner' || rc=1

          exit $rc

      # case_4c31ad57. Whether two runs of one agent can implement one issue twice.
      # They can, and did — case_b04b43a0 (#15/#16) and case_0445916f (#27/#28), each a full
      # wasted implementation plus a full CI cycle. The losing run on case_0445916f
      # had checked: `ps` is silently empty in the agent container for every
      # process including the caller's own, and worktree mtimes lag a live run
      # parked on a CI poll. Both said "nothing", and "nothing" was read as
      # "nothing found". So most of this suite is about the guard refusing to
      # report CLEAR while any detector could not run. Offline: real git against
      # a local bare origin, plus one stub on 127.0.0.1 serving both the
      # Paperclip and the GitHub API. No credential, nothing leaves loopback.

      - name: running-vs-reviewed drift suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_tool_drift.sh

      # case_9c11948c. The OTHER direction. tool_drift.sh asks whether the operator's
      # copy drifted ahead of the repo; measured 2026-08-24 it had not. This
      # asks whether an agent staged a RUNNABLE file for the operator that
      # exists in no commit — measured 2026-08-25, 11 of the 14 runnable
      # artifacts in /paperclip/operator-handoff/ did not. Same fabricated-world
      # trick: a throwaway git repo and a fake channel in mktemp, so no
      # /paperclip mount, no VPS, no network, no credential.
      #
      # Read the header of channel_drift.sh for what this green does NOT mean.
      # CI cannot run `channel_drift.sh check` — GitHub Actions has no view of
      # /paperclip. Green here means the DETECTOR works, never that the channel
      # is clean. The real check runs where the channel is mounted.
      - name: bootstrap operating-model guard suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_bootstrap_operating_model.sh

      # case_2963068b/case_64b2e78f. The channel's OTHER question. channel_drift.sh asks
      # whether a staged file was ever reviewed; this asks whether anything
      # staged there is a credential. The channel is the one path agents write
      # and the operator reads, and every agent on the box shares uid 1000, so
      # a secret landing there is disclosed instance-wide the moment it lands.
      #
      # The suite is the scanner's own `selftest`, which is why there is no
      # separate test_*.sh: every rule gets a positive case, the false-positive
      # corpus is the repo's own text, and two of the checks scan THIS FILE —
      # once asserting it comes back clean, once with a planted secret asserting
      # it comes back red. Offline: fixtures are mktemp, and DROPSCAN_PASSWD_FILE
      # feeds the shared-uid detector a fixture instead of the runner's own
      # /etc/passwd, so the verdict does not depend on where it runs.
      #
      # Same caveat as its sibling above, and it is the important one: green
      # here means the DETECTOR works. It is NOT a scan of the channel — GitHub
      # Actions has no view of /paperclip. Run `dropchannel_scan.sh scan` where
      # the channel is mounted; on 2026-08-25 that run was not clean.
      - name: handoff-channel credential-scanner selftest
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./dropchannel_scan.sh selftest

      # case_5276d981. Outside view of the same scanner: drives the shipped `scan`
      # subcommand against throwaway fixture dirs the way an operator or cron
      # would (clean passes with a file count, planted secret fails with
      # file:line, mode/ownership drift fails, tree byte-identical). Offline:
      # mktemp fixtures, fabricated strings, fixture passwd files; no network,
      # credentials, or host state. Without this step the fixture suite runs
      # only in the full local verify-fast tier while CI runs --parse-only,
      # so a regression only it catches would merge green.
      - name: dropchannel_scan offline fixture suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_dropchannel_scan.sh

      # case_a063910b. Dispatch refusal and policy purity for gh_access.sh: an
      # unknown subcommand refuses (usage on stderr, exit 2 — the case_7f0105f1
      # shape gh_token.sh already fixed), and `policy` exits 0 naming
      # ELIGIBILITY and WHO MAY GRANT with no backend on PATH. Offline:
      # COMPANY_ID=dummy, restricted PATH without container backends, staged
      # exit-0 mutant plus unmutated control in-suite (case_b04b43a0). Without this
      # step the suite runs only in the full local verify-fast tier while CI
      # runs --parse-only, so a regression only it catches would merge green.
      - name: gh_access dispatch and policy purity suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_gh_access_dispatch.sh

      # case_bb2ac7f4. The selftest above gained a block of cases that assert a
