      # == area: hostops (was host-ops-mcp-suite; runs only when hostops or full changed) ==


      - name: host-ops-mcp regression suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hostops == 'true'
        run: node --test mcp/test/host-ops-mcp.test.mjs

      # A suite that cannot fail is decoration, and this one guards an IDENTITY
      # boundary plus a SIGNATURE boundary — the two properties the whole card
      # rests on. Every mutation below is a real, tempting simplification, and
      # the suite must reject each of them. Same harness discipline as
      # mcp area: baseline-first, uniqueness-checked, parse-checked, and the
      # staging dir carries host-ops/broker.py so the real-broker acceptance
      # tests judge every mutation (a skipped assertion cannot reject one).
      - name: Prove the suite rejects each tempting simplification
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hostops == 'true'
        run: |
          set -uo pipefail
          rc=0

          # host_ops_mutation_check <label> <needle> <replacement>
          host_ops_mutation_check() {
            label="$1"; needle="$2"; repl="$3"
            mut="$(mktemp -d)"
            cp -r mcp host-ops "$mut/"
            if ! node --test "$mut/mcp/test/host-ops-mcp.test.mjs" > "$mut/base.txt" 2>&1; then
              echo "::error::$label: the UNMUTATED copy of the host-ops suite already fails in the staging dir — this gate proves nothing"
              tail -25 "$mut/base.txt"
              return 1
            fi
            skipped="$(sed -n 's/^[^0-9]*skipped \([0-9][0-9]*\)$/\1/p' "$mut/base.txt" | tail -1)"
            if [ -z "$skipped" ]; then
              echo "::error::$label: could not read a skipped count out of the staged suite's summary; the reporter format changed and this gate has stopped measuring coverage"
              tail -25 "$mut/base.txt"
              return 1
            fi
            if [ "$skipped" -ne 0 ]; then
              echo "::error::$label: the staged copy SKIPPED $skipped test(s), so this mutation is judged by a smaller suite than CI runs."
              grep -F "﹣" "$mut/base.txt" | head -10
              return 1
            fi
            node -e '
              var fs = require("fs");
              var p = process.argv[1], label = process.argv[2], needle = process.argv[3], repl = process.argv[4];
              var s = fs.readFileSync(p, "utf8");
              var hits = s.split(needle).length - 1;
              if (hits !== 1) {
                console.error("::error::" + label + ": the mutation needle matches " + hits + " times, not exactly once; the code moved or the site was duplicated, and this gate is now blind. Fix the needle.");
                process.exit(2);
              }
              fs.writeFileSync(p, s.replace(needle, repl));
            ' "$mut/mcp/host-ops-mcp.mjs" "$label" "$needle" "$repl" || return 1
            if ! node --check "$mut/mcp/host-ops-mcp.mjs" 2>/dev/null; then
              echo "::error::$label: the mutation broke the parse; it would fail the suite for the wrong reason"
              return 1
            fi
            if node --test "$mut/mcp/test/host-ops-mcp.test.mjs" >/dev/null 2>&1; then
              echo "::error::$label: the host-ops suite PASSED against the mutation"
              return 1
            fi
            echo "suite correctly rejects the $label mutation"
          }

          # Silently ignore a forged identity argument instead of refusing it.
          host_ops_mutation_check "silent-drop-identity-argument" \
            "const bad = Object.keys(args).find((key) => FORBIDDEN_ARGUMENT_NAMES.has(key));" \
            "const bad = undefined;" || rc=1

          # Advertise `additionalProperties: false` and then not enforce it.
          host_ops_mutation_check "unenforced-input-schema" \
            "const unknown = Object.keys(args).find((key) => !Object.hasOwn(declared, key));" \
            "const unknown = undefined;" || rc=1

          # Let an unreachable database fail OPEN.
          host_ops_mutation_check "fail-open-run-check" \
            "    if (failure) {" \
            "    if (failure) return; if (failure) {" || rc=1

          # The two halves of the brokerEnv fix, mutated separately because they
          # fail independently and either alone would let a config file lie
          # about execution or tenancy.
          host_ops_mutation_check "brokerenv-reserved-name-allowed" \
            ".filter((key) => RESERVED_BROKER_ENV.has(key));" \
            ".filter(() => false);" || rc=1
          host_ops_mutation_check "brokerenv-overrides-tenancy" \
            "PAPERCLIP_DB_CTR: cfg.dbContainer," \
            "PAPERCLIP_DB_CTR: cfg.dbContainer, ...cfg.brokerEnv," || rc=1

          # Forge the broker requester. The tempting "simplification" is to
          # reuse a value already in scope; the e2e acceptance records the
          # submitter's authenticated triple in the host audit chain and this
          # breaks it.
          host_ops_mutation_check "broker-requester-forged" \
            '"--agent-id", identity.agentId,' \
            '"--agent-id", "forged-principal",' || rc=1

          # Forge the issue attribution. Same shape, worse consequence: host
          # reads attributed to a card the caller never sat on.
          host_ops_mutation_check "broker-issue-forged" \
            '"--issue-id", identity.issueId,' \
            '"--issue-id", "00000000-0000-4000-8000-000000000002",' || rc=1

          # Skip signature verification and return the bundle unverified. The
          # e2e tamper test flips a signature bit and demands a refusal; an
          # unverified return passes it straight to the caller.
          host_ops_mutation_check "verify-skipped" \
            "const verified = await verifyBundle(bundle);" \
            "const verified = { payload: JSON.parse(readFileSync(bundle.jsonPath, 'utf8')), bundleBase: 'unverified' };" || rc=1

          # Skip the public-key pin check. The tampered-key refusal then rests
          # on openssl alone, and a swapped key FILE verifies its own bundles.
          host_ops_mutation_check "key-pin-skipped" \
            "pinnedPublicKey(cfg);" \
            "void cfg;" || rc=1

          # Scope the run check by headers alone — accept a live run without
          # comparing the snapshot issue. The mismatch test pairs a live run
          # row on ANOTHER issue with this card's stamped header and demands a
          # refusal; without the comparison it corroborates.
          host_ops_mutation_check "issue-comparison-dropped" \
            "if (snapshotIssue !== identity.issueId) {" \
            "if (false) {" || rc=1

          # Drop the specific identity-argument control. Undeclared keys are
          # still refused by the general control, but the SPECIFIC refusal —
          # the one that names impersonation in the audit log — is gone, and
          # the section-5 by-name tests assert the specific code.
          host_ops_mutation_check "identity-names-dropped" \
            '  assertNoIdentityArgument(args);' \
            '  void args;' || rc=1

          exit $rc

      # The transport must never grow a path to a write verb. This is a
      # source-level assertion because it is cheaper than any test and the
      # constraint is absolute: Phase-0 reads only, and enabling anything else
      # is a separate owner-approved change.
      - name: Prove the transport cannot reach a write verb
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.hostops == 'true'
        run: |
          set -uo pipefail
          rc=0
          for bad in "paperclip.deploy" "paperclip.restart" "cliproxy.apply" "writesEnabled" "arguments-json" "arguments_json"; do
            if grep -nF "$bad" mcp/host-ops-mcp.mjs; then
              echo "::error::mcp/host-ops-mcp.mjs references $bad; this transport is Phase-0 reads only"; rc=1
            fi
          done
          # execFile only, and only with an argv array. A shell would make every
          # argument-hygiene test in the suite meaningless.
          for bad in "execSync" "spawnSync" "shell: true" "eval("; do
            if grep -nF "$bad" mcp/host-ops-mcp.mjs; then
              echo "::error::mcp/host-ops-mcp.mjs uses $bad; this transport shells out only via execFile with an argv array"; rc=1
            fi
          done
          [ $rc -eq 0 ] && echo "transport surface: clean"
          exit $rc

      # case_50dca137. Name the steps a fail-fast abort skipped, never fail the
      # build for it. One reporter for the consolidated job, wired
      # `if: failure()`: area steps skip on unaffected areas, so always()
      # would annotate dark steps on every partial green run (the cry-wolf
      # failure case_50dca137 exists to prevent). On a red run the unreached
      # steps are still null at report time and are counted; area-skipped
      # steps are listed as not-checked-on-this-run, which is true.
      # Pinned by test_ci_dark_steps.sh.
      - name: Report steps that never ran
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci_dark_steps.sh report || true

  # Private integration tests do not move with their generic dependencies.
  # Keep only the request-record, notification-transport and endpoint-preflight
  # mutants here; the public toolkit owns the generic mutation matrix. This is
  # PR-only and path-gated, so unrelated main pushes do not restore the old
  # long-running job.
  private-mutation-gates:
    name: Private mutation gates
    needs: [changes]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.private_mutation == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          clean: true
      - name: Restore toolkit-vendored files
        run: bash scripts/sync-toolkit.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Run private mutation gates
        timeout-minutes: 45
        run: bash verification/private-mutation-gates.sh

  # case_572c6391: PR-scoped Trivy filesystem scan. No CVE scan runs on
  # ops-tooling PRs today. This job runs only when dependency inputs
  # (lockfiles), container build inputs (Dockerfiles), or workflow
  # definitions change -- the `trivy` area from the changes classifier, plus
  # the full-run latch -- and skips otherwise (docs-only PRs skip). Table
  # output; SARIF upload is an explicit follow-up, out of scope. Scanners
  # cover vuln+secret (lockfiles) and misconfig (Dockerfiles, workflows);
  # fails on fixable CRITICAL/HIGH findings. No secrets, no host access, no
  # service containers, no SARIF/code-scanning permission.
  trivy-scan:
    name: Trivy filesystem scan
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.trivy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          clean: true
      - name: Scan filesystem for known CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library

  # case_d5bc7950 (CI standard, case_6b39c80f rule 6 + 2026-10-04 addition 11):
  # secrets ALWAYS run -- docs-only PRs, draft PRs, everything. No `needs:`,
  # no `if:`: there is no change shape that may land without this scan. The
  # check name is not itself in the ruleset, but this job IS in the required
  # `ci-ok` aggregator's `needs:` (see below), so a failing scan fails `ci-ok`
  # and blocks merge. The repo-split guards run here too (same always-run,
  # same ephemeral VM) instead of booting two more isolated-pool VMs per PR.
  secret-scan:
    name: Secret scan
    # case_5236db70: hard-pinned ephemeral, same as changes above — secrets run on
    # every PR including docs-only, so stranding them on the saturated
    # isolated pool delays every merge gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          clean: true
      - name: Scan tracked files for committed secrets
        run: ./verification/secret-scan.sh
      # Repo-split guards (2026-10-10 pipeline review #7): formerly the
      # separate `model-selection-moved` and `public-owned-freeze` jobs. Each
      # ran for 0.1-1 min but waited 25-35 min for an isolated-pool VM on
      # every PR; folded here they share this always-run ephemeral job (no
      # needs:, no if:), so they still gate every PR through ci-ok.
      # C6: plugins/model-selection/ lives in paperclip-operator-toolkit.
      - name: Fail if the moved plugin path is touched
        # This split guard applies only to the old private source repository.
        # The canonical public repository must be able to own toolkit code.
        if: github.event.repository.private
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "non-PR event: nothing to guard"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=50 origin "$base" || {
            echo "base fetch failed; failing closed"
            exit 1
          }
          # Deletions are exempt (the cutover itself deletes the tree).
          # Private-only paths the gate never covered are exempt via
          # vendor/model-selection-private-keep.txt (no-data-loss rule);
          # anything else added, modified or renamed in is refused.
          files="$(git diff --name-only --no-renames --diff-filter=ACMRTUXB "$base" HEAD)"
          touched="$(printf '%s\n' "$files" | grep "^plugins/model-selection/" || true)"
          keep="$(grep -v '^#' vendor/model-selection-private-keep.txt || true)"
          rest="$(comm -23 <(printf '%s\n' "$touched" | sort -u) <(printf '%s\n' "$keep" | sort -u) || true)"
          if [[ -n "$rest" ]]; then
            echo "::error::plugins/model-selection/ moved to paperclip-operator-toolkit (pinned v0.5.1). Make the change there, not here. Offending paths:"
            printf '%s\n' "$rest"
            exit 1
          fi
          echo "moved-path guard: clean"
      # C4: paths in public-owned-paths.txt live in the toolkit
      # (vendor/toolkit-files.txt); deletions are exempt.
      - name: Fail if the freeze list drifted from its generator
        if: github.event.repository.private
        run: |
          set -euo pipefail
          # public-owned-paths.txt is generated, never hand-edited (see its
          # header). Re-run the generator and refuse a stale list, so a later
          # slice that moves more paths into the toolkit cannot leave them
          # unguarded by forgetting to regenerate.
          # The survivor exclusion is the files tracked in BOTH base and PR:
          # a PR that re-adds a frozen path tracks it only in the PR, so it
          # stays listed (no self-approving bypass); a future slice that
          # deletes a survivor tracks it only in the base, so regenerating
          # per the header picks it up instead of failing drift.
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "non-PR event: nothing to guard"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=50 origin "$base" || {
            echo "base fetch failed; failing closed"
            exit 1
          }
          cut -d'|' -f1 vendor/toolkit-files.txt | sort -u | grep -v '^plugins/model-selection/' | comm -23 - <(comm -12 <(git ls-tree -r --name-only "$base" | sort -u) <(git ls-files | sort -u)) > /tmp/regen-owned.txt
          grep -v '^#' public-owned-paths.txt | grep -v '^$' > /tmp/committed-owned.txt || true
          if ! cmp -s /tmp/regen-owned.txt /tmp/committed-owned.txt; then
            echo "::error::public-owned-paths.txt drifted from its generator. Re-run the command in its header and commit the result."
            diff /tmp/committed-owned.txt /tmp/regen-owned.txt || true
            exit 1
          fi
          echo "freeze list matches its generator"
      - name: Fail if a toolkit-owned path is touched
        if: github.event.repository.private
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "non-PR event: nothing to guard"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=50 origin "$base" || {
            echo "base fetch failed; failing closed"
            exit 1
          }
          # Deletions are exempt (the cutover itself deletes the tree).
          # Anything else added, copied, modified, renamed or type-changed
          # whose path is listed in public-owned-paths.txt is refused.
          files="$(git diff --name-only --no-renames --diff-filter=ACMRTUXB "$base" HEAD)"
          owned="$(grep -v '^#' public-owned-paths.txt | grep -v '^$' || true)"
          rest="$(comm -12 <(printf '%s\n' "$files" | sort -u) <(printf '%s\n' "$owned" | sort -u) || true)"
          if [[ -n "$rest" ]]; then
            echo "::error::this path lives in TogetherWeOwn/paperclip-operator-toolkit — make the change there, not here. Offending paths:"
            printf '%s\n' "$rest"
            exit 1
          fi
          echo "public-owned freeze guard: clean"

  # case_d5bc7950 (CI standard, case_6b39c80f rule 3): one required aggregator.
  # `ci-ok` passes when every needed job succeeded or was skipped, and fails
  # when any needed job failed or was cancelled. Branch protection requires
  # only this check (plus pr-lint), so job-level gating can never block a
  # merge: a skipped heavy suite reports success through its absence here.
  # The failure-log-drain below is deliberately NOT in `needs:`: it describes
  # red runs and must never gate green ones. secret-scan IS in `needs:`: a
  # committed secret must fail the merge even on a docs-only PR where every
  # heavy suite skips. trivy-scan IS in `needs:` too: a skipped scan reports
  # success through its absence, and a red scan fails the aggregator.
  ci-ok:
    name: ci-ok
    timeout-minutes: 5
    # case_5236db70: hard-pinned ephemeral, same as changes above — the required
    # aggregator needs no checkout and must not occupy an isolated runner
    # while heavy suites queue.
    runs-on: ubuntu-latest
    needs:
      - changes
      - secret-scan
      - trivy-scan
      - privilege-suites
      - suites
      - private-mutation-gates
    # `!cancelled()`, not `always()`: always() ignores cancellation, so a
    # superseded run's ci-ok stays queued on the saturated isolated pool and
    # holds the PR concurrency group for the new head (review case_13d22ce3).
    # Any status function opts out of the implicit success(), so ci-ok still
    # runs, and fails, when a needed job failed or was skipped by a failure.
    if: ${{ !cancelled() }}
    steps:
      - name: Aggregate suite verdicts
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' > needs.json
          python3 - needs.json <<'PY'
          import json, sys
          needs = json.load(open(sys.argv[1]))
          bad = {j: n["result"] for j, n in needs.items()
                 if n["result"] not in ("success", "skipped")}
          if bad:
              for j, r in sorted(bad.items()):
                  print(f"::error::ci-ok: needed job {j} ended {r}")
              raise SystemExit(1)
          skipped = sorted(j for j, n in needs.items() if n["result"] == "skipped")
          print("ci-ok: all needed jobs succeeded or skipped"
                + (f" (skipped: {', '.join(skipped)})" if skipped else ""))
          PY

  # ---------------------------------------------------------------------------
  # Failure log-drain (case_821f1653). One compact bundle per red run: each failed
  # job's log trimmed to its tail, plus a one-line summary naming the job, the
  # failed step and the cause — so triage starts from the summary instead of
  # from paging every failed job's full log.
  #
  # A separate job, not a step, for one reason that is not stylistic: a step
  # can only see its own job, while this needs every job's verdict and log
  # AFTER all suites have finished. `needs:` on every suite job plus
  # `if: failure()` means it runs exactly once per red run — never on green,
  # and never on a superseded run (cancelled needs do not satisfy failure()).
  # It never fails the build for its own findings; the run is already red.
  #
  # Permissions are scoped to this job, not the workflow: `actions: write` is
  # the documented minimum for actions/upload-artifact@v4 (read cannot
  # finalise an artifact), and the workflow stays at read-only. The drain
  # script itself only READS via the jobs/logs API, same as the case_50dca137
  # dark-step reporter. The check-run name is new and deliberately NOT a
  # required check: it describes red runs and must never gate green ones.
  # ci-ok: exempt -- if-failure drain describes red runs, never gates green ones
  failure-log-drain:
    name: Failure log drain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # secret-scan carries the repo-split guards (always-run, needed by no other
    # job): without this edge, `if: failure()` never fires on a run where only
    # a guard fails, so no failure bundle is produced for the usual guard trip.
    needs:
      - privilege-suites
      - trivy-scan
      - suites
      - private-mutation-gates
      - secret-scan
    if: failure()
    permissions:
      contents: read
      actions: write
    steps:
      - name: Prove the private runner selected this job
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || { echo "::error::public CI requires a GitHub-hosted runner"; exit 1; }
          [[ "${RUNNER_OS:-}" == Linux ]]
          [[ "${RUNNER_ARCH:-}" == X64 ]]
          printf 'private runner: name=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true

      # The log endpoint answers 302 to pre-signed storage; the script's -L
      # follows it. A refusal (exit 3) means the job list was unobservable —
      # reported loudly, never as "no failures found" (case_70ae2474).
      - name: Drain failed-job logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci_failure_drain.sh drain

      # `if: always()` is load-bearing in the other direction here: if the
      # drain refused, whatever it already wrote is still worth uploading
      # rather than leaving the red run with no bundle at all.
      - name: Upload the failure bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-drain
          path: failure-drain/
          retention-days: 14
