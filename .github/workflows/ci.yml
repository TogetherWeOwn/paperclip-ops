        run: npm test


      # case_dd69744c. These operator scripts cannot reach their live management
      # surface in CI, but the catch-all contract is still testable with a stub:
      # unknown argv refuses, TC_CATCHALL creates its own observable combo, the
      # mappings reader accepts the live .items envelope, and verifier B4 rejects
      # the old claude-* -> claude-sonnet target. The suite never sends inference.
      - name: case_d06b6dba operator artifact suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_case_8968f48d_artifacts.sh

      # case_2c352533 rehearsal steps removed in the slice-1 cutover: OmniRoute was
      # retired 2026-10-02 and its data deleted 2026-10-04, so the package
      # and translator-fixture suites tested a component that no longer
      # exists (the pin-restored verifier had drifted from the package
      # hashes). The suites omniroute area below still guards the
      # remaining broker surface.

      - name: omniroute containment selftest
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./omniroute_combo_cli.sh selftest

      # case_3075398f. The selftest must prove the TOOL, not the config it happened to run
      # under. It used to report 181/0 with COMBO_OWNED_PREFIX unset and 178/3 with any
      # other value, because its fixtures hardcoded the default 'two/' namespace — so an
      # operator who followed the documented flow (export the prefix, run selftest first)
      # saw three red lines in a containment proof and no way to tell a fixture bug from
      # a real regression. Worse, the refuse-fixtures went green for the WRONG reason:
      # 'two/x' under prefix 'pc/' is refused by the namespace gate before the gate each
      # case actually names ever runs.
      #
      # This step is what stops that coming back. Identical pass/fail counts across a
      # spread of prefixes is the assertion — a count that MOVES is the bug, so the two
      # runs are compared to each other, not to a number pinned here that would need
      # updating every time an assertion is added.
      - name: omniroute selftest is hermetic w.r.t. COMBO_OWNED_PREFIX
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          # -e OFF deliberately: the selftest EXITS 1 when it fails, and under the
          # runner's default `bash -e` that would abort the assignment below before the
          # ::error:: line ever prints. The result is still red, but red with no reason.
          # Every outcome is checked explicitly instead.
          set +e
          # 2>&1 is LOAD-BEARING: the selftest writes its per-case lines and its
          # summary to STDERR. Without it $out is empty, the summary scrolls past on
          # the console, and the comparison below reads '' == '' and passes having
          # measured nothing.
          run_at() { # prefix('' = unset) -> full selftest output, colour stripped
            if [ -z "$1" ]; then env -u COMBO_OWNED_PREFIX ./omniroute_combo_cli.sh selftest 2>&1
            else COMBO_OWNED_PREFIX="$1" ./omniroute_combo_cli.sh selftest 2>&1; fi \
              | sed -e 's/\x1b\[[0-9;]*m//g'
          }
          base_out="$(run_at '')"; base="$(printf '%s\n' "$base_out" | tail -1)"
          echo "unset:  $base"
          case "$base" in
            *" passed, 0 failed") : ;;
            *) echo "::error::selftest is not green with COMBO_OWNED_PREFIX unset: '$base'"
               printf '%s\n' "$base_out" | grep -E 'FAIL|selftest:'; exit 1 ;;
          esac
          for p in pc/ two/ acme-team/ x.y_z/deep/; do
            out="$(run_at "$p")"; got="$(printf '%s\n' "$out" | tail -1)"
            echo "$p:  $got"
            if [ "$got" != "$base" ]; then
              echo "::error::selftest result depends on COMBO_OWNED_PREFIX. unset='$base' but '$p'='$got'. Fixtures that name a combo we own must build the name from \$COMBO_OWNED_PREFIX, not hardcode 'two/'. See case_3075398f."
              printf '%s\n' "$out" | grep -E 'FAIL' ; exit 1
            fi
          done
          echo "selftest is prefix-independent: $base across 5 prefixes"

      # case_46ada0d8. The case_30ade3fb redaction builders are a LIBRARY with no operator step
      # of their own, so nobody has a routine reason to run them: before this step
      # existed, the first execution of the suite could have been the run that appended
      # to /paperclip/operator-handoff/omniroute-snapshots.jsonl — a 0644 file readable
      # by every agent on that box. An unregistered suite is indistinguishable from no
      # suite; it "passes" because somebody ran it by hand once, and keeps passing after
      # it rots. Offline: it needs no network and no credential, and shells out only to
      # sys.executable on itself.
      - name: case_30ade3fb snapshot-section redaction suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 omniroute/case_30ade3fb-snapshot-sections.py --selftest

      # The step above is 29 green assertions, which is worth nothing until somebody
      # breaks the redaction and watches them go red. This reverts each of the five
      # case_30ade3fb review fixes in a THROWAWAY COPY and requires the OWNING check to fail.
      # The unmutated copy is asserted green first, in the same staging directory:
      # "the mutated suite failed" is unattributable without that baseline, because a
      # staging error produces an identical red.
      - name: case_30ade3fb redaction fixes are load-bearing (mutation-gated)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./verification/case_46ada0d8-snapshot-redaction-mutation-gate.sh

      # case_965c83b3. Audits every link in git's credential-helper chain for
      # substitutability by the shared agent uid — the helper program, its
      # directory, and every config file that can name a helper, including ones
      # that do not exist yet but can be created.
      #
      # Portable by construction: the analysis is pure permission arithmetic, so
      # the suite builds its fixtures from real root-owned paths (/usr/bin/git,
      # /etc) that exist on a runner too, and skips only the handful of
      # assertions about /paperclip itself. It pins both bugs found by checking
      # the audit's output against live write probes rather than by reading it:
      # symlinked /bin reported as a world-writable hole, and an absent config
      # under a creatable parent reported clean.
      - name: credential-chain audit regression suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_credential_chain_audit.sh

      # case_368d4f39. Offline fixture test for the lockdown proposal: dry-run
      # read-only over a dirty fixture, both --apply refusals, and the
      # --verify verdict logic (clean / writable link / failing audit /
      # case_0b186cde grandparent) against stubbed probes. Hermetic: one mktemp
      # tree, BASH_ENV-carried fakes, no root/network/credentials/host.
      - name: credential-chain lockdown fixture suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_credential_chain_lockdown.sh
      # case_f7841f32. Hermetic offline fixture test for the same audit: a clean
      # fixture HOME tree passes as a second principal, writable-helper,
      # writable-config and creatable-but-absent links fail by name, and a
      # one-line relaxation of the directory-owner rule flips the deep
      # fixture (mutation-proved load-bearing). Runs under env -i with a
      # tight PATH, so harness GIT_CONFIG_* overrides and agent-writable PATH
      # entries cannot divert it off the fixtures.
      - name: credential-chain offline fixture suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_credential_chain_offline.sh

      # case_354a4d84. secret_exposure_audit.sh enumerates the platform credentials a
      # run holds (master key, full-DB DATABASE_URL, the two signing secrets).
      # Offline by construction: every case fabricates its own environment with
      # `env -i` plus fakes and a throwaway key file, so no real secret is read;
      # one case feeds sentinels and asserts they never reach stdout, which is
      # the property that keeps an exposure audit from becoming a disclosure.
      - name: git remote-URL credential scan regression suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_git_remote_credential_scan.sh

      # case_41f8ace8/case_b2967d07. The scan above locates embedded credentials; this is
      # the repair half. `git remote set-url` deletes our copy and leaves the
      # credential live at GitHub for up to an hour — measured: a scrubbed
      # token still authenticated ~5 min after the sweep reported it
      # remediated. gh_embedded_token_remediate.py revokes first, because
      # scrubbing first destroys the only handle the revoke authenticates
      # with (DELETE /installation/token self-authenticates, so it needs no
      # PEM and no broker, and works when the broker is down — which is when
      # embedded tokens get created).
      #
      # The suite's load-bearing cases, all offline against a loopback stub
      # GitHub API with fabricated sentinels: ORDER is proved from one shared
      # sequence log written by both the stub and a git-shim argv recorder —
      # the DELETE must precede the `remote set-url`; an unreachable API
      # scores UNKNOWN, exits 1, and leaves the URL intact so the token stays
      # revocable (a transport error scored as dead is how a live credential
      # closes out as remediated); a 204 that does not kill the token is not
      # a revoke; and the sentinel appears in no output and no git argv while
      # the stub proves the printed truncated-sha256 ids are honest.
      - name: embedded-token revoke-before-scrub regression suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_gh_embedded_token_remediate.sh




      # case_d2ac858d. The production ceiling makes two independent defence-in-depth
      # gates unreachable: a non-P1 chief cannot seat a chief, and nobody may
      # provision P0/P1. This suite passes widened ceiling VALUES to the same pure
      # function the mutating CLI calls. The CLI has no environment override, so
      # CI can reach those gates without widening the provisioner's trust boundary
      # or touching a database, API, credential or agent.
      - name: provisioner create-policy suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_provisioning_policy.sh

      # case_521b73a1. A newly provisioned claude_local agent must be BORN with an
      # explicitly falsy `effort` on its cheap model profile: the ACP lane
      # refuses that config option, and merely OMITTING the key does not help,
      # because the host spreads the adapter default ("low") first and the
      # stored profile second. Runs fully offline with pc/psql stubbed -- no
      # database, API, credential or agent mutation.
      - name: provisioned agents are born ACP-safe
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_provisioned_cheap_profile.sh

      - name: provisioned Claude transport and persistence verification
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 test_provisioned_transport.py

      # case_f909ca1f. The grant table's only attribution column is USER-typed, so an
      # agent-made grant writes null. This resolver recovers the grantor by
      # joining activity_log on (entity_id, |dt|), and reports derived
      # attribution as DERIVED -- it is never written back into the table.
      # Runs fully offline behind the *_SOURCE_CMD seam: no database, API,
      # credential or agent.
      - name: grant-attribution resolver suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_grant_attribution.sh

      # case_f909ca1f. The other half: org_provisioner.sh wrote grants with a raw
      # INSERT naming no grantor, and it is the sole cause of the only 25 rows
      # on this board whose author is unrecoverable by ANY means -- bypassing
      # the API meant no activity_log row was ever written either. This suite
      # holds the write path to both attribution facts, in one transaction.
      - name: provisioner grant-write attribution suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_grant_write_attribution.sh

      # Both suites above are largely ABSENCE assertions ("no anonymous row was
      # written", "an empty read does not render as a perfect audit"), which
      # also pass if the setup never reaches the gate. Delete each limb of the
      # resolver and each attribution write from a staging copy, after a green
      # baseline, and require the owning case to go red. Includes a rename
      # mutant, because an unanchored presence check passes on a rename.
      - name: grant attribution is load-bearing (mutation-gated)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./verification/case_f909ca1f-mutation-gate.sh

      # The widened-catalog cases above are absence assertions: they also pass if
      # their setup never reaches the named gate. Delete each independent guard
      # from a staging copy, after a green baseline, and require its owning case
      # to go red. Parse + cmp checks prevent a missed mutation from reading as a
      # successful test.
      - name: provisioner defence gates are load-bearing (mutation-gated)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp org_provisioner.sh test_provisioning_policy.sh "$mut/"
          mkdir -p "$mut/lib" && cp lib/*.sh "$mut/lib/"

          if ! (cd "$mut" && ./test_provisioning_policy.sh > base.out 2>&1); then
            echo "::error::the UNMUTATED staging copy is red; mutations prove nothing"
            cat "$mut/base.out"; exit 2
          fi
          cp "$mut/lib/provisioning_policy.sh" "$mut/lib/.orig"

          mutate() {
            local label="$1" start="$2" finish="$3"
            cp "$mut/lib/.orig" "$mut/lib/provisioning_policy.sh"
            START="$start" FINISH="$finish" python3 -c '
          import os, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          source = path.read_text()
          start = source.find(os.environ["START"])
          if start < 0:
              raise SystemExit("mutation start anchor missing")
          finish = source.find(os.environ["FINISH"], start)
          if finish < 0:
              raise SystemExit("mutation finish anchor missing")
          finish += len(os.environ["FINISH"])
          path.write_text(source[:start] + source[finish:])
          ' "$mut/lib/provisioning_policy.sh"
            bash -n "$mut/lib/provisioning_policy.sh" || {
              echo "::error::$label mutant does not parse"; return 1; }
            cmp -s "$mut/lib/.orig" "$mut/lib/provisioning_policy.sh" && {
              echo "::error::$label mutation changed nothing"; return 1; }
            if (cd "$mut" && ./test_provisioning_policy.sh > out.txt 2>&1); then
              echo "::error::$label deletion left the suite green"
              cat "$mut/out.txt"; return 1
            fi
            echo "  ok: $label deletion goes red"
          }

          mutate "chief-seating guard" \
            '  if [[ "$template" == B[1-5]_*' \
            '  fi'
          mutate "enterprise-role guard" \
            '  if [[ "$template" == P0_*' \
            '  fi'

      # The authorization change from case_f70516a1: who may approve a provisioning
      # request. Runs here because it fabricates its whole world — a TSV org
      # fixture through ORG_SNAPSHOT, a stub provisioner through PROV — so it
      # needs neither the database nor a company. It is the ONLY automated
      # coverage of that logic that CI can execute; test_request_queue.sh is
      # better evidence and stays operator-run for the reasons above.
      - name: responsible-leader authorization suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_responsible_leader.sh

      # case_b04b43a0. The sibling suite asks "who may decide?"; this one asks the
      # question an audit actually asks — can the RECORD still say what was
      # approved and why, six months later. Different question, different
      # failure modes, so it is a separate suite rather than more sections
      # bolted onto the one above. Same two offline seams (ORG_SNAPSHOT and a
      # stub PROV), so it needs no database and no credential either.
      - name: request-record integrity suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_request_record_integrity.sh

      # case_1695ae38. The provisioner's half of the offline story: ORG_SNAPSHOT
      # serves the provisioner's reads and policy refusals from a checked-in
      # fixture with byte-identical verdicts, refuses writes read-only, and
      # drives the queue's approve/reject/ceiling-skip matrix without a
      # database and without a credential. Same hermetic shape as the suites
      # above, so it runs in this job rather than privilege-suites.
      - name: org-snapshot offline suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_org_snapshot.sh

      # verify-fast --parse-only exits before its local full-tier suites. Run
      # receipt-only rejection regressions explicitly; fixtures need no root,
      # database, credentials, network, or live operator queue.
      - name: queue-packet reject offline suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_op_queue_reject.sh

      # case_1b34645a. A third question again: the first two ask who may decide and
      # whether the record survives, this one asks whether the REQUESTER ever
      # finds out. It also carries the containment half — that a failed or
      # hostile notifier cannot block, alter or re-target a decision — which is
      # the part that turns a convenience feature into an authorization
      # concern. Third offline seam: REQUEST_NOTIFY_CMD, a stub transport, so
      # "delivery failed" is a case the suite CAUSES rather than waits for.
      - name: decision-notification suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_decision_notify.sh

      # case_3fa83f90. The mirror question: whether the DERIVED LEADER is told there
      # is something to decide. It also exercises containment at both transport
      # call sites — submit and `notify --drain` — plus the legitimate race where
      # a review overlaps an honest slow delivery and must not be disputed.
      - name: leader-notification suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_leader_notify.sh

      # case_d397158f. A fourth question in the same series, and the one that makes
      # the other three conditional: the record can be perfect and the notifier
      # flawless, and the request still never gets decided because the agent it
      # was routed at cannot be woken. On this company that is the common case
      # rather than the edge — 138 of 144 agents carry wakeOnDemand=false.
      #
      # Fourth offline seam: LIVENESS_SOURCE_CMD, so reachability is something
      # the suite DICTATES rather than reads from a database. That is what lets
      # it run here, and it is also what lets it test the states a real
      # database will not produce on demand — an unset flag, an unparseable
      # one, a liveness source that is simply down.
      #
      # Two of its sections pin known-wrong READINGS rather than ordinary
      # behaviour: that an unset wakeOnDemand never reads as reachable (the
      # top-level path reads unset for EVERY agent, so a regression there would
      # silently pass the whole roster), and that an unavailable
      # throttled-vs-disabled discriminator reports 'undetermined' instead of
      # guessing 'disabled'. Both were confirmed red under mutation, against a
      # green unmutated baseline.
      - name: notification-transport suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_notify_transport.sh

      # API base validation: every PAPERCLIP_API_KEY sender refuses a base
      # that is not an http(s) URL with a bare host before any request is
      # built. Hermetic (stub curl, env -i), no network, no credentials.
      - name: api-base-validation suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_paperclip_api_base_validation.sh

      # API base validation (Python senders): same malformed-base gate as
      # the shell suite above, for the urllib senders. Hermetic (mocked
      # urlopen), no network, no credentials.
      - name: api-base-validation-python suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -B -m unittest -v test_paperclip_api_base_validation_py

      # case_acb41886. The capability gate — the sibling of the provisioning queue,
      # for asks whose object is a CAPABILITY rather than an org seat. It runs
      # here for the same reason the three above do: it fabricates its whole
      # world through ORG_SNAPSHOT and touches no database, no credential and
      # no network. The part of it worth reading is how it asserts: every
      # refusal is pinned to the REASON that identifies which gate fired, never
      # to exit status alone, because a fail-closed neighbour catching the same
      # input is how assertions on this repo have gone green for the wrong
      # reason. Its section 10 then deletes each gate in a staging copy — after
      # a baseline on the UNMUTATED copy in the same directory — and requires
