      # holds TWO podman networks; the carrier declares ONE, and Quadlet
      # renders one --network= per key. Recreating as written drops the
      # OmniRoute leg — the model gateway every agent depends on — while
      # loopback /api/health stays GREEN. It fails green, which is why a human
      # reading the unit does not catch it and a comparison against host
      # evidence does.
      #
      # Authorization is READ from a record naming the exact commit and digest,
      # never declared by a flag. A gate whose green light is supplied by the
      # party who wants to proceed is a form, not a gate.
      #
      # Offline: the carrier, host evidence and authorization record are all
      # fixtures in mktemp. No podman, no host, no database, no credential.
      - name: case_35e86d49 host-validation activation gate suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_paperclip_activation_gate.sh

      # case_3dd27f43. capture_host_evidence.sh is what a human actually runs, once,
      # in a scarce host window. It shipped with NO test and in NO CI job, on
      # the strength of "verified against stubs" in a commit message — stubs
      # that were never committed, so nothing re-verified it after the next
      # edit. This is that suite, with those stubs committed.
      #
      # It also covers the case_3dd27f43 addition: the window now captures the image
      # digest as well as the networks. `paperclip-local` is a HOST-LOCAL image
      # in no registry, so no agent can resolve its digest — capturing only the
      # networks would have spent the one human window closing one red and left
      # `image_digest_placeholder` still refusing.
      #
      # Every refusal is asserted BY NAME, never by exit status: the script is
      # fail-closed on nearly every input, so rc=2 passes for fixtures that
      # never reach the check under test. Section 9 deletes each guard in a
      # staging copy and asserts the bad input is then ACCEPTED, so a control
      # that stops doing anything cannot keep a green suite.
      #
      # Offline: podman and systemctl are stubs on PATH in mktemp. No host, no
      # podman, no credential.
      - name: case_3dd27f43 host-evidence capture suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_capture_host_evidence.sh

      # case_3dd27f43. The SECOND operator script for the same host window.
      # `capture_host_render.sh` re-runs the Quadlet generator against the
      # two-leg carrier, which no host has ever generated: the checked-in
      # render was captured when the carrier declared ONE leg, so the binding
      # suite above is red and cannot go green from inside a container.
      #
      # Its decisive case is the one a naive script gets wrong. If the
      # generator emits ONE leg for a two-leg carrier, the script must WRITE
      # THAT DOWN and exit 0 while shouting — never refuse, never adjust the
      # output toward what we hoped for. A refusal there is indistinguishable
      # from a broken generator, and an operator would "fix" the carrier to
      # make it stop. Section 4 of the suite pins exactly that: rc=0, the
      # render written, the verdict shouted, and requiredTokens honestly
      # holding one leg.
      #
      # Section 8 deletes each guard in a staging copy — and asserts the
      # UNMUTATED script refuses that fixture FIRST. Without the baseline half,
      # "not refused after deletion" reads the same whether the guard is absent
      # or merely inert, which is how the first credential guard here (it
      # scanned the wrong side of KEY=value) scored green while section 6 was
      # red.
      #
      # Offline: podman, systemctl and the Quadlet generator are stubs on PATH
      # in mktemp; the fixture is a throwaway git repo holding the real
      # carriers. No host, no podman, no credential.
      - name: case_3dd27f43 host-render capture suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_capture_host_render.sh

      # case_3dd27f43. A relaxation of a fail-closed check, and its guard.
      #
      # Pinning the board-approved digest (step 3 of activation) edits
      # `Image=`, which changes the carrier bytes and would re-stale a
      # just-captured render — demanding a SECOND scarce human host window for
      # a render that could not have come out differently, since the capture
      # substitutes `Image=` away before the generator sees the unit. So the
      # binding now also compares a NORMALIZED hash and tolerates a raw
      # mismatch when only `^Image=` lines moved.
      #
      # That is a hole in a check whose whole job is to fail closed, so it is
      # mutated in BOTH directions: an Image= edit alone must be accepted, and
      # a dropped Network= leg, a flipped ReadOnly, a run-carrier edit, an
      # Image= edit BUNDLED with a capability edit, and a failed generator must
      # all still be refused.
      #
      # It has already earned its place twice. It caught the relaxation written
      # as two `and`-joined clauses — deleting the comparison left `is not
      # None`, true for every render, which would have swallowed ANY carrier
      # edit. And section 6 checks its own mutation by CONTENT, because this
      # mutation rewrites a line in place and a line-count check reports
      # "matched nothing" on a mutation that worked.
      #
      # Offline: fixture carriers and a synthesized render in mktemp, run
      # against the binding logic extracted from the suite itself so a copy
      # cannot drift. No host, no podman, no credential.
      - name: case_3dd27f43 carrier/render binding normalization
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_render_binding_normalization.sh


      # case_77f64939. A FOURTH drift question, about a defect in a bundle we do not
      # own. `tool_action_requests.expires_at` IS written — one hour out, by an
      # UPDATE one statement after the insert that leaves it NULL — and it is
      # published to the approver on the interaction card. Nothing enforces it:
      # both expiry sites are lazy and fire only when the REQUESTER re-invokes
      # the same tool with the same arguments on the same issue, and zero of the
      # four bundle modules touching the table register a `setInterval`. So the
      # approver is shown a deadline that no clock is holding.
      #
      # case_77f64939 originally reported that the column "is never set", having read
      # only the insert. Sending that fix upstream would have added a write that
      # is already there and left the missing clock in place. The probe encodes
      # the corrected finding so nobody re-derives the wrong one.
      #
      # Offline: the suite builds a synthetic bundle in mktemp and puts a fake
      # `psql` on PATH, so it needs no Paperclip server and no database. Green
      # here means the DETECTOR works — it is NOT a statement about the deployed
      # server, which CI cannot see. Run `./approval_timeout_probe.sh` where
      # /app/server/dist and the database are reachable.
      - name: tool-approval deadline enforcement probe suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_approval_timeout_probe.sh

      # case_9a66c8e1. Whether the model endpoint the agents are about to be pointed
      # at can actually serve them. The suite stands up a stub Anthropic front
      # on 127.0.0.1 that serves a different failure off each path prefix —
      # PAYG lane, missing cache accounting, wrong dialect, 401, a hang — so it
      # needs no credential, no network and no quota.
      - name: model-endpoint preflight suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_agent_endpoint_preflight.sh

      # case_79802e8d. The CLIProxy quota-controller release handoff: the gate that
      # refuses to move session affinity off the owner's 15m, to build an
      # unsupported CLIProxy version, or to build a source ref that is not on
      # the trusted line. Offline: the suite mutates copies of the shipped
      # runbook in mktemp and passes the measured values as arguments, so it
      # touches no host, no credential and no CLIProxy.
      #
      # On a shallow clone the reviewed case_6a656110 commit is not an object here,
      # so the apply-mode positive control reports SKIPPED and the apply path
      # is asserted to fail closed instead. The rollback-mode positive control
      # always runs, so the suite can never go vacuous unnoticed.
      - name: CLIProxy release preflight suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_cliproxy_release_preflight.sh

      # case_62253f66. The CLIProxy quota-controller unit suite: planning and
      # apply decisions over synthetic telemetry. Offline: pure fixtures
      # in-process, no host, credential, network, or CLIProxy.
      - name: CLIProxy quota controller suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_cliproxy_quota_controller.py

      # case_4644eef1. The offline stub proves its argv/environment detectors can
      # catch exposed credentials, then requires private transport and rejects
      # incomplete or malformed OmniRoute responses.
      - name: OmniRoute chain verifier credential suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_case_14663e5d_verify_chain_argv.sh

      # Same credential boundary for the operator-side registration script:
      # management auth and the CLIProxy connection key must stay out of argv
      # and child environments, including on its default dry-run path.
      - name: OmniRoute registration credential suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_case_e0ea2252_register_cliproxy_argv.sh

      # case_dfdddcf0. Whether teamclaude stops sending traffic to a quota-spent
      # Claude account, read out of the pacer's jsonl. Every case is a
      # synthetic feed in a temp dir, so this needs no quota, no network and no
      # credential. It exists mainly to hold two things still: that the verdict
      # follows BURN DELTA and not the `is_current` field (which was measured
      # pointing at the idle account for an hour), and that a feed in which
      # nothing ever reached the threshold exits 4 rather than reading green.
      - name: teamclaude rotation watcher suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_quota_rotation_watch.sh
      # case_2706af46. Who can actually resolve a pending issue-thread interaction.
      # The gate order this encodes was re-derived from the deployed server
      # build, and it corrected two claims that had been carried forward as
      # fact — most importantly that an UNASSIGNED issue passes the assignee
      # gate for every agent rather than blocking them. Getting that backwards
      # is what left 13 answerable questions sitting on the owner's queue, so
      # the suite asserts each verdict against the source line that produced
      # it and then deletes each gate to prove the naming test goes red.
      # Pure stdin/stdout: no database, no credentials, no network.
      - name: live-path acceptance self-test (mutation-gated)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./mcp/deploy/acceptance_live_selftest.sh

      # The case_4ea7d92e host-cron wrappers post security findings unattended with
      # a long-lived agent key. Until case_8891d115 nothing here executed them --
      # only "Syntax check every script" touched them -- and a dead findings
      # path (rc read after an unguarded command substitution under set -e)
      # shipped through review: a real finding produced ZERO API calls. This
      # suite runs the wrappers against stub detectors and a loopback stub API
      # and pins findings-only, fail-closed, coalescing, and the rule that
      # neither the key nor the card body reaches curl's argv. Each contract
      # carries a positive control, including a rebuild of the exact case_8891d115
      # bug, so the suite cannot go quietly vacuous.
      - name: case_4ea7d92e host-check contracts (mutation-gated)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_case_d376bf4e_host_checks.sh

      # case_30b51a0f (WS7 of case_dc8671fe): every recurring clock that can act on the
      # installation is one registry entry, and "consolidated" is a set of checks
      # rather than a sentence: one primary per purpose, one primary writer per
      # target, every timer-driven service time-bounded, nothing recurring left
      # unregistered. A new .timer, plugin job schedule or workflow cron fails here
      # until it is classified. The suite carries a positive control for each
      # invariant (a mutated tree or registry that must go red) and drives the
      # read-only host capture through a fake systemctl, asserting that no
      # environment value reaches its output and no mutating verb is ever issued.
      - name: host timer registry (offline, mutation-controlled)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          if python3 -c 'from public_snapshot_test_support import private_artifact_absent; raise SystemExit(0 if private_artifact_absent(".", "ops/case_30b51a0f/host-timer-registry.json") else 1)'; then
            printf '%s\n' 'SKIP: private installed timer inventory is absent from the marked public snapshot; all synthetic registry and capture controls run below'
          else
            python3 ops/case_30b51a0f/host_timer_registry_check.py
          fi
          cd ops/case_30b51a0f && python3 -m unittest -v test_host_timer_consolidation

      # case_0bf02bac. The home-PC guard reconciles CI_nodecf677d86_RUNNER with
      # home-PC runner liveness: set while an idle two-node93f4bccf runner exists,
      # cleared within one 2-minute tick of the last one going offline, so
      # jobs never queue on an absent PC. Offline: the GitHub API is
      # stubbed in-process (no network, no credential, no host). The
      # deployment suite builds a real bundle and pins the case_b4863264 shape
      # (reviewed bytes in, release-scoped manifest, unit preflight proven
      # before INSTALLED).
      - name: home-PC runner guard suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_ci_node93f4bccf_guard.py

      - name: home-PC guard deployment contract suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_ci_node93f4bccf_guard_deployment.py

      # "No secrets in this repo, ever" is a stated non-negotiable, so it gets
      # an assertion rather than a promise. The scan itself now lives in the
      # always-run `secret-scan` job (CI standard: secrets always run, even on
      # docs-only and draft PRs); this step keeps the offline copy so a red
      # scan also fails the suite that owns the fixture surface.
      #   Suites assemble token-shaped canaries from fragments at runtime
      # precisely so the scan does not trip on a test fixture.
      - name: Secret scan
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./verification/secret-scan.sh

      # case_3d790dcb. Asserts on the kernel's record — a stub curl on PATH reading
      # its own /proc/<pid>/cmdline — rather than on the source text, so a
      # future rewrite of how gh_token.sh calls curl cannot pass by accident.
      - name: gh_token.sh argv-leak suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_gh_token_argv.sh

      # The matching mutation guard. This one is surgical: it leaves the config
      # file exactly as it is and ADDS the header back on argv, so every other
      # assertion in the suite still passes and only the /proc check can go red.
      # That is the point — it proves the /proc detector is what carries this
      # suite, not the config-file bookkeeping around it.
      - name: Prove the argv-leak suite still detects a credential on argv
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh_token.sh test_gh_token_argv.sh "$mut/"
          chmod +x "$mut/gh_token.sh" "$mut/test_gh_token_argv.sh"
          # case_b04b43a0's rule, applied here too: the UNMUTATED copy must pass in
          # this same staging directory FIRST. Without it, "the mutated suite
          # failed" is not attributable to the mutation — the staged copy could
          # be failing for any reason at all (a missing sibling file, a change
          # in how GH_TOKEN_SH is resolved) and this gate would still go green
          # while proving nothing. It passes today; this keeps it honest.
          if ! GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_argv.sh" > "$mut/base.txt" 2>&1; then
            echo "::error::the UNMUTATED copy of test_gh_token_argv.sh already fails in the staging dir — this gate proves nothing"
            tail -25 "$mut/base.txt"
            exit 1
          fi
          before='  curl --config "$cfg" "$@"'
          after='  curl --config "$cfg" -H "Authorization: Bearer $bearer" "$@"'
          if ! grep -qxF "$before" "$mut/gh_token.sh"; then
            echo "::error::could not find the curl invocation in curl_authed() to mutate; this guard is now blind, fix it"
            exit 2
          fi
          # awk, not sed: the replacement is full of characters sed would treat
          # as syntax, and a mutation that silently does nothing is the one
          # failure mode this step exists to avoid.
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh_token.sh" > "$mut/gh_token.mut" && mv "$mut/gh_token.mut" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          bash -n "$mut/gh_token.sh"
          if GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_argv.sh" > "$mut/out.txt" 2>&1; then
            echo "::error::the argv-leak suite PASSED against a credential deliberately put back on argv"
            cat "$mut/out.txt"
            exit 1
          fi
          grep -c 'FAIL' "$mut/out.txt" | xargs -I{} echo "suite correctly reported {} failures against the mutant"

      # case_7cbfeac4. cliproxy_mgmt_recon.sh must never place the live management
      # key on any child's argv: the bearer travels in a 0600 curl --config
      # file and the redactor is a pure-bash builtin loop (an earlier draft
      # ran sed -e "s/$KEY/..." on every 200 response, leaking the key on
      # sed's cmdline). Same seams as the gh_token suites above: a stub curl
      # reading its own /proc/<pid>/cmdline plus a sed wrapper on PATH, a
      # fabricated canary, `env -i`. Without this step the suite runs only in
      # the full local verify-fast tier while CI runs --parse-only, so a
      # regression only it catches would merge green.
      - name: cliproxy mgmt recon argv-leak suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_cliproxy_mgmt_recon_argv.sh

      # case_154364ee. The third property of gh_token.sh's `api` path, and the one
      # that was wrong: the request BODY must reach the request. It did not.
      # curl_authed's body slot was hardcoded empty and the caller's JSON was
      # passed positionally instead, so curl parsed it as a URL and the write
      # went out with no body — dropping a `sha` head guard from a real merge
      # and turning a requested squash into a merge commit, silently, while
      # reporting failure for a write that had actually succeeded.
      #
      # Same seams as the two suites above: a stub curl on PATH, a fabricated
      # credential environment, `env -i`. No network, no credential.
      - name: gh_token.sh api request-body suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_gh_token_api_body.sh

      # Its mutation guard. Three mutations, because the fixes fail independently
      # and a single mutation would leave one of them ungated:
      #
      #   body-slot-collision   restores the original call — body slot empty,
      #                         JSON passed positionally. Surgical: the
      #                         argument PARSING is left alone, so sections
      #                         5/7/8/10 stay green and only the assertions
      #                         about the body and the exit status can go red.
      #                         That is the point — it proves those assertions
      #                         carry this suite, not the parsing around them.
      #   unchecked-mint        restores `tok="$(mint_token)"` with no status
      #                         check. mint_token runs in a command
      #                         substitution, so its `exit 1` ends only the
      #                         subshell and the request went out with an empty
      #                         bearer. Both lines of the guard are removed:
      #                         leaving the `-n "$tok"` check in place would let
      #                         a NEIGHBOURING gate satisfy the test, which is
      #                         how assertions in this repo have gone green for
      #                         the wrong reason before.
      #   http-status-ignored   routes `api` back through curl_authed, restoring
      #                         the case_0f02ebcd false success: GitHub's 409 body is
      #                         printed, but the command exits 0 and `&& merged`
      #                         runs. The named red assertions require the exit
      #                         status AND body-preservation contract together.
      #
      # Each mutation asserts red on the NAMED assertions it should break, not
      # merely on a non-zero exit. "The suite failed" is satisfied by a suite
      # that failed to start.
      - name: Prove the api-body suite still detects a dropped request body
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          mut="$(mktemp -d)"
          cp gh_token.sh test_gh_token_api_body.sh "$mut/"
          chmod +x "$mut/gh_token.sh" "$mut/test_gh_token_api_body.sh"

          # case_b04b43a0's rule: the UNMUTATED copy must pass in this same staging
          # directory FIRST, or "the mutated suite failed" is not attributable
          # to the mutation.
          if ! GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_api_body.sh" > "$mut/base.txt" 2>&1; then
            echo "::error::the UNMUTATED copy of test_gh_token_api_body.sh already fails in the staging dir — this gate proves nothing"
            tail -30 "$mut/base.txt"
            exit 1
          fi

          plain() { sed 's/\x1B\[[0-9;]*m//g' "$1"; }

          # A mutant must go red on the assertion that NAMES the defect. A
          # mutant that merely exits non-zero could be failing at startup.
          require_red() {
            local out="$1"; shift
            local a
            for a in "$@"; do
              if plain "$out" | grep -qF "FAIL  $a"; then
                echo "    red on: $a"
              else
                echo "::error::mutant did not go red on '$a' — that assertion is not carrying this gate"
                plain "$out" | tail -30
                exit 1
              fi
            done
          }

          run_mutant() {
            local label="$1" out="$mut/$1.txt"
            bash -n "$mut/gh_token.sh"
            if GH_TOKEN_SH="$mut/gh_token.sh" "$mut/test_gh_token_api_body.sh" > "$out" 2>&1; then
              echo "::error::the api-body suite PASSED against mutation '$label'"
              plain "$out"
              exit 1
            fi
            echo "  mutation '$label' correctly rejected:"
          }

          # --- mutation 1: body-slot-collision ---------------------------------
          cp "$mut/gh_token.sh" "$mut/gh_token.orig"
          before='    curl_authed_http "$tok" "$method" "https://api.github.com${path}" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          after='    curl_authed_http "$tok" "$method" "https://api.github.com${path}" "" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          if ! grep -qxF "$before" "$mut/gh_token.sh"; then
            echo "::error::could not find the curl_authed call in the api arm to mutate; this guard is now blind, fix it"
            exit 2
          fi
          # awk, not sed: the replacement is full of characters sed would treat
          # as syntax, and a mutation that silently does nothing is the one
          # failure mode this step exists to avoid.
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh_token.sh" > "$mut/g" && mv "$mut/g" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          run_mutant body-slot-collision
          require_red "$mut/body-slot-collision.txt" \
            "the body did not reach the request as given" \
            "the request body reached curl's argv" \
            "the 'sha' head guard never reached GitHub" \
            "'merge_method' was dropped" \
            "a successful write reported failure"
          # The surgical half: the parsing sections must still pass, or this
          # mutation is proving something broader than it claims.
          for still_green in \
            "caller-supplied curl arguments still reach curl" \
            "a bare curl flag in the body slot is a usage error (exit 2)" \
            "a non-JSON body is a usage error (exit 2)"; do
            if ! plain "$mut/body-slot-collision.txt" | grep -qF "PASS  $still_green"; then
              echo "::error::mutation 'body-slot-collision' also broke '$still_green' — it is not surgical, so it does not isolate the body assertions"
              exit 1
            fi
          done

          # --- mutation 2: unchecked-mint --------------------------------------
          cp "$mut/gh_token.orig" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          b1='    tok="$(mint_token)" || exit $?'
          b2='    [[ -n "$tok" ]] || { echo "ERROR: minted an empty token; refusing to send the request" >&2; exit 1; }'
          a1='    tok="$(mint_token)"'
          for t in "$b1" "$b2"; do
            if ! grep -qxF "$t" "$mut/gh_token.sh"; then
              echo "::error::could not find the mint guard line to mutate; this guard is now blind, fix it"
              echo "  wanted: $t"
              exit 2
            fi
          done
          awk -v b1="$b1" -v b2="$b2" -v a1="$a1" \
            '$0 == b1 { print a1; next } $0 == b2 { next } { print }' \
            "$mut/gh_token.sh" > "$mut/g" && mv "$mut/g" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          run_mutant unchecked-mint
          require_red "$mut/unchecked-mint.txt" \
            "a failed mint exited 0" \
            "the request went out anyway"

          # --- mutation 3: http-status-ignored ----------------------------------
          cp "$mut/gh_token.orig" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          before='    curl_authed_http "$tok" "$method" "https://api.github.com${path}" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          after='    curl_authed "$tok" "$method" "https://api.github.com${path}" "$api_body" ${api_extra[@]+"${api_extra[@]}"}'
          if ! grep -qxF "$before" "$mut/gh_token.sh"; then
            echo "::error::could not find the HTTP-aware api call to mutate; this guard is now blind, fix it"
            exit 2
          fi
          awk -v b="$before" -v a="$after" '$0 == b { print a; next } { print }' \
            "$mut/gh_token.sh" > "$mut/g" && mv "$mut/g" "$mut/gh_token.sh"
          chmod +x "$mut/gh_token.sh"
          run_mutant http-status-ignored
          require_red "$mut/http-status-ignored.txt" \
            "HTTP 409 exited 0, expected 22" \
            "the composed caller contract broke"
          # Surgical: ignoring status must not discard the error body. This keeps
          # the mutation focused on the false-success half of the pair.
          if ! plain "$mut/http-status-ignored.txt" | grep -qF "PASS  HTTP 409 response body is still printed in full"; then
            echo "::error::mutation 'http-status-ignored' also lost the body — it does not isolate the exit-status assertion"
            exit 1
          fi

      # case_7f0105f1. The other half of gh_token.sh's contract: an unrecognised
      # subcommand printed usage on STDOUT and exited 0, so
      # `tok="$(gh_token.sh tokne)" && use "$tok"` took the `&&` with usage text
      # in $tok. Offline — fake credential environment, stub curl.
      - name: gh_token.sh dispatch-contract suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_gh_token_dispatch.sh

      # Its mutation guard, with a BASELINE. "The mutated suite failed" is
      # unattributable on its own — a staging dir that breaks the suite for an
      # unrelated reason (a missing sibling file, a copy that lost +x) produces
      # the same red as a working detector. So assert the UNMUTATED copy passes
      # in the same directory first, then mutate it there.
      #
      # Five mutations, one per independently-failing property. The first two
      # are the case_7f0105f1 halves; the last three are case_297df02e, which is the same
      # class one level down — the RIGHT subcommand, reached, failing silently.
      #
      #   catchall-exits-zero        restores the pre-case_7f0105f1 arm verbatim.
      #   help-below-preamble        keeps `help` recognised but moves it back
      #                              under the credential preamble, so `--help`
      #                              on a box with no ~/secure-drop dies with
      #                              "cannot read github-app.pem" instead of
      #                              answering. Only the two --no-creds cases
      #                              can catch that one; delete them and this
      #                              step goes red.
      #   jwt-arm-masks-failure      restores `jwt) app_jwt; echo ;;`, whose
      #                              status is echo's and therefore always 0.
      #   empty-signature-unchecked  drops the `[[ -n "$sig" ]]` guard, leaving
      #                              only the pipeline status. Caught by ONE
      #                              case — the openssl stub that exits 0 having
      #                              written nothing — because pipefail sees
      #                              success down the whole chain. Delete that
      #                              case and this step goes red.
      #   response-body-unvalidated  makes require_field always succeed, so a
      #                              {"message":"Bad credentials"} body renders
      #                              a report full of nulls and `check` reports
      #                              success. Caught by the STDOUT assertion:
      #                              the arm still exits non-zero afterwards,
      #                              by accident, when jq trips over a null.
      - name: Prove the dispatch suite still detects every regression
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0
          base="$(mktemp -d)"
          cp gh_token.sh test_gh_token_dispatch.sh "$base/"
          if ! (cd "$base" && ./test_gh_token_dispatch.sh > out.txt 2>&1); then
            echo "::error::the dispatch suite fails on an UNMUTATED copy in a staging dir; every mutation result below would be unattributable"
            cat "$base/out.txt"
            exit 1
          fi
          echo "baseline: unmutated copy passes in the staging dir"

          # awk, not sed: these lines are full of characters sed reads as
          # syntax, and a mutation that silently does nothing is the one
          # failure mode this step exists to avoid. The chmod is load-bearing —
          # the suite invokes the tool directly, so a rewrite that loses +x
          # makes every case fail with 126 and the mutant looks detected when
          # nothing was tested.
          #
          # Every replacement string stays on ONE line: this is a YAML block
          # scalar, and a continuation line indented less than the block would
          # silently end it and truncate the rest of this step.
          require_anchor() {
            grep -qxF "$2" "$1" && return 0
            echo "::error::could not find the anchor in $1; this guard is now blind, fix it:"
            echo "::error::  $2"
            exit 2
          }
          mutate() { # mutate <file> <before> <after>  — replace the line
            require_anchor "$1" "$2"
            awk -v b="$2" -v a="$3" '$0 == b { print a; next } { print }' \
              "$1" > "$1.mut" && mv "$1.mut" "$1"
            chmod +x "$1"
          }
          insert_above() { # insert_above <file> <anchor> <new-line>
            require_anchor "$1" "$2"
            awk -v b="$2" -v a="$3" '$0 == b { print a } { print }' \
              "$1" > "$1.mut" && mv "$1.mut" "$1"
            chmod +x "$1"
          }

          for m in catchall-exits-zero help-below-preamble jwt-arm-masks-failure \
                   empty-signature-unchecked response-body-unvalidated; do
            mut="$(mktemp -d)"
            cp gh_token.sh test_gh_token_dispatch.sh "$mut/"
            t="$mut/gh_token.sh"
            case "$m" in
              catchall-exits-zero)
                mutate "$t" '  *) refuse_usage "${1:-}" ;;' '  *) usage ;;' ;;
              help-below-preamble)
                mutate "$t" '  help|--help|-h) usage; exit 0 ;;' '  help|--help|-h) : ;;'
                # Put help back as an ordinary arm of the main case, i.e. below
                # the preamble. Without this the mutant merely stops recognising
                # help, which is a different and more obvious bug.
                insert_above "$t" '  check) app_check ;;' '  help|--help|-h) usage ;;' ;;
              jwt-arm-masks-failure)
                mutate "$t" '  jwt)   app_jwt || exit $?; echo ;;' '  jwt)   app_jwt; echo ;;' ;;
              empty-signature-unchecked)
                mutate "$t" '    || { echo "ERROR: signing with $PEM produced an empty signature" >&2; return 1; }' '    || :' ;;
              response-body-unvalidated)
                mutate "$t" '  jq -e "$1" >/dev/null 2>&1 <<<"$2" && return 0' '  return 0' ;;
            esac
            bash -n "$t" || { echo "::error::the '$m' mutant does not parse"; exit 2; }
            if (cd "$mut" && ./test_gh_token_dispatch.sh > out.txt 2>&1); then
              echo "::error::the dispatch suite PASSED against the '$m' mutant"
              cat "$mut/out.txt"; rc=1
            else
              echo "$m: suite correctly reported $(grep -c 'FAIL' "$mut/out.txt") failures"
            fi
          done
          exit $rc

      # Same discipline for the SQL backend seam. Both mutations below are
      # things a reasonable person would actually write; neither is a strawman.
      #
      # 1. Hand the URI to psql instead of decomposing it. This is the obvious
      #    one-liner, and it publishes the database password through
      #    /proc/*/cmdline on a host every company on the box shares.
      # 2. Auto-select the psql backend when DATABASE_URL happens to be set.
      #    This reads as a convenience and silently retargets the PROVISIONER —
      #    which creates and deletes real agents — at whatever that variable
      #    points to.
      #
      # THE COPY LIST IS PART OF THE GUARD, and case_e224f2ef proved it the hard way.
      # The suite reads every tool it makes assertions about, so a tool missing
      # from this staging directory fails the suite for a STAGING reason. The
      # job then reports "the mutant was correctly detected" — because the
      # suite did fail — while being completely blind to whether the mutation
      # had any effect at all. Adding gh_access.sh and skills.sh to section 10
      # did exactly that, silently, until the baseline below was written.
      # A tool added to test_sql_backend.sh must be added here too.
      - name: Prove the SQL backend suite still detects both unsafe shortcuts
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0
          stage() { # stage <dir> — the suite's full subject list, in one place
            cp -r lib "$1/"
            cp test_sql_backend.sh org_provisioner.sh org_request_queue.sh \
               org_access_review.sh test_privilege_ceilings.sh test_request_queue.sh \
               gh_access.sh skills.sh "$1/"
          }

          # BASELINE FIRST, in the same staging directory the mutants use. Not
          # ceremony: "the mutated suite failed" is unattributable on its own,
          # because a copy that fails for a staging reason fails identically.
          # This is the assertion that says the staging is complete, and it is
          # the one that catches a copy list that has fallen behind the suite.
          base="$(mktemp -d)"; stage "$base"
          if ! "$base/test_sql_backend.sh" > "$base/out.txt" 2>&1; then
            echo "::error::the UNMUTATED suite fails in the staging directory, so this job cannot attribute anything to a mutation. Most likely the copy list above has fallen behind test_sql_backend.sh."
            cat "$base/out.txt"; exit 2
          fi
          echo "baseline: the unmutated suite passes in the staging directory"

          for m in uri-on-argv sniff-database-url; do
            mut="$(mktemp -d)"
            stage "$mut"
            node -e '
              var fs = require("fs");
              var p = process.argv[1], which = process.argv[2];
              var s = fs.readFileSync(p, "utf8");
              var anchor = which === "uri-on-argv"
                ? "\n  psql \\\n"
                : "  local b=\"${PAPERCLIP_SQL_BACKEND:-podman}\"";
              if (s.indexOf(anchor) < 0) {
                console.error("::error::could not find the " + which + " anchor in lib/pcsql.sh; this guard is now blind, fix it");
                process.exit(2);
              }
              var repl = which === "uri-on-argv"
                ? "\n  psql \"$DATABASE_URL\" \\\n"
                : "  local b=\"${PAPERCLIP_SQL_BACKEND:-${DATABASE_URL:+psql}}\"; b=\"${b:-podman}\"";
              fs.writeFileSync(p, s.replace(anchor, repl));
            ' "$mut/lib/pcsql.sh" "$m" || exit 2
            bash -n "$mut/lib/pcsql.sh"
            if "$mut/test_sql_backend.sh" > "$mut/out.txt" 2>&1; then
              echo "::error::the SQL backend suite PASSED against the '$m' mutant"
              cat "$mut/out.txt"; rc=1
            else
              echo "$m: suite correctly reported $(grep -c 'FAIL' "$mut/out.txt") failures"
            fi
          done
          # Without this the job is decorative. `set -e` is deliberately not on
          # (a mutant is EXPECTED to fail its suite), so the block's status is
          # the status of `done` — which is the last `echo`, always 0. rc was
          # being set and then dropped, so a mutation that the suite failed to
          # detect printed ::error:: and left the build green. The sibling
          # dispatch guard above has always had this line; this one did not.
          exit $rc
      # case_39b2a64b. Three mutations, each the tempting simplification rather than
      # invented nonsense, and each one restores a specific undeserved green:
      #
      #   1. binary-check-preflight — replace the SELECT 1 round-trip with
      #      `command -v`. This is what someone reaches for when the preflight
      #      looks slow or noisy. It passes a podman with no paperclip-db
      #      container, so the suite runs anyway and fails halfway through.
      #   2. any-refusal — make refuses_because ignore its reason argument. The
      #      first time a gate's wording is edited and a suite goes red, this is
      #      the one-character-looking fix, and it restores case_39b2a64b exactly.
      #   3. empty-is-zero — put back `[[ "$left" -eq 0 ]]`. Reads as a harmless
      #      tidy-up; bash scores "" as 0, so the teardown reports a company it
      #      never looked at as clean.
      #
      # The BASELINE below is not ceremony. "The mutated suite failed" is
      # unattributable on its own — a copy that fails for an unrelated staging
      # reason looks identical. So the unmutated copy must pass in the same
      # directory first, and each mutant must go red on a NAMED assertion, not
      # merely somewhere.
      - name: Prove the precondition suite still detects each undeserved green
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0

          base="$(mktemp -d)"
          tar -cf - --exclude=.git . | (cd "$base" && tar -xf -)
          if ! "$base/test_suite_preconditions.sh" > "$base/out.txt" 2>&1; then
            echo "::error::BASELINE FAILED — the unmutated suite does not pass in a staging copy, so every mutant result below is unattributable"
            cat "$base/out.txt"; exit 1
          fi
          echo "baseline: $(grep -c 'PASS' "$base/out.txt") assertions passed in a staging copy"

          for m in binary-check-preflight any-refusal empty-is-zero; do
            mut="$(mktemp -d)"
            tar -cf - --exclude=.git . | (cd "$mut" && tar -xf -)
            anchor2=""; repl2=""
            case "$m" in
              binary-check-preflight)
                # Both conditions, so the mutant ACCEPTS on a bare binary check.
                # Disabling only the round-trip leaves the row check reading an
                # empty $out, which makes preflight refuse EVERYTHING — the
                # opposite mistake, and it reds the positive control instead of
                # the assertion this mutant is meant to expose.
                target="$mut/lib/pcsql.sh"
                anchor='  if ! out="$(pcsql_run -Atq -v ON_ERROR_STOP=1 <<<'"'"'SELECT 1;'"'"' 2>&1)"; then'
                repl='  if false; then'
                anchor2='  if ! grep -qx '"'"'1'"'"' <<<"$out"; then'
                repl2='  if false; then'
                want="accepted an erroring backend" ;;
              any-refusal)
                target="$mut/test_request_queue.sh"
                anchor='  if grep -qF -- "$why" <<<"$o"; then ok "$d"'
                repl='  if true; then ok "$d"'
                want="T0 cannot request a President/COO" ;;
              empty-is-zero)
                # BOTH halves, or the mutant is not the pre-case_39b2a64b code: gutting
                # qnum alone leaves `[[ "(no result)" -eq 0 ]]`, which trips
                # `set -u` and produces an unrelated red. Restoring the raw read
                # AND the arithmetic comparison is what reinstates the actual
                # false green, because bash scores "" as 0.
                target="$mut/test_request_queue.sh"
                anchor='qnum() { local v; v="$(q "$@")"; [[ "$v" =~ ^[0-9]+$ ]] && printf '"'"'%s'"'"' "$v" || printf '"'"'(no result)'"'"'; }'
                repl='qnum() { q "$@"; }'
                anchor2='if [[ "$left" == "0" ]]; then ok "no TESTQ-provisioned agents remain active"'
                repl2='if [[ "$left" -eq 0 ]]; then ok "no TESTQ-provisioned agents remain active"'
                want="teardown absence claim still passes" ;;
            esac
            # NOTE: $want must appear in the FAILURE text the suite prints, which
            # is the bad() message, not the ok() one. They are deliberately
            # different sentences, so matching the ok() wording here silently
            # makes every mutant read as unattributable.

            for a in "$anchor" "$anchor2"; do
              [[ -n "$a" ]] || continue
              if ! grep -qF -- "$a" "$target"; then
                echo "::error::could not find a '$m' anchor in $target; this guard is now blind, fix it"
                exit 2
              fi
            done
            node -e '
              var fs = require("fs");
              var p = process.argv[1], s = fs.readFileSync(p, "utf8");
              for (var i = 2; i + 1 < process.argv.length; i += 2) {
                var a = process.argv[i], r = process.argv[i + 1];
                if (!a) continue;
                if (s.indexOf(a) < 0) { console.error("::error::anchor vanished: " + a); process.exit(2); }
                s = s.replace(a, r);
              }
              fs.writeFileSync(p, s);
            ' "$target" "$anchor" "$repl" "$anchor2" "$repl2" || exit 2
            bash -n "$target" || { echo "::error::the '$m' mutant does not parse"; exit 2; }

            # empty-is-zero re-mutates a file the previous loop left alone, so
            # each mutant is applied to a fresh copy — never stacked.
            if "$mut/test_suite_preconditions.sh" > "$mut/out.txt" 2>&1; then
              echo "::error::the precondition suite PASSED against the '$m' mutant"
              cat "$mut/out.txt"; rc=1
              continue
            fi
            if grep -qF "FAIL" "$mut/out.txt" && grep -F "FAIL" "$mut/out.txt" | grep -qF -- "$want"; then
              echo "$m: suite correctly went red on its named assertion (\"$want\")"
            else
              echo "::error::the '$m' mutant made the suite fail, but NOT on \"$want\" — the red is unattributable"
              cat "$mut/out.txt"; rc=1
            fi
          done
          exit $rc

      # Same discipline for the CI status reader (case_b730ec29). Its entire value is
      # the refusal to call an unobserved CI green, so a suite that cannot
      # detect that refusal being weakened is decoration. Both mutations below
      # are the tempting ones, not invented nonsense:
      #
      #   1. Make `unknown` exit 0. This is what someone reaches for the first
      #      time exit 3 breaks a pipeline — and it silently restores the exact
      #      false green, because `if gh_ci_status.sh; then merge` goes green on
      #      a token that was denied.
      #   2. Drop the no-signal guard, so zero results from a readable source
      #      falls through to pass. That is the naive "all runs concluded
      #      success" predicate, which is vacuously true for an empty list.
      #
      # case_0020a490 adds the third failure mode and its mutations. A job GitHub
      # never ran reports `completed/failure` — identical to a real red in every
      # field — so an Actions outage was read as "fix your code" for 21 minutes
      # while four commits merged. The `non-started` verdict is what separates
      # them, and each mutation below removes one load-bearing piece of it.
      #
      # This gate used to assert only "the suite failed", which is not
      # attribution: a mutation that reddens some unrelated assertion looks
      # identical to one the gate actually caught, and keeps looking identical
      # after the assertion it was meant to pin has been DELETED. Per case_ab86fd07 /
      # case_3d790dcb it now requires, for every mutation:
      #
      #   * the UNMUTATED copy passes in the same staging directory, so a red
      #     below is attributable to the mutation rather than to the staging;
      #   * the named test is present and PASSING in that baseline — this suite
      #     has no skip verb, so "present and green before" is its zero-skips
      #     check, and it is what makes deleting the test fail the gate;
      #   * the mutated run goes red ON THAT NAMED TEST, not merely somewhere.
      - name: Prove the CI status suite still detects a weakened refusal
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0
          # ci_mutation <label> <sed-expr> <named test that must go red>
          ci_mutation() {
            local label="$1" expr="$2" expect="$3"
            local mut; mut="$(mktemp -d)"
            cp gh_ci_status.sh test_gh_ci_status.sh "$mut/"
            # The case_0020a490 cases are replayed from recorded API responses; without
            # them the suite hard-errors rather than skipping, which is the point.
            mkdir -p "$mut/test/fixtures"
            cp -R test/fixtures/gh_ci_status "$mut/test/fixtures/"

            local base
            base="$(cd "$mut" && ./test_gh_ci_status.sh 2>&1)"
            if [ $? -ne 0 ]; then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              printf '%s\n' "$base" | grep -a 'FAIL' | head -20; rm -rf "$mut"; return 1
            fi
            # Zero-skips equivalent for a suite with no skip verb: the assertion
            # this mutation is aimed at must EXIST and be GREEN before we mutate.
            # Delete the test and the gate fails here instead of reporting success.
            if ! grep -aqE "PASS.*$expect" <<< "$base"; then
              echo "::error::$label: no PASSING test matching /$expect/ in the baseline — the assertion this mutation pins has been renamed or deleted"
              rm -rf "$mut"; return 1
            fi

            sed -i "$expr" "$mut/gh_ci_status.sh"
            if ! bash -n "$mut/gh_ci_status.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s gh_ci_status.sh "$mut/gh_ci_status.sh"; then
              echo "::error::$label: the sed changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi

            local out status
            out="$(cd "$mut" && ./test_gh_ci_status.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the CI status suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # case_b730ec29: the two false greens.
          ci_mutation "unknown-exits-zero" 's/EXIT=3/EXIT=0/g' \
            'every source denied -> unknown, not pass' || rc=1
          ci_mutation "no-signal-is-a-pass" 's/^elif \[\[ "\$SIGNALS" -eq 0 \]\]; then/elif false; then/' \
            'readable but zero signals -> unknown, not pass' || rc=1

          # case_0020a490: the outage that read as a red build.
          #
          # 1. Delete the verdict outright. This is the shape of the bug as it
          #    shipped, and it is what a revert would produce.
          ci_mutation "nonstart-verdict-removed" \
            's/^elif \[\[ -n "\$CHECKS_NONSTART" \&\& -z "\$CHECKS_FAIL" \&\& -z "\$EXT_FAILED" \]\]; then/elif false; then/' \
            'a recorded account-block outage -> non-started, not fail' || rc=1
          # 2. Keep the classification but fold it back onto exit 1. The verdict
          #    string is then correct and every caller still branches to "fix
          #    your code" — the distinction exists in the exit code or nowhere.
          ci_mutation "nonstart-exits-as-a-red" 's/^  EXIT=5$/  EXIT=1/' \
            'a recorded account-block outage -> non-started, not fail' || rc=1
          # 3. Stop requiring the annotation text, leaving duration to decide.
          #    This is THE tempting simplification — it deletes an API call and
          #    looks right against the outage fixtures — and it misclassifies
          #    every fast genuine red, including our own 2s `bash -n` scan.
          ci_mutation "classified-by-duration-alone" \
            "s/^NONSTART_ANNOTATION_RE=.*/NONSTART_ANNOTATION_RE=''/" \
            'duration is not the classifier' || rc=1
          # 4. Ignore the annotation LEVEL. A successful run carries annotations
          #    too (24f0d30's are Node 20 deprecation warnings), so without the
          #    level check the text alone is a much weaker claim than it reads as.
          ci_mutation "annotation-level-ignored" \
            's/select(.annotation_level == "failure")/select(true)/' \
            'the billing text at warning level does not license non-started' || rc=1
          # 5. Report a probe that never completed as a clean one. The verdict is
          #    still correct here, so only the reporting assertion can catch it —
          #    and a caller that trusts `nonStartedProbe` would be told the
          #    question was asked and answered "no" when it was refused.
          ci_mutation "failed-probe-reads-clean" \
            's/NONSTART_PROBE="incomplete-\$acode"/NONSTART_PROBE="clean"/' \
            'a probe that could not complete says so' || rc=1
          # 6. Let a non-start outrank a genuine failure on the same commit.
          #    Wrong in the UNSAFE direction: there is real code to fix and this
          #    would report exit 5, "nothing here is your fault".
          ci_mutation "nonstart-outranks-a-real-red" \
            's/^elif \[\[ -n "\$CHECKS_NONSTART" \&\& -z "\$CHECKS_FAIL" \&\& -z "\$EXT_FAILED" \]\]; then/elif [[ -n "$CHECKS_NONSTART" ]]; then/' \
            'a real failure alongside non-starts -> fail, not non-started' || rc=1
          # 7. Tighten the duration prefilter to something that looks generous
          #    against the 2-3s fixtures. The recorded outage also contains a
          #    14-SECOND non-start, so a tight window silently stops classifying
          #    — the failure mode that has no symptom until the next outage.
          ci_mutation "prefilter-tightened" \
            's/GH_CI_NONSTART_MAX_SECONDS:-60/GH_CI_NONSTART_MAX_SECONDS:-1/' \
            'a recorded account-block outage -> non-started, not fail' || rc=1
          # 8. Trust the check-run id from the response body. The classification
          #    added a second authenticated call whose PATH contains a value the
          #    remote supplied; an id that is a traversal normalises onto another
          #    run's annotations, so the body gets to choose which annotations
          #    are consulted and can turn a genuine red into "not your fault".
          ci_mutation "check-run-id-trusted" \
            's/^is_check_run_id() {/is_check_run_id() { return 0;/' \
            'a check-run id that is not a number is never put in a request path' || rc=1
          exit $rc

      # Same discipline for the drift detector (case_dcef12ea). Its whole value is
      # noticing that two copies of a tool differ, so a suite that cannot detect
      # that ability being weakened is decoration. All three mutations below are
      # things a reasonable person would actually write:
      #
      #   1. Fingerprint the SIZE instead of the content. This is the obvious
      #      cheap version, and it is blind to exactly the edit that matters —
      #      a changed gate condition that happens to keep the byte count. It is
      #      also the same class of mistake as the test count (114 vs 156) that
      #      case_dcef12ea was found by: a fingerprint that collides.
      #   2. Make drift exit 0. What someone reaches for the first time exit 3
      #      breaks a pipeline, and it restores the false green wholesale.
      #   3. Fingerprint secret-shaped files too. Reads as removing a special
      #      case; publishes a hash oracle for a credential into whatever issue
      #      the report gets pasted into.
      #
      # Each goes through a BASELINE ASSERTION first: the unmutated copy must
      # pass in the same staging directory. Without that, "the mutated suite
      # failed" is unattributable — which is how two gates in this repo sat
      # vacuous for months before case_b04b43a0 found them.
      - name: Prove the drift suite still detects a weakened detector
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0
          # Third argument is the NAMED test that must go red. A bare "the suite
          # failed" is not attribution: a mutation that reddens some unrelated
          # assertion looks identical to one the gate actually caught, and stays
          # looking identical after the assertion it was meant to pin is
          # deleted. case_70ae2474 hit exactly that — an empty-fingerprint mutation
          # reddened nothing, because the assertion covering it was being
          # satisfied by the check standing next to it.
          drift_mutation() {
            local label="$1" expr="$2" expect="$3"
            local mut; mut="$(mktemp -d)"
            cp tool_drift.sh test_tool_drift.sh "$mut/"

            if ! (cd "$mut" && ./test_tool_drift.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_tool_drift.sh 2>&1 | tail -20); rm -rf "$mut"; return 1
            fi

            sed -i "$expr" "$mut/tool_drift.sh"
            if ! bash -n "$mut/tool_drift.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if cmp -s tool_drift.sh "$mut/tool_drift.sh"; then
              echo "::error::$label: the sed changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi

            local out status
            out="$(cd "$mut" && ./test_tool_drift.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the drift suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          drift_mutation "size-not-content" \
            's|^  { printf .blob %d\\0. "\$len"; cat "\$f"; } . sha1sum . cut -d. . -f1$|  printf "%040d" "$len"|' \
            'disagrees with git hash-object' || rc=1
          drift_mutation "drift-exits-zero"      's/EXIT_DRIFT=3/EXIT_DRIFT=0/' \
            'content change exits 0, want 3' || rc=1
          drift_mutation "secrets-fingerprinted" 's/^is_secretish() {/is_secretish() { return 1;/' \
            'a secret-shaped file was fingerprinted' || rc=1

          # case_70ae2474. The two coverage-gate mutations. Both restore a comparison
          # that measured the wrong directory reporting itself as clean, which
          # is worse than no detector: it retires the assumption it was supposed
          # to test, in the wrong direction.
          drift_mutation "empty-fp-reads-green" \
            's/if \[ "\$fp_entries" -eq 0 \]; then/if false; then/' \
            'emptiness check is not carrying its own weight' || rc=1
          drift_mutation "no-exec-reads-green" \
            's/if \[ "\$ref_exec" -gt 0 \] \&\& \[ "\$matched_exec" -eq 0 \]; then/if false; then/' \
            'a README made a wrong directory read as clean' || rc=1
          drift_mutation "manifest-includes-nonexec" \
            's/\$2=="blob" \&\& \$1=="100755"/$2=="blob"/' \
            'manifest listed a non-executable doc' || rc=1
          exit $rc

      # case_18155f0d. The authority gate. Its whole value is drawing a line a content
      # hash cannot draw, and it can fail in BOTH directions: shout at a comment
      # (and get muted, which is a deleted detector), or stay quiet about a
      # changed `auth` (and green-light a privilege escalation at the next
      # activation). Every mutation below is one of those two.
      #
      # Two of these caught real vacuity in the suite while it was being
      # written, and both were the same shape: the test was satisfied by the
      # gate standing NEXT to the one it named. Dropping `auth` from the
      # authority allowlist made the leaf UNCLASSIFIED, which also exits 4, so
      # an exit-code-only assertion stayed green while the field was no longer
      # recognised as authority-bearing at all. The suite now asserts the
      # verdict PAIRED WITH ITS OWN LEAF by adjacency, which is what makes
      # `auth-not-authority` and `pointer-not-authority` below able to go red.
      # A third — `routes-indexed-not-keyed` — was uncoverable because the
      # fixture's route swap was silently a no-op, so the case had been passing
      # without reordering anything.
      - name: Prove the rotation watcher still detects a wrong verdict
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0
          rotation_mutation() {
            local label="$1"; shift
            local mut; mut="$(mktemp -d)"
            cp quota_rotation_watch.py pacing_verdict.py test_quota_rotation_watch.sh "$mut/"
            mkdir -p "$mut/tests"
            python3 public_snapshot_test_support.py . "$mut" tests/dead-feed-2026-08-26.jsonl || { rm -rf "$mut"; return 1; }

            if ! (cd "$mut" && ./test_quota_rotation_watch.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_quota_rotation_watch.sh 2>&1 | tail -25); rm -rf "$mut"; return 1
            fi

            # Each mutation is "old<US>new" — a literal 0x1f separator, so the
            # patterns can carry newlines and quotes without escaping. Done with
            # `python3 -c` and NOT a heredoc on purpose: a heredoc terminator has
            # to sit at column 0, which would close this YAML block scalar early
            # and silently truncate the step.
            local e
            for e in "$@"; do
              python3 -c 'import sys; p, ex = sys.argv[1], sys.argv[2]; o, n = ex.split("\x1f", 1); s = open(p).read(); open(p, "w").write(s.replace(o, n))' "$mut/quota_rotation_watch.py" "$e"
            done
            if cmp -s quota_rotation_watch.py "$mut/quota_rotation_watch.py"; then
              echo "::error::$label: the edit changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi
            if ! python3 -m py_compile "$mut/quota_rotation_watch.py"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            if (cd "$mut" && ./test_quota_rotation_watch.sh >/dev/null 2>&1); then
              echo "::error::$label: the rotation suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # The lying field: decide rotation from is_current instead of burn.
          rotation_mutation "verdict-from-is_current" \
            "$(printf '    elif best > epsilon:\n        verdict = "ROTATED"\x1f    elif not (samples[hi]["accounts"].get(spent) or {}).get("is_current"):\n        verdict = "ROTATED"')" || rc=1
          # Watching OUR pause gate and calling it teamclaude's rotation.
          rotation_mutation "threshold-is-our-gate" \
            "$(printf 'SWITCH_THRESHOLD = 0.98\x1fSWITCH_THRESHOLD = 0.95')" || rc=1
          # Measured nothing, reported success — the failure this repo exists for.
          rotation_mutation "nothing-observed-reads-green" \
            "$(printf 'overall, code = "NOT_OBSERVED", 4\x1foverall, code = "ROTATED", 0')" || rc=1
          # An idle fleet counted as proof that rotation works.
          rotation_mutation "idle-counts-as-rotation" \
            "$(printf 'verdict = "INCONCLUSIVE_IDLE"\x1fverdict = "ROTATED"')" || rc=1
          # A null bucket splits one episode into two undersized halves.
          rotation_mutation "null-breaks-episode" \
            "$(printf '        if val is None:\n            continue\x1f        if val is None:\n            val = 0.0')" || rc=1
          # Burn measured across the whole feed instead of within the episode.
          rotation_mutation "delta-spans-whole-feed" \
            "$(printf 'spent_d = weekly_delta(samples, lo, hi, spent)\x1fspent_d = weekly_delta(samples, 0, len(samples)-1, spent)')" || rc=1
          exit $rc

      # case_ba5ec666. The brake's INPUT, which is the half case_778963fd got right in
      # mechanism and wrong in measurement. Every mutation below is the shortest
      # path back to a shipped defect, and each names the test that must go red
      # — a bare "the suite failed" is not attribution, and §6's four exit-5
      # gates already proved in this repo that an exit-code-only assertion can
      # be satisfied by the gate standing next to the one being tested.
      - name: Prove the brake still derives its burn rather than reading it
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0
          brake_mutation() {
            local label="$1" expect="$2"; shift 2
            local mut; mut="$(mktemp -d)"
            cp quota_brake.sh pacing_verdict.py test_quota_brake.sh quota_brake_exempt.txt "$mut/"
            mkdir -p "$mut/tests"
            python3 public_snapshot_test_support.py . "$mut" tests/dead-feed-2026-08-26.jsonl || { rm -rf "$mut"; return 1; }

            # Baseline first. Without it "the mutated suite failed" is
            # unattributable, which is how two gates in this repo sat vacuous
            # for months before case_b04b43a0 found them.
            if ! (cd "$mut" && ./test_quota_brake.sh >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && ./test_quota_brake.sh 2>&1 | tail -25); rm -rf "$mut"; return 1
            fi

            # "old<US>new" with a literal 0x1f separator, applied by python3 -c
            # and NOT a heredoc: a heredoc terminator has to sit at column 0,
            # which closes this YAML block scalar early and silently truncates
            # the step. Same reason as the rotation gate above.
            local e
            for e in "$@"; do
              python3 -c 'import sys; p, ex = sys.argv[1], sys.argv[2]; o, n = ex.split("\x1f", 1); s = open(p).read(); open(p, "w").write(s.replace(o, n))' "$mut/quota_brake.sh" "$e"
            done
            if cmp -s quota_brake.sh "$mut/quota_brake.sh"; then
              echo "::error::$label: the edit changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi
            if ! bash -n "$mut/quota_brake.sh"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            local out status
            out="$(cd "$mut" && ./test_quota_brake.sh 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the brake suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            if ! grep -aqE "FAIL.*$expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but no test matching /$expect/ failed — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -a 'FAIL' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # 1. THE REVERT. Read the producer's field instead of the derived
          #    rate. This is precisely what shipped in #65, and it is what
          #    anyone reaches for who finds the jq hard to follow. On an idle
          #    account it selects LEVEL3 — concurrency 1 across the roster while
          #    nothing is burning.
          brake_mutation "burn-read-not-derived" 'RELEASES instead of flooring' \
            "$(printf '( if $d.source == "derived" then $d.burn else $acc.burn_per_day end ) as $burn\x1f( $acc.burn_per_day // $d.burn ) as $burn')" || rc=1
          # 2. THE SILENT FALLBACK. Keep the derivation, delete the label. The
          #    plan is then identical whether it was measured or estimated,
          #    which is the state case_ba5ec666 exists to end: an estimate that reads
          #    as a measurement is worse than a loud estimate.
          brake_mutation "fallback-is-silent" 'warns that this was not measured' \
            "$(printf 'if [[ "$source" != "derived" ]]; then\x1fif false; then')" || rc=1
          # 3. --require-derived NEUTERED. The monitor path's only hard gate.
          brake_mutation "require-derived-is-a-noop" 'require-derived on a fallback is exit 5' \
            "$(printf 'if [[ -n "$PACE_REQUIRE_DERIVED" || "$require_derived" == yes ]]; then\x1fif false; then')" || rc=1
          # 4. RESET TRUNCATION REMOVED. A window spanning the weekly reset then
          #    derives a large negative rate, clamps to 0 and RELEASES the brake
          #    at the exact moment a fresh week's quota is all in front of you.
          brake_mutation "reset-not-truncated" 'spanning a reset derives from the NEW week only' \
            "$(printf '| select($series[.].weekly < ($series[. - 1].weekly - $rd)) ] | last // 0 ) as $floor\x1f| select(false) ] | last // 0 ) as $floor')" || rc=1
          # 5. THE NEGATIVE CLAMP REMOVED. `weekly` is rounded to 0.01, so a
          #    flat account steps -0.01 and derives a negative burn — which
          #    beats every positive account in max_by and reports the pool as
          #    healthier than its worst member.
          brake_mutation "negative-burn-allowed" 'rounding step clamps to zero burn' \
            "$(printf 'burn: ( [ 0, (($end.weekly - $start.weekly) / $dt_days) ] | max ),\x1fburn: (($end.weekly - $start.weekly) / $dt_days),')" || rc=1
          # 6. THE MINIMUM WINDOW REMOVED. Any two adjacent samples are then
          #    "derived", and at a 15-minute gap the 0.01 quantum is +/-0.96/day
          #    — 32x sustainable. That is not a measurement, it is the reported
          #    field's instability re-created in our own code.
          brake_mutation "min-window-ignored" 'cannot derive; it falls back' \
            "$(printf 'elif (($dt_days * 24) < $mw) then\x1felif false then')" || rc=1
          # 7. case_c5f23cb9. THE TARGET QUIETLY REVERTED. `1 - PACE_TARGET` is a
          #    RESERVE sized against the brake's own reaction lag (~15 min of
          #    producer cadence, plus the drain of runs already in flight), not
          #    a decision to leave 10% of a subscription unspent — cap_for()
          #    never exceeds the captured baseline, so this knob can only lower
          #    consumption, never raise it. That makes 0.90 read like a mistake
          #    to anyone who has not read the header, and it is one character
          #    from being "corrected" back. §10 measures the default through the
          #    tool's own arithmetic rather than by grepping for the literal.
          brake_mutation "pace-target-reverted" 'the DEFAULT target computes sustainable at 0.90' \
            "$(printf 'PACE_TARGET="${PACE_TARGET:-0.90}"\x1fPACE_TARGET="${PACE_TARGET:-0.97}"')" || rc=1
          # 8. case_c5f23cb9. THE PASSED-TARGET PIN REMOVED. Once `weekly` passes the
          #    target `sustainable` goes NEGATIVE, and a bare burn/need is then
          #    negative too — which sails under the ladder's `ratio <= 1.0` rung
          #    and RELEASES the brake on an already-overspent week. At 0.90 that
          #    is a routine late-week reading rather than a corner case: both
          #    accounts were past it on 2026-08-25.
          brake_mutation "passed-target-releases" 'selects LEVEL3' \
            "$(printf 'ratio: (if $need <= 0 then 999 else ($burn / $need) end),\x1fratio: ($burn / $need),')" || rc=1
          # 9. case_46ea950c. THE PRODUCTION STALENESS GUARD REMOVED. Before this
          #    mutant existed, `pacing_verdict.py` and the dead-feed fixture
          #    were COPIED into this staging directory as inputs and never
          #    mutated — a gate that copies a file it never mutates does not
          #    guard it. Measured on the reviewed commit: turning the whole
          #    guard block off left all 158 brake checks green, because the
          #    only stale fixture in the suite was ALSO refused by the
          #    "no derivable burn" path. §6h is the fixture that separates
          #    them, and this is the mutation it exists to kill: an 18-hour-dead
          #    feed returning {"ratio":999,"verdict":"LEVEL3"} at exit 0, which
          #    is maximum throttle across the roster with no living producer —
          #    the case_5c4a5db1 incident exactly.
          brake_mutation "stale-guard-bypassed" 'refused for the STALENESS reason specifically' \
            "$(printf 'if [[ -z "$PACE_SOURCE_CMD" ]]; then\n    guard_file=\x1fif false; then\n    guard_file=')" || rc=1
          # 10. THE GUARD RUNS AND ITS ANSWER IS DISCARDED. One rung subtler
          #     than 9 and it fails identically: paying for the verdict and
          #     then not branching on it is the same outage with a longer
          #     receipt. Kept separate because a repair to 9 (restore the
          #     block) does not imply a repair to 10.
          brake_mutation "stale-guard-result-ignored" 'refused for the STALENESS reason specifically' \
            "$(printf 'if (( guard_rc != 0 )); then\x1fif false; then')" || rc=1
          exit $rc

      # case_46ea950c. The staleness cutoff itself, which until now NOTHING mutated.
      # `pacing_verdict.py` was a copied input to the two gates above and the
      # subject of neither, and its own suite could not see the cutoff either:
      # changing `if age > max_age_minutes:` to `if age > 1000000000:` left all
      # five quota suites — 282 declared checks — green. The suite's one stale
      # case was the acceptance fixture, whose expired weekly_reset_utc values
      # trip a second, independent guard, so it proved "the dead feed is
      # refused" and never "a stale sample is refused".
      #
      # 120 is a number in a safety cutoff, which by this repo's standing rule
      # means it belongs in a gate rather than in a comment somebody trusts.
      # Both directions are mutated: widening the cutoff lets a dead feed read
      # live, and flipping the boundary comparison moves it by one minute in a
      # way no other case in the suite can see.
      - name: Prove the 120m staleness cutoff is load-bearing (mutation-gated)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          set -uo pipefail
          rc=0
          pacing_mutation() {
            local label="$1" expect="$2"; shift 2
            local mut; mut="$(mktemp -d)"
            cp pacing_verdict.py test_pacing_verdict.py "$mut/"
            mkdir -p "$mut/tests"
            python3 public_snapshot_test_support.py . "$mut" tests/dead-feed-2026-08-26.jsonl || { rm -rf "$mut"; return 1; }

            # Baseline in the SAME staging directory. The helper carries the
            # exact reviewed public-only absence boundary; nonpublic missing
            # input fails staging. Synthetic staleness controls always run,
            # and every mutant still needs its named assertion failure.
            if ! (cd "$mut" && python3 -m unittest test_pacing_verdict.py >/dev/null 2>&1); then
              echo "::error::$label: the UNMUTATED copy already fails — this gate proves nothing"
              (cd "$mut" && python3 -m unittest test_pacing_verdict.py 2>&1 | tail -25); rm -rf "$mut"; return 1
            fi

            local e
            for e in "$@"; do
              python3 -c 'import sys; p, ex = sys.argv[1], sys.argv[2]; o, n = ex.split("\x1f", 1); s = open(p).read(); open(p, "w").write(s.replace(o, n))' "$mut/pacing_verdict.py" "$e"
            done
            if cmp -s pacing_verdict.py "$mut/pacing_verdict.py"; then
              echo "::error::$label: the edit changed nothing — the code moved and this gate is blind"
              rm -rf "$mut"; return 1
            fi
            if ! python3 -m py_compile "$mut/pacing_verdict.py"; then
              echo "::error::$label: the mutation broke the parse; it would fail for the wrong reason"
              rm -rf "$mut"; return 1
            fi
            local out status
            out="$(cd "$mut" && python3 -m unittest test_pacing_verdict.py 2>&1)"; status=$?
            if [ "$status" -eq 0 ]; then
              echo "::error::$label: the pacing suite PASSED against the mutation"
              rm -rf "$mut"; return 1
            fi
            # Attribution, for the same reason the two gates above carry it: a
            # bare "the suite failed" cannot distinguish the check under test
            # from the one standing next to it.
            if ! grep -aqE "FAIL: $expect" <<< "$out"; then
              echo "::error::$label: the suite went red, but $expect did not fail — it is failing for an unrelated reason, so this mutation is not actually covered"
              grep -aE '^(FAIL|ERROR):' <<< "$out" | head -20
              rm -rf "$mut"; return 1
            fi
            rm -rf "$mut"; echo "  ok  $label"
          }

          # 1. THE CUTOFF DISABLED. Nothing is ever too old. This is M1 from the
          #    case_46ea950c review, verbatim.
          pacing_mutation "age-cutoff-disabled" 'test_02_121m_is_unknown' \
            "$(printf 'if age > max_age_minutes:\x1fif age > 1000000000:')" || rc=1
          # 2. THE CUTOFF WIDENED TO A WEEK. The plausible version of 1: not a
          #    disabled guard, a "generous" one. The dead feed was nine days
          #    old, so this still catches the incident and still reads a
          #    six-hour-dead producer as a live measurement.
          pacing_mutation "age-cutoff-widened-to-a-week" 'test_02_121m_is_unknown' \
            "$(printf 'MAX_AGE_MINUTES = 120\x1fMAX_AGE_MINUTES = 10080')" || rc=1
          # 3. THE BOUNDARY FLIPPED. `>` to `>=`, one character, and every case
          #    in the suite except the exact-120m pin agrees with both. The
          #    limit is INCLUSIVE by decision, not by accident.
          pacing_mutation "boundary-flipped-to-exclusive" 'test_02_exactly_120m_is_live_limit_is_inclusive' \
            "$(printf 'if age > max_age_minutes:\x1fif age >= max_age_minutes:')" || rc=1
          # 4. THE SECOND DOOR. `read_verdict_rows` is the entry point the brake
          #    and rotation watch actually call. A cutoff enforced on the file
          #    path and not this one is the shape a partial fix takes.
          pacing_mutation "rows-path-skips-validation" 'test_stale_row_is_unknown' \
            "$(printf 'return read_verdict_sample(best, max_age_minutes, now, source)\x1freturn read_verdict_sample(best, 1000000000, now, source)')" || rc=1
          exit $rc

      # case_9c11948c mutation guard, with a BASELINE and NAMED expected failures.
      #
      # Three rungs, because the first two have both been passed vacuously in
      # this repo before:
      #
      #   1. BASELINE — the unmutated copy must pass in the same staging dir.
      #      Without it, a staging dir that breaks the suite for an unrelated
      #      reason (a lost +x, a missing sibling) produces the same red as a
      #      working detector, and "the mutant failed" is unattributable.
      #   2. THE NAMED TEST MUST EXIST — each expected-red assertion has to be
      #      present as a PASS in the baseline output before it is allowed to
      #      count as a FAIL after. Rung 1 alone is satisfied by DELETING the
      #      assertion: the baseline still passes, the mutant still fails (for
      #      some other reason), and the gate reports success while the thing
      #      it guards is gone.
      #   3. THE NAMED TEST MUST GO RED — not merely "the suite failed". A
      #      mutation that breaks the tool in some unrelated way also fails the
      #      suite, and would otherwise be indistinguishable from the detector
      #      catching the regression it was written for.
      #
      # Every mutation below is something a reasonable person would actually
      # write. None is a strawman.
      - name: case_09629d76 immutable carrier / host-render binding
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          # case_23300ea2: hardened two-isolated runners (ci-node7b1ff338-iso) grant no
          # sudo; the operator persists this knob at host level once (see the
          # case_23300ea2 operator recipe). Only relax it here when it reads 1 —
          # coolify behavior is unchanged, and a hardened host never invokes
          # sudo. If userns is unavailable the suite still REFUSES (exit 3).
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" == "1" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          ./test_paperclip_immutable_runtime.sh

      # case_87af7e92. Six previously-orphan suites now wired into the suites
      # job. Each passes when run by hand; wiring them here ensures CI
      # catches regressions. All are offline (no network, credentials, or
      # host actions).
      - name: cliproxy seam extract suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_cliproxy_seam_extract

      - name: garm provider latency baseline suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_garm_provider_latency_baseline

      - name: provider baseline integrity suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_provider_baseline_integrity

      - name: kofra preview parity suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: python3 -m unittest -v test_kofra_preview_parity

      - name: upstream draft pin audit suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_upstream_draft_pin_audit.sh

      - name: cliproxy config gate suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
