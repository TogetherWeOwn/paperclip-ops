      # the pipe capacity makes the producer block mid-write, so the loss is 20/20 and
      # not a coin flip), proves the herestring form is immune, and scans the tree so
      # the construct cannot come back. Both directions were live: at a `FAIL` check it
      # fabricates a red, but at a baseline check like "does the output contain SKIP"
      # it fabricates a GREEN and the gate above it silently stops measuring.
      - name: a matched pattern never reads as a miss (SIGPIPE verdict gate)
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./verification/case_c25c4d3f-sigpipe-verdict-gate.sh

