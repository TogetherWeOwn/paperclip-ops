#     test_host_ops_staging_preflight_carrier.py
#                                       the disabled fixed-purpose staging-preflight
#                                       carrier: request/manifest/artifact gates,
#                                       one-shot replay refusal, fixed dispatch,
#                                       and minimized receipts
#     test_operator_runbook.sh          whether a capability-bound ask was
#                                       filed as a decision, and whether the
#                                       runbook still matches the live owner
#                                       queue — case_51803a29; and whether a pinned
#                                       checkout carries its own step-0 SUMS
#                                       hashes — case_d293ac3a
#     test_sql_backend.sh               lib/pcsql.sh dispatch, against fake
#                                       podman/psql binaries — see case_43a4b560
#     test_suite_preconditions.sh       whether the two suites CI CANNOT run
#                                       refuse to score themselves when they
#                                       cannot reach a database, and whether
#                                       their refusal assertions name the gate
#                                       they claim to test — case_39b2a64b
#     test_agent_endpoint_preflight.sh  agent_endpoint_preflight.sh: whether the
#                                       model endpoint the agents are about to be
#                                       pointed at can serve them — case_9a66c8e1, and
#                                       whether it tells a dead endpoint apart
#                                       from a dead model lane — case_c55c5c2c
#     test_cliproxy_release_preflight.sh
#                                       cliproxy_release_preflight.sh: whether the
#                                       CLIProxy quota-controller release handoff
#                                       still refuses to move session affinity off
