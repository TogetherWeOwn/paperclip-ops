#                                       ref — case_79802e8d
#     test_quota_rotation_watch.sh      quota_rotation_watch.py: whether teamclaude
#                                       stops sending traffic to a quota-spent
#                                       account, and whether a watcher that
#                                       measured nothing says so — case_dfdddcf0
#     test_approval_timeout_probe.sh    approval_timeout_probe.sh: whether the
#                                       deadline stamped on a tool-approval
#                                       request is enforced by anything, or is
#                                       only displayed to the approver — case_77f64939
#     test_case_df6ed188_monitoring_of_monitor.sh
#                                       ops/case_56fff4c6: off-host Gatus heartbeat
#                                       probe + staging round-trip harness —
#                                       fail-closed pushes, secret-free argv,
#                                       prod-target refusals — case_56fff4c6
#     test_alert_queue.py               ops/case_56fff4c6/alert_queue.py: durable
#                                       alert queue replacing the on-call gate
#                                       202-drop — bounded retry with backoff,
#                                       spill-never-drop overflow, and an audit
#                                       gate the drop-path fixture must fail —
#                                       case_56fff4c6
#     test_beszel_gatus_bridge.sh       push-beszel-hosts.sh: whether per-host
#                                       disk/inode/cpu/mem/load/failed-units/
#                                       restarts plus the disk-growth forecast
#                                       push the right per-host Gatus endpoint,
#                                       and whether missing fields, silent
#                                       hosts and unreadable payloads fail
#                                       closed instead of scoring healthy —
#                                       case_f2010cb7
#     test_module_wiring.py             check_module_wiring.py: whether a pushed
#                                       Gatus endpoint can be declared with no
#                                       push script, no OPERATOR.md cron line or
#                                       no MODULES.md entry and still merge, and
#                                       whether an allowlist exemption can
#                                       outlive its gap — case_f3500d44
#     test_case_8ee359f2_ci_main.sh          push-ci-main.sh: whether a red, slow or
#                                       unreadable main pushes the right Gatus
#                                       endpoint, and whether empty check-runs,
#                                       bad timestamps and dead runner units
#                                       fail closed instead of scoring
#                                       healthy — case_c542accd
#     test_case_00b2eb59_probe.sh            ops/case_a2ab2937 staging login-smoke probe:
#                                       source-only probe checks — case_a2ab2937
#     test_case_f9bc8d5a_hung_job.py         hung_job_eval.py + push-ci-hung-job.sh: whether a
#                                       job that STARTED and never completes can read
#                                       healthy — queued, completed (timed_out and
#                                       cancelled included), superseded-SHA and null
#                                       started_at runs, a 403, malformed JSON and a
#                                       full check-runs page must never page or pass
#                                       wrongly, and every ci.yml job needs a threshold
#                                       row — case_703e1a90
#     ops/case_ebbb469a/test_runner_census.py
#                                       push-runner-census.py: whether a label
#                                       with queued demand and no online runner,
#                                       or a runner carrying both pool labels,
#                                       fails the census, and whether an API
#                                       403, a malformed or truncated runner
#                                       list or a stale queued file fails
#                                       closed instead of scoring healthy —
#                                       case_ebbb469a
#     test_red_main_poll.sh             red_main_poll.sh: the measuring half of the red-main
#                                       detector — main-branch CI per repo, contract-keyed
#                                       red signature, board coalescing lookup — case_e77a1e99
#     test_watchdog_sections.py         watchdog/sections.py: whether a snapshot section
#                                       of the wrong type, a row that is not an object
#                                       or a number that cannot be read can still pass
#                                       silently or crash the CLI, instead of emitting
#                                       an `unknown` finding — case_a8404a2d
#     test_ci_required_checks_audit.py  ci_required_checks_audit.py: whether every
#                                       required check in required_checks.json has a
#                                       job that produces it on a PR and cannot pass
#                                       without running (renamed job, dropped trigger,
#                                       continue-on-error, unparseable workflow) —
#                                       case_d0cad227
#     test_grant_attribution.sh         scripts/grant_attribution.js: who granted
#                                       a permission, when the grants table's
#                                       only grantor column is USER-typed and an
#                                       agent actor is written as null. Recovers
#                                       the grantor from activity_log, reports it
#                                       as DERIVED, and refuses (exit 5) when it
#                                       measured nothing rather than calling an
#                                       empty read a perfect audit — case_f909ca1f
#     test_grant_write_attribution.sh   org_provisioner.sh: whether a grant can
#                                       still be written with NO grantor. Its raw
#                                       INSERT bypassed the API, so those rows
#                                       have no activity_log row either and are
#                                       unrecoverable. Both attribution facts now
#                                       land in ONE transaction, and a missing
#                                       requester REFUSES — never defaults — case_f909ca1f
#     test_hook_spawn_guard.sh          hook_spawn_guard.sh: whether a per-prompt
#                                       or per-tool hook detaches children that
#                                       outlive the hook timeout kill, or runs
#                                       without a numeric timeout — case_ccf26154
#     syntax + secret scan              see the steps below
#     plugins/omniroute-broker          see the `suites` job, omniroute area
#     plugins/dispatch                  see the `suites` job, dispatch area
#     gh-event-capture                  see the `suites` job, capture area
#     mcp/                              see the `suites` job, mcp/hostops areas
#
#   RUN IN THE `privilege-suites` JOB BELOW:
#     test_privilege_ceilings.sh
#     test_request_queue.sh
#   They create and delete agents in a throwaway Postgres service through the
#   dumb recording CLI under test/fixtures/orgdb. No production credential is
#   present. This proves the provisioner's POLICY; it does not prove the real
#   Paperclip API contract. The operator's VPS pre-release run therefore stays
#   mandatory, but is now specifically the create/update/terminate contract run.
#
#   AND, since case_39b2a64b, test_suite_preconditions.sh proves rather more than
#   that: it drives both of them through a stub backend and checks they refuse
#   to run when the database is unreachable, and that their refusal assertions
#   fail when the refusal comes from the wrong gate. CI still cannot verify what
#   these two assert about the org; it can now verify that they do not lie when
#   they cannot reach it. That distinction was the whole finding — an operator's
#   pre-release run is the last gate before a provisioning change lands, and a
#   partially-green run is more dangerous than a red one.
#
#   WHAT IS STILL MISSING, precisely (case_43a4b560). The first blocker is gone: as of
#   lib/pcsql.sh the tools no longer hard-wire `podman exec paperclip-db`, so
#   they CAN be pointed at a throwaway database with PAPERCLIP_SQL_BACKEND=psql.
#   Three things still stand between that and a green run here, and the third
#   was not obvious until someone read the provisioner:
#     1. a schema dump, so a service container has tables to talk to;
#     2. an org fixture — the suites reference P0/P1/O*/T*/F* rows by
#        `metadata->>'orgRoleId'` and assume they already exist;
#     3. A LIVE PAPERCLIP API SERVER. The suites drive org_provisioner.sh, which
#        creates and terminates agents through `paperclipai agent create` /
#        `terminate` against PAPERCLIP_API_URL, not through SQL. A Postgres
#        service container alone does not make these suites run; it makes them
#        fail later, at the first `pc agent create`, which is a worse failure
#        mode than today's honest exclusion.
#
#   BLOCKER 3 IS ANSWERED (case_e224f2ef). The call: a RECORDING STUB behind the
#   CLI seam, not a live server. Three reasons, in order of weight.
#
#   First, the seam is already there and this was not known when the question
#   was framed. org_provisioner.sh:91 honours PAPERCLIP_CLI and every API call
#   goes through pc() at :98, so this is not "a design change to a tool that
#   provisions real agents" — the change is confined to the test fixture. The
#   tool is untouched. test_suite_preconditions.sh:64 already drives it this way.
#
#   Second, the API surface is exactly three calls, all in org_provisioner.sh:
#   `agent create` (:389), `agent permissions:update` (:395), `agent terminate`
#   (:437). Nothing else in the provisioner reaches the API.
#
#   Third, a live server needs the Paperclip image and an ADMIN credential on a
#   GitHub runner. That is the same trade this file rejects eight lines above,
#   arrived at from the other direction, and the image is not ours to publish.
#
#   WHAT THE STUB MUST NOT BECOME, because this is the way it fails. The suites
#   would then assert on rows the stub itself wrote, so a stub that computes
#   anything makes the suite grade the stub instead of the provisioner — the
#   case_39b2a64b failure again, one level down. Two constraints follow, and they are
#   the whole reason this is safe:
#     * THE STUB IS DUMB. It stores the payload it was handed, verbatim, and
#       derives nothing. Then `dormant()` asserting heartbeat.enabled=false is
#       asserting that THE PROVISIONER SENT false, which is the policy coverage
#       actually wanted here.
#     * EVERY CEILING INVARIANT CARRIES A MUTATION GUARD, so a policy change in
#       the provisioner reddens a NAMED test. Same pattern as the mutation jobs
#       below. Without this, "make the stub agree" is the cheapest way to fix a
#       red build, and it silently deletes the coverage.
#
#   WHAT THIS BUYS AND WHAT IT DOES NOT. It buys the provisioner's POLICY: the
#   ceilings, the grant replacement, the refusals. It does NOT buy the API
#   contract — if the server changes what `agent create` does with reportsTo,
#   CI stays green and only the VPS run catches it. So the operator's
#   pre-release pass does not go away; it stops being the only coverage and
#   becomes specifically the API-contract coverage. Say so when it is wired in.
#
#   AND A FOURTH BLOCKER, found while answering the third: THE SCHEMA ROTS.
#   Blocker 1's dump is platform schema (agents, principal_permission_grants,
#   company_memberships, company_secret_bindings, budget_policies,
#   heartbeat_runs) vendored into this repo. It is a snapshot, and nothing here
#   moves when the platform migrates — so a fixture that has drifted goes green
#   against a schema production no longer has. That is a muted suite again,
#   one level further down. The dump therefore ships with a drift check, the
#   same shape as tool_drift.sh and channel_drift.sh: fingerprint on the VPS,
#   compare in a clone. Do not commit the dump without it.
#
#   The stub and fixture now exist. test_orgdb_fixture.sh tests their offline
#   contract, and `privilege-suites` runs both suites against Postgres. The
#   production comparison still cannot run here: schema_drift.sh fingerprints
#   the VPS database and compares that fingerprint against a clone loaded from
#   this fixture. Green CI proves the detector and fixture work, never that the
#   deployed schema has not drifted.
#
#   NOT YET RUN HERE: org_access_review.sh. It is read-only and the required
#   tables are now present, but its wider report semantics are outside case_aa908088.
#
#   READ THIS BEFORE TRUSTING THE DRIFT SUITE'S GREEN (case_dcef12ea). CI runs
#   test_tool_drift.sh, which proves the DETECTOR works. It does NOT and cannot
#   run the actual comparison, because the thing to compare against is a
#   directory on the VPS that no runner can reach. A green badge here means
#   "tool_drift.sh would notice drift", never "there is no drift". The real
#   check is `tool_drift.sh fingerprint` on the VPS and `compare` in a clone,
#   and it stays operator-initiated for exactly the same reason the two suites
#   above do. Do not let this distinction quietly erode into a green badge that
#   is read as a clean bill of health.
#
# This list deliberately carries no test counts. CI asserts EXIT STATUS and
# never a count: counts drift as suites grow, and a gate that pins one turns
# ordinary growth into a red build. Do not add them back.

on:
  push:
    branches: [main]
  # case_d5bc7950: pull_request activity types are pinned so a draft PR that
  # flips to ready re-runs the gated set. A bare pull_request fires only on
  # opened/synchronize/reopened -- without ready_for_review a draft that flips
  # to ready and is never touched again keeps its all-skipped draft verdict
  # with ci-ok green (CISO case_f11bc226). Types are activity filters, not path
  # filters: gating still lives at job level (standard rule 2).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # case_d5bc7950 (CI standard, case_6b39c80f rule 5): nightly full run. push-to-main
  # runs everything by the same latch in the `changes` job; a regression that
  # slips past a gated PR is caught here within hours. 02:41 UTC is off the
  # :00/:30 marks per the fleet-jitter convention. pull_request carries no
  # `paths:` filter on purpose (the types above are activity filters, not
  # path filters): a workflow-level `paths:` filter would silence required
  # checks on PRs outside it (standard rule 2); gating lives at job level.
  schedule:
    - cron: "41 2 * * *"
  # case_ec2539bf: the pre-release full-suite trigger. A manual dispatch falls into
  # the same full latch as the nightly (the `changes` job's final `else`), so
  # the release candidate's exact SHA can be run through every suite on demand
  # (`gh workflow run ci.yml --ref <branch-or-tag>`) without waiting for the
  # nightly. It takes no inputs: a partial dispatch is not a release verdict.
  workflow_dispatch:

# `merge_group` is INERT until a merge-queue rule exists on `main` (case_082e9f7b).
# It is here first, and on purpose, because the ordering is a trap: if the
# ruleset gains the merge-queue rule while this trigger is absent, every queue
# entry sits forever waiting for nine required checks that no event will ever
# start, and NOTHING can merge. Trigger first, rule second -- and this half is
# the half an agent can land, because the rule needs `administration=write`,
# which this repo's App profile does not carry.
#
# Nothing about the PR path changes: with no queue configured, GitHub never
# emits a merge_group event, so this file behaves exactly as it did before.

# push and pull_request used to both fire, unfiltered, on every PR commit:
# two independent runner VMs ran the full suite set (incl. "Offline suites")
# for the same SHA ~3s apart. GitHub's required-status-check matching is by
# check-run NAME, so it nondeterministically picked whichever of the two
# finished last -- doubling exposure to any transient/suite-level flake and
# producing "push failed, pull_request passed on the identical SHA" (case_e8e5a410).
# Restricting push to main means PR commits get exactly one run (via
# pull_request); main only ever sees its own push run. Check-run names are
# unchanged, so branch-protection required-check config needs no edit.
#
# case_d5bc7950: pull_request runs now start with the `changes` job and each heavy
# job runs only when its area changed (job-level `if:`, never workflow-level
# `paths:` -- a skipped required job reports success, so the ruleset is
# untouched). `ci-ok` aggregates with `if: ${{ !cancelled() }}`. Push-to-main
# runs diff against the previous main SHA (`github.event.before`, case_e41d7023)
# so each merge runs only its affected suites and finishes; the nightly
# schedule latches full=true, so every suite still runs there within hours. The
# ruleset cutover landed 2026-10-05 (operator one-pin on case_5acc136b,
# 20261005T024931Z): the rulesets require only `ci-ok` (+ pr-lint), both pinned
# to integration_id 15368; `required_checks.json` mirrors both. case_a2b959d4: the
# ten small change-gated areas run as step-gated blocks of the single `suites`
# job (one VM boot per run; job-level `if:` is the OR of the ten areas, steps
# carry `full || <area>`). case_1d1195e1: the tenth area is `upstream` -- the
# upstream-pipeline family (gate suites plus the mutation gates that prove
# them, incl. the 26-min case_214e61d3 gate) runs only when upstream-pipeline
# files changed, so unrelated PRs skip it; upstream files also wake core, so
# an upstream PR still runs its core guards. The privilege ceiling keeps its
# own job; the repo-split guards (model-selection moved, public-owned freeze)
# run as steps of the always-run `secret-scan` job. The generic mutation matrix runs in toolkit CI; the PR-only
# private-mutation-gates job retains targeted private integration mutants.
# secret-scan always runs. Change gating still relies on skips reporting success.

# `actions: read` is the narrowest grant that lets the case_50dca137 dark-step
# reporter list this run's own job steps; it is read-only and repo-scoped.
# Everything else stays at the default deny.
permissions:
  contents: read
  actions: read

# Cancel a superseded PR run rather than letting it burn the full ~2h
# suites job to completion. Keyed on PR number when present so
# concurrent PRs never cancel each other; falls back to the ref for push-to-main.
#
# A run on main is NEVER cancelled in progress (case_d0cad227). With cancel-in-progress
# true for every event, each merge cancelled the previous main run within seconds
# (3 to 5 s after the next commit, measured on 2026-10-03): of the last 29
# completed main commits only 7 had all four heavy required jobs finish green, so a
# red main could sit unseen. With false the group is serialised: at most one main
# run executes, a newer push replaces an older PENDING run, and the running one
# finishes, so a completed run is a real verdict on a real head. The cost is that
# one running main run is no longer cut short; concurrent runner load is unchanged
# because the group still allows only one run at a time. test_case_b2acfa5c_selfhosted_runner.sh
# pins the expression.
#
# This is already merge-queue safe and must stay that way. A merge_group event
# carries no `pull_request`, so it falls through to `github.ref`, which is the
# per-entry `refs/heads/gh-readonly-queue/main/pr-<n>-<base-sha>` -- unique to
# that entry. Two queue entries therefore never share a group and can never
# cancel each other. Do not "simplify" this key to the PR number alone: that
# would put a queue entry and its own still-running PR run in one group, and
# cancel-in-progress would kill whichever the queue is waiting on.
#
# The nightly and a manual dispatch get their own group (case_ec2539bf). A schedule
# or workflow_dispatch event on main has github.ref == refs/heads/main, so with
# the key above it shared the push-to-main group, and with cancel-in-progress
# false that group still holds ONE pending run: the next arrival replaces it.
# Measured 2026-10-06: the 02:41 nightly (created 09:21:47Z, delayed ~6.7 h by
# GitHub) replaced a pending push run, then was itself cancelled with zero jobs
# five minutes later (09:26:52Z) when the next push (09:26:51Z) queued. The
# push path only runs the affected suites (case_e41d7023), so the nightly full run
# is the backstop for everything the gate misses, and a backstop another push
# can silently cancel is no backstop. Keyed on the unique run id, a nightly or a
# dispatched pre-release run is never replaced by, and never replaces, a push
# run. Same pattern as the org starter workflow's concurrency note. Push and
# merge_group keep the ref key unchanged (case_d0cad227 serialisation above).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('{0}-{1}', github.event_name, github.run_id)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # case_d5bc7950 (CI standard, case_6b39c80f rules 1-2, absorbs case_799d2480). Every
  # workflow with jobs heavier than ~2 min starts with a `changes` job that
  # diffs the PR against the PR base SHA with native git (no third-party
  # action) and publishes one boolean per area. Heavy jobs below run only
  # when their area changed (`if: needs.changes.outputs.<area> == 'true'`).
  # A SKIPPED required job reports success, so branch protection keeps
  # working with no ruleset edit. Push to main diffs against the previous
  # main SHA (case_e41d7023), so each merge runs only its affected suites.
  # Full-run latch (standard rule 4): schedule and merge_group run
  # EVERYTHING, as does any change to dependency manifests, .github,
  # shared code, or this detector itself. verification/case_d5bc7950-ci-gating.sh
  # pins this contract; test_ci_gating.sh is its CI entry point.
  changes:
    name: Change detection
    # case_5236db70: hard-pinned to the larger GARM ephemeral pool (node7b1ff338 max 2 +
    # node575e13db max 4 = 6, on-demand, fresh VM per job) instead of the saturated
    # isolated pool (max 2). The 2026-10-05 queue-age breach (oldest
    # runner-waiting job 74m, 71 open PRs) showed even the 5m changes job
    # queuing behind 150m heavy suites, delaying the skip decisions that would
    # unload the pool. Hard-pin, not an overflow expression: CI_OVERFLOW_JOBS
    # currently lists these jobs with CI_OVERFLOW_RUNNER two-isolated, which
    # would keep routing them to the saturated pool and defeat a fallback.
    # Ephemeral is self-hosted (no paid minutes) and follows the pr-lint and
    # docs-fast-path precedent; these jobs need only checkout+python, never
    # docker/sudo.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.detect.outputs.full }}
      privilege: ${{ steps.detect.outputs.privilege }}
      core: ${{ steps.detect.outputs.core }}
      private_mutation: ${{ steps.detect.outputs.private_mutation }}
      runbook: ${{ steps.detect.outputs.runbook }}
      omniroute: ${{ steps.detect.outputs.omniroute }}
      dispatch: ${{ steps.detect.outputs.dispatch }}
      cliproxy: ${{ steps.detect.outputs.cliproxy }}
      capture: ${{ steps.detect.outputs.capture }}
      mcp: ${{ steps.detect.outputs.mcp }}
      hostops: ${{ steps.detect.outputs.hostops }}
      upstream: ${{ steps.detect.outputs.upstream }}
      trivy: ${{ steps.detect.outputs.trivy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Two-dot diff against the base SHA needs no shared history; a
          # full clone of this repo is minutes, so fetch only the base
          # commit instead.
          fetch-depth: 1
      # ci_changes.py reads operator_runbook.sh (toolkit-vendored since
      # slice 1), so the pin must be restored before the detect step runs.
      - name: Restore toolkit-vendored files
        run: bash scripts/sync-toolkit.sh
      - id: detect
        run: |
          set -euo pipefail
          # CI standard addition 2026-10-04: draft PRs skip heavy jobs (the
          # author is still iterating; ready_for_review re-runs the gated
          # set). ci-ok still reports, so the merge gate never hangs.
          if [[ "${{ github.event.pull_request.draft }}" == "true" ]]; then
            for a in full privilege core private_mutation runbook omniroute dispatch cliproxy capture mcp hostops upstream trivy; do
              echo "$a=false" >> "$GITHUB_OUTPUT"
            done
            echo "draft PR: heavy suites skipped, ci-ok still reports"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # case_e41d7023: push to main diffs against the previous main SHA
            # (github.event.before) and runs only the affected suites, so a
            # merge finishes in minutes instead of queueing a full ~70min run
            # behind every other merge. schedule and merge_group keep the
            # full latch below; the nightly full run catches anything the
            # gate misses within hours.
            base="${{ github.event.before }}"
            # `before` is the null SHA when main is (re)created: nothing to
            # diff against, so fail closed and run everything.
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              echo "before is null SHA; running everything"
              for a in full privilege core private_mutation runbook omniroute dispatch cliproxy capture mcp hostops upstream trivy; do echo "$a=true" >> "$GITHUB_OUTPUT"; done
              exit 0
            fi
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # case_13d22ce3 P1: the base SHA from the pull_request event is already
            # the fork point GitHub merged from, so a two-dot diff against it
            # is the correct primitive -- and the only one that works on this
            # shallow checkout. The earlier merge-base indirection exited 1 on
            # PR merge refs (no common ancestor in the shallow history) and, as
            # the step runs under `set -euo pipefail`, killed the whole job
            # before any output was written -- parking every heavy suite and
            # ci-ok behind a red `changes` job on every PR.
            base="${{ github.event.pull_request.base.sha }}"
          else
            # schedule, merge_group: full suite (standard rule 5: the nightly
            # full run; the merge queue validates the merged result).
            # workflow_dispatch lands here too (case_ec2539bf): a manual
            # pre-release run is a full run.
            for a in full privilege core private_mutation runbook omniroute dispatch cliproxy capture mcp hostops upstream trivy; do
              echo "$a=true" >> "$GITHUB_OUTPUT"
            done
            echo "full run latched: event ${{ github.event_name }}"
            exit 0
          fi
          git fetch --no-tags --depth=50 origin "$base" || {
            echo "base fetch failed; running everything"
            for a in full privilege core private_mutation runbook omniroute dispatch cliproxy capture mcp hostops upstream trivy; do echo "$a=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }
          # Disable rename detection so the classifier sees both source and destination.
          # Otherwise moving code into docs/ hides the deleted code path and skips its suite.
          git diff --name-only --no-renames "$base" HEAD | python3 .github/scripts/ci_changes.py | tee areas.txt || {
            echo "diff/classifier failed; running everything"
            for a in full privilege core private_mutation runbook omniroute dispatch cliproxy capture mcp hostops upstream trivy; do echo "$a=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          }
          # Fail-closed: the classifier prints full=true on empty input or
          # error, but an empty areas.txt (broken pipe, missing script) must
          # not read as "nothing changed" either.
          [[ -s areas.txt ]] || { echo "areas.txt is empty; running everything"; for a in full privilege core private_mutation runbook omniroute dispatch cliproxy capture mcp hostops upstream trivy; do echo "$a=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          while IFS='=' read -r k v; do echo "$k=$v" >> "$GITHUB_OUTPUT"; done < areas.txt

  privilege-suites:
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.privilege == 'true'
    name: Privilege ceiling suites
    # case_10099fe0: this job used to be the one exception that needed a container
    # daemon, because it declared a `postgres` service container. It now starts
    # its own ephemeral PostgreSQL cluster instead, so NO job in this workflow
    # needs Docker. This job stays isolated: its sudoers tests require no sudo,
    # unlike the other jobs that may use approved included-minutes overflow.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: org_fixture
      PAPERCLIP_SQL_BACKEND: psql
      # Public, synthetic company from the pinned orgdb fixture (not a tenant).
      COMPANY_ID: 00000000-0000-4000-8000-000000000480
      PAPERCLIP_API_URL: http://recording-stub.invalid
      PAPERCLIP_CLI: ${{ github.workspace }}/test/fixtures/orgdb/paperclipai
      # This fixture owns authorization, not Claude transport. The dedicated
      # transport suite exercises claude_local with explicit operator config.
      ADAPTER_TYPE: codex_local
      PAPERCLIP_STUB_LOG: ${{ github.workspace }}/paperclip-stub.jsonl
      GRANT_LOG: ${{ github.workspace }}/provisioner-grant-log.jsonl
    steps:
      # An ephemeral, per-job PostgreSQL cluster in $RUNNER_TEMP. This replaces a
      # service container (case_10099fe0) for three reasons: it needs no container
      # daemon, so this job stops being the one hole in the isolation boundary;
      # each job gets its own cluster on its own port, so concurrent runs cannot
      # collide on the shared `org_fixture` database the way they would against a
      # single host instance; and it sidesteps the RootlessKit host-port race that
      # intermittently fails service containers on this fleet (case_71a190a8).
      # Auth is scram-sha-256, matching the postgres:16 image this replaces, so
      # the suites still exercise real password authentication.
      - name: Start an ephemeral PostgreSQL cluster
        run: |
          set -euo pipefail
          PGBIN=/usr/lib/postgresql/16/bin
          PGDATA="$RUNNER_TEMP/orgdb-pgdata"
          # Ask the kernel for a free port rather than picking one: two jobs on
          # the same host must never choose the same number.
          PGPORT="$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')"
          rm -rf "$PGDATA"
          install -d -m 700 "$PGDATA"
          printf '%s' "$PGPASSWORD" > "$RUNNER_TEMP/orgdb-pw"
          "$PGBIN/initdb" -D "$PGDATA" -U "$PGUSER" \
            --auth-host=scram-sha-256 --auth-local=scram-sha-256 \
            --pwfile="$RUNNER_TEMP/orgdb-pw" >/dev/null
          rm -f "$RUNNER_TEMP/orgdb-pw"
          # -k keeps the unix socket inside $PGDATA: the runner account cannot
          # write the system socket directory, and nothing here should need it.
          # dynamic_shared_memory_type=mmap keeps DSM segments as files under $PGDATA:
          # on GARM VMs the POSIX /PostgreSQL.* segments vanished between steps
          # ("could not open shared memory segment").
          "$PGBIN/pg_ctl" -D "$PGDATA" -w -l "$RUNNER_TEMP/orgdb-pg.log" \
            -o "-p $PGPORT -h 127.0.0.1 -k $PGDATA -c dynamic_shared_memory_type=mmap" start >/dev/null
          "$PGBIN/createdb" -h 127.0.0.1 -p "$PGPORT" -U "$PGUSER" "$PGDATABASE"
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"
          echo "ORGDB_PGDATA=$PGDATA" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore toolkit-vendored files
        run: bash scripts/sync-toolkit.sh
      # test_orgdb_fixture.sh and the schema-fingerprint mutants below invoke
      # `node` (fixture lines 37..579, `node -e` anchors). Without this the job
      # fails with `node: command not found` (case_2ef967e7; PR #667 job
      # 111515472918: 73 passed / 21 failed). Node 24 matches the sibling jobs
      # and the runtime the instance runs plugins on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # case_23300ea2: hardened two-isolated runners (ci-node7b1ff338-iso) preinstall the
      # client and jq at host level and grant no sudo. Skip the apt install when
      # both are already on PATH; hosts without them keep today's cached-apt path.
      - name: Check for preinstalled Postgres client and jq
        id: hosttools
        run: |
          if command -v psql >/dev/null 2>&1 && command -v jq >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Postgres client and jq
        if: steps.hosttools.outputs.present != 'true'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: postgresql-client jq
          version: 1.0
      - name: Arm the empty throwaway database
        run: ./test/fixtures/orgdb/reset.sh --init
      - name: Fixture and recording-stub contract
        run: ./test_orgdb_fixture.sh
      - name: Transport binding and smoke SQL positive and negative controls
        run: python3 test_provisioned_transport_db.py
      - name: Run privilege ceiling suite
        run: |
          set +e
          out="$({
            ./test/fixtures/orgdb/reset.sh &&
            rm -f "$GRANT_LOG" "$PAPERCLIP_STUB_LOG" &&
            ./test_privilege_ceilings.sh
          } 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | grep -F 'FAIL' | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            [[ -n "$summary" ]] || summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Privilege ceiling suite failed::$summary"
            exit "$rc"
          fi
      - name: Run request queue suite
        run: |
          set +e
          out="$({
            ./test/fixtures/orgdb/reset.sh &&
            rm -f "$GRANT_LOG" "$PAPERCLIP_STUB_LOG" &&
            ./test_request_queue.sh
          } 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | grep -F 'FAIL' | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            [[ -n "$summary" ]] || summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Request queue suite failed::$summary"
            exit "$rc"
          fi
      - name: Schema fixture fingerprint is stable
        run: |
          set +e
          out="$({
            ./schema_drift.sh fingerprint > expected.fp &&
            ./test/fixtures/orgdb/reset.sh &&
            ./schema_drift.sh compare expected.fp || exit $?

            cp expected.fp column-drift.fp
            column_before="$(sha256sum column-drift.fp)"
            node -e 'const fs=require("fs"),p=process.argv[1],s=fs.readFileSync(p,"utf8"),a=s.split("\n").find(l=>/^column\|agents\|[^|]+\|name\|/.test(l)); if(!a)throw Error("agents.name column fingerprint anchor missing"); fs.writeFileSync(p,s.replace(a,a.replace("|name|","|name_mutant|")))' column-drift.fp
            column_after="$(sha256sum column-drift.fp)"
            [[ "$column_before" != "$column_after" ]] || {
              echo "column drift mutation did not change the fingerprint" >&2
              exit 1
            }
            set +e
            column_out="$(./schema_drift.sh compare column-drift.fp 2>&1)"; column_rc=$?
            set -e
            printf '%s\n' "$column_out"
            [[ $column_rc -eq 3 && "$column_out" == *"name_mutant"* ]] || {
              echo "column drift mutant was not detected with exit 3 and the affected column" >&2
              exit 1
            }

            type_before="$(sha256sum < expected.fp | cut -d' ' -f1)"
            psql -X -v ON_ERROR_STOP=1 -c \
              'ALTER TABLE public.agents ALTER COLUMN created_at TYPE timestamp(3) with time zone' >/dev/null
            type_after="$(./schema_drift.sh fingerprint | sha256sum | cut -d' ' -f1)"
            [[ "$type_before" != "$type_after" ]] || {
              echo "type modifier mutation did not change the extracted fingerprint" >&2
              exit 1
            }
            set +e
            type_out="$(./schema_drift.sh compare expected.fp 2>&1)"; type_rc=$?
            set -e
            printf '%s\n' "$type_out"
            [[ $type_rc -eq 3 && "$type_out" == *"timestamp(3) with time zone"* ]] || {
              echo "type modifier drift was not detected with exit 3 and the affected type" >&2
              exit 1
            }

            cp schema_drift.sh schema-drift-no-typmod.sh
            node -e 'const fs=require("fs"),p=process.argv[1],s=fs.readFileSync(p,"utf8"),old="pg_catalog.format_type(a.atttypid, a.atttypmod),"; if(!s.includes(old))throw Error("schema type modifier mutation anchor missing"); fs.writeFileSync(p,s.replace(old,"pg_catalog.format_type(a.atttypid, -1),"))' schema-drift-no-typmod.sh
            chmod +x schema-drift-no-typmod.sh
            set +e
            mutant_out="$(./schema-drift-no-typmod.sh compare expected.fp 2>&1)"; mutant_rc=$?
            set -e
            printf '%s\n' "$mutant_out"
            [[ $mutant_rc -eq 0 && "$mutant_out" == *"schema fixture matches fingerprint"* ]] || {
              echo "no-atttypmod mutant did not demonstrate the expected false negative" >&2
              exit 1
            }

            ./test/fixtures/orgdb/reset.sh
            ./schema_drift.sh compare expected.fp

            cp expected.fp index-drift.fp
            node -e 'const fs=require("fs"),p=process.argv[1],s=fs.readFileSync(p,"utf8"),a=s.split("\n").find(l=>l.startsWith("index|agents|")); if(!a)throw Error("index fingerprint anchor missing"); fs.writeFileSync(p,s.replace(a,a.replace("|agents_","|agents_mutant_")))' index-drift.fp
            set +e
            index_out="$(./schema_drift.sh compare index-drift.fp 2>&1)"; index_rc=$?
            set -e
            printf '%s\n' "$index_out"
            [[ $index_rc -eq 3 && "$index_out" == *"agents_mutant_"* ]] || {
              echo "index drift mutant was not detected with exit 3 and the affected index" >&2
              exit 1
            }
          } 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Schema fixture check failed::$summary"
            exit "$rc"
          fi
      - name: Privilege invariants are named and mutation-gated
        run: |
          set +e
          out="$(./verification/case_aa908088-mutation-gate.sh 2>&1)"; rc=$?
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]]; then
            summary="$(printf '%s\n' "$out" | grep -E 'BASELINE FAILED|mutant left|red, but|mutation anchor|mutant does not parse' | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            [[ -n "$summary" ]] || summary="$(printf '%s\n' "$out" | tail -n 20 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Privilege mutation gate failed::$summary"
            exit "$rc"
          fi
      # Always reclaim the cluster: a leaked postmaster would hold its port and
      # its $RUNNER_TEMP data directory on a long-lived self-hosted runner.
      - name: Stop the ephemeral PostgreSQL cluster
        if: always()
        run: |
          set -u
          [[ -n "${ORGDB_PGDATA:-}" ]] || exit 0
          /usr/lib/postgresql/16/bin/pg_ctl -D "$ORGDB_PGDATA" -m immediate stop || true
          rm -rf "$ORGDB_PGDATA"
      # CI verifies policy through the dumb stub. It deliberately cannot prove
      # what the real API now does with reportsTo, permissions, or termination;
      # the operator's VPS pre-release pass remains the API-contract coverage.

  # ---------------------------------------------------------------------------
  # suites (case_a2b959d4). ONE job for the ten small change-gated suite
  # areas below, running only the affected suites sequentially on a single
  # VM. Measured 2026-10-06: every PR fanned out into ~11 suite jobs, each
  # paying ~2 min of GARM boot for often under 1 min of work (21 PR runs
  # queued 123 jobs against a 19-VM cap). One boot per PR run instead.
  #
  # Gating is preserved at STEP level: every moved step carries
  # `if: full || <its-area>` (combined with any pre-existing step `if:`),
  # so an unaffected area's steps skip exactly as its old job did. The
  # job-level `if:` is the OR of all ten areas. The `changes` job and
  # its area outputs are untouched.
  #
  # case_1d1195e1 exception: the seven upstream-pipeline steps (gate suites,
  # filing-strip gate, and the four mutation gates incl. the 26-min
  # case_214e61d3 gate) carry `if: full || upstream` instead of `full || core`.
  # Their subjects classify core+upstream (ALSO_CORE_PREFIXES), so an
  # upstream PR still runs them alongside its core guards, while an
  # unrelated PR skips them. Only the nightly (schedule), merge_group and
  # workflow_dispatch latch full=true; main pushes diff against
  # github.event.before and run only the affected areas, so these steps run
  # on main only when the upstream family changed (the nightly covers rest).
  #
  # Deliberately NOT folded in: privilege-suites (CISO security boundary,
  # pinned to the isolated pool), secret-scan (always-run), and the separate
  # private-mutation-gates job. The generic mutation matrix and model-selection
  # jobs moved to the public toolkit's CI (ubuntu-latest); this PR-only job
  # keeps targeted mutants for private integration suites.
  #
  # Shared boot is paid ONCE: one runner proof, one full-history checkout
  # (the static-label guard needs history; pinned by its test), one
  # Node 24, one disk preflight, one parse gate, and the cheap workflow
  # self-checks (migration contract, capacity, required-checks audit,
  # change-gating contract) run on every suites execution. The three
  # per-plugin `cache: npm` setups were dropped: one setup-node cannot key
  # three lockfiles, and seconds of npm fetch beat another VM boot.
  # Ex-`defaults.run.working-directory` jobs (broker, dispatch,
  # cliproxy-insight, gh-event-capture) carry per-step working-directory
  # instead. Fail-fast is unchanged; the single dark-step reporter below
  # is `if: failure()` (not always()): with area steps skipping on
  # unaffected areas, always() would cry-wolf on every partial green run.
  suites:
    needs: [changes]
    if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.runbook == 'true' || needs.changes.outputs.omniroute == 'true' || needs.changes.outputs.dispatch == 'true' || needs.changes.outputs.cliproxy == 'true' || needs.changes.outputs.capture == 'true' || needs.changes.outputs.mcp == 'true' || needs.changes.outputs.hostops == 'true' || needs.changes.outputs.upstream == 'true'
    name: suites
    runs-on: ubuntu-latest
    # case_a2b959d4: 210 min restores the 1.51x headroom the five-listener fleet
    # accepted (150/99.3) against the seven-listener 139-min projection
    # (210/139). See docs/private-self-hosted-runner.md; the projection is
    # still single-sample, so eight listeners need a remeasure, not arithmetic.
    # Coupled floors: github-runner/garm/drain-contracts.json drain_grace_min
    # and idle-ttl-contracts.json ttl_min must cover this timeout;
    # test_isolated_garm_drain.py pins the coupling, so move them together.
    timeout-minutes: 210
    steps:
      # -- shared prelude (was offline-suites, runs on every suites execution) --
      - name: Prove the private runner selected this job
        shell: bash
        run: |
          set -euo pipefail
          # case_bec120d3: the two-isolated label spans the Coolify box fleet, the
          # node7b1ff338 isolated VM fleet and (owner 2026-10-04) the ephemeral GARM
          # pools that replace both. Accept all three runner-name prefixes;
          # narrowing to any one fleet fails the gate below.
          [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]] || { echo "::error::public CI requires a GitHub-hosted runner"; exit 1; }
          [[ "${RUNNER_OS:-}" == Linux ]]
          [[ "${RUNNER_ARCH:-}" == X64 ]]
          printf 'private runner: name=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"

      #
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          fetch-depth: 0
      #
      # Keep the parser/dependency isolated from the other Python suites.
      # GARM VMs ship python3 3.12 but setup-python's tool cache there is a broken
      # half-copy (no pip, and json errors segfault), so it runs on GitHub-hosted only.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: static-label-python
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
          update-environment: false

      #
      - name: Prepare static label parser
        env:
          STATIC_LABEL_PYTHON: ${{ steps.static-label-python.outputs.python-path || '/usr/bin/python3' }}
        run: |
          # On GARM VMs setup-python upgrades pip in a different tool-cache copy than the
          # python-path it outputs, so that interpreter can lack pip. Bootstrap it from the
          # interpreter's own bundled ensurepip (offline, no new dependency) only when missing.
          # If even ensurepip cannot reach it, install with a throwaway venv of the same
          # minor version; the parser itself still runs on $STATIC_LABEL_PYTHON.
          PIP_PYTHON="$STATIC_LABEL_PYTHON"
          if ! "$PIP_PYTHON" -m pip --version >/dev/null 2>&1; then
            "$PIP_PYTHON" -m ensurepip --default-pip >/dev/null 2>&1 || true
          fi
          if ! "$PIP_PYTHON" -m pip --version >/dev/null 2>&1; then
            /usr/bin/python3 -m venv "$RUNNER_TEMP/static-label-pip"
            PIP_PYTHON="$RUNNER_TEMP/static-label-pip/bin/python"
          fi
          "$PIP_PYTHON" -m pip install --disable-pip-version-check \
            --only-binary=:all: --no-deps --require-hashes \
            --target "$RUNNER_TEMP/static-label-guard-deps" \
            -r scripts/static-label-guard-requirements.txt

      # The actual comparison is in the required suites job, not an optional
      # standalone workflow. It will also feed ci-ok when CI gating migrates.
      #
      - name: Reject newly added static runner labels
        env:
          STATIC_LABEL_PYTHON: ${{ steps.static-label-python.outputs.python-path || '/usr/bin/python3' }}
          PYTHONPATH: ${{ runner.temp }}/static-label-guard-deps
        run: bash scripts/ci_no_new_static_labels.sh --event

      #
      - name: static runner label guard red/green proof
        env:
          STATIC_LABEL_PYTHON: ${{ steps.static-label-python.outputs.python-path || '/usr/bin/python3' }}
          PYTHONPATH: ${{ runner.temp }}/static-label-guard-deps
        run: bash ./test_ci_no_new_static_labels.sh

      # case_d8c3515a. Fail fast on a full host instead of dying mid-suite. On
      # 2026-09-17 (case_231b8224) the runner host disk filled and jobs died with
      # `No space left on device` deep inside the longest suites — the
      # evidence (the runners' own exception text) sat in annotations with
      # nothing reading it before scheduling onto a host that could not
      # write. This preflight reads the host's own disk BEFORE any suite
      # burns time: pressure at or above warn fails the step with the cause
      # named, inconclusive (exit 2) fails rather than scoring an unmeasured
      # host clean. It deletes nothing; reclaiming is the runbook's job
      # (docs/runbooks/runner-disk-pressure.md).
      #
      # Persistent-host only (case_dbfa63d9 3rd verdict): on ephemeral/CI-overflow
      # workers the `/` being measured is the worker's own small root disk,
      # hot by design (82% on the stock image) and unrelated to any persistent
      # host — enforcing there would red every PR. Gate on the runner
      # identity proof's fleet prefixes: enforce on the persistent fleets
      # (coolify-vps-*, ci-node7b1ff338-iso-*), advisory (::warning, exit 0)
      # elsewhere. The daily live workflow keeps the unconditioned check
      # because it only ever runs on a persistent self-hosted runner.
      #
      - name: runner disk-pressure preflight
        run: |
          set -uo pipefail
          # set +e around the capture is load-bearing, not style: the runner
          # executes steps with `bash -e`, so a nonzero detector exit (rc 1
          # pressure / rc 2 inconclusive — the exact cases this step exists
          # to handle) would kill the shell at the assignment and `rc=$?`
          # plus the ::error annotation would never run. case_dbfa63d9 caught the
          # silent death on the first CI run of this step.
          set +e
          out="$(./runner_disk_pressure.sh --runner-root /opt/actions-runners --runner-root /home/gha-runner 2>&1)"; rc=$?
          set -e
          # The legacy hand-installed layout (/home/gha-runner) may not exist
          # on a bundle-layout host; the script already reports that as a
          # note, so no fallback flag is needed here.
          printf '%s\n' "$out"
          if [[ "${RUNNER_NAME:-}" != coolify-vps-* && "${RUNNER_NAME:-}" != ci-node7b1ff338-iso-* ]]; then
            if [[ $rc -ne 0 ]]; then
              summary="$(printf '%s\n' "$out" | head -n 3 | tr '\n' ' ' | cut -c1-1500)"
              summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
              echo "::warning title=Runner disk pressure (advisory: ephemeral worker)::$summary"
            fi
            echo "advisory only on '${RUNNER_NAME:-unknown}': ephemeral worker disk is not the persistent host; not failing."
            exit 0
          fi
          if [[ $rc -eq 1 ]]; then
            summary="$(printf '%s\n' "$out" | head -n 3 | tr '\n' ' ' | cut -c1-1500)"
            summary="${summary//'%'/'%25'}"; summary="${summary//$'\r'/'%0D'}"
            echo "::error title=Runner disk pressure::$summary"
            exit 1
          elif [[ $rc -eq 2 ]]; then
            echo "::error title=Runner disk pressure::detector inconclusive; refusing to score an unmeasured host clean"
            exit 2
          fi

      # case_a2b959d4: pinned to .nvmrc (Node 24) like every other job. The old
      # '20' here skewed local (24) vs CI and produced "passes locally, fails
      # in CI" on node --test semantics. Change .nvmrc and this line together.
      #
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

