      - name: Restore toolkit-vendored files
        run: bash scripts/sync-toolkit.sh

      - name: change-gating contract holds
        run: ./test_ci_gating.sh

      # case_6bf2cca9. The review-routing contract is load-bearing for review-model
      # spend: a red router that CI never executes would silently misroute
      # risky diffs to `standard`. verify-fast.sh --parse-only never reaches
      # it (parse tier only), so it gets its own step like test_ci_gating.sh.
      #
      - name: review routing contract holds
        run: ./test_review_route.sh

      # The review-report input-integrity suites are load-bearing for honest
      # partial reports: without this step the validation they pin (invalid
      # route/bucket rejection, future-date refusal, empty-ledger unknown)
      # could be deleted while CI stays green. Runs alongside the router
      # contract with the same gating (no area `if:`: every suites run).
      - name: review report input integrity holds
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_review_report_input_integrity
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest -v test_review_report_empty_ledger

      # Shell-substitution guard contract: the offline gate that refuses an
      # unbounded `yes` inside `$(...)`/backticks before execution (the
      # memcg OOM mechanism: substitution collects stdout until EOF and
      # `yes` never sends EOF). A neutered always-clean stub fails the
      # suite, so a vacuous gate cannot hide. Hermetic (argv/file/stdin
      # fixtures only, never executes an unbounded producer), so it runs in
      # the core area next to the other contract gates. Without this step
      # the suite runs only in the full local verify-fast tier while CI runs
      # --parse-only, so a gate regression would merge green.
      - name: shell-subst guard suite
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: ./test_shell_subst_guard.sh

      - name: deploy-window wrapper and pin mutation suites
        if: needs.changes.outputs.full == 'true' || needs.changes.outputs.core == 'true'
        run: |
          ./test_deploy_window_open.sh
          ./verification/case_c89b5362-drift-pin-mutation-gate.sh
