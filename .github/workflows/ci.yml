name: CI

# WHAT THIS RUNS, AND WHAT IT DOES NOT.
#
# CI runs some of this repo's suites and not others. Read this before adding a
# green badge anywhere: a CI that looks like it tests everything while testing
# part of it is worse than one that says which part.
#
#   ADDING A SUITE: every tracked test suite (test_* scripts and JS/TS
#   *.test.* / *.spec.* files) must be referenced by a run: step in
#   .github/workflows/*.yml (or by a script those steps call, starting
#   with the parse tier of scripts/verify-fast.sh — references in
#   the full tier below its --parse-only exit never run in CI), or carry a
#   one-line-reason exemption in verification/orphan_suites_allowlist.json.
#   The parse tier of scripts/verify-fast.sh enforces this via
#   verification/orphan_suites.py.
#
#   REPO SPLIT (C5e cutover): default restoration is immutable toolkit main-d0324d0.
#   Only 19 complete portable producers with exact-pin suite, dependency and
#   hosted-command proof are removed from 247 accepted runnable suites steps.
#   The 228 retained producers include private/diverged/unproved behavior;
#   a restored path is not, by itself, proof that its private consumer moved.
#   See vendor/offline-ci-contract.json and docs/offline-ci-cutover.md for the
#   executable producer partition, aliases and seven explicit v0.2.2 private
#   compatibility exceptions. Jobs, routes, timeouts and required gates stay.
#
#   REPO SPLIT (C6 cutover): plugins/model-selection/ moved in full to the
#   toolkit at v0.5.1, with its suite/impact/mutants jobs. Nothing in this
#   file tests it anymore; the `model-selection moved` step of `secret-scan` fails any PR that
#   touches the moved path, with a pointer to the toolkit.
#
#   REPO SPLIT (C4 freeze): the `public-owned freeze` step of `secret-scan` fails any PR that
#   adds/modifies a path listed in public-owned-paths.txt (toolkit-owned at
#   pinned v0.2.0). Make the change in the toolkit instead.
#
#   RUNS HERE (offline, no credentials, no database):
#     test_gh_token_argv.sh             gh_token.sh: no credential on argv
#     test_gh_token_dispatch.sh         gh_token.sh: refuses unknown subcommands
#     test_gh_token_api_body.sh         gh_token.sh: the request body reaches the
#                                       REQUEST rather than curl's argv, so a
#                                       `sha` head guard is actually sent and a
#                                       guarded write is guarded — case_154364ee
#     test_cliproxy_mgmt_recon_argv.sh  cliproxy_mgmt_recon.sh: no management
#                                       key on curl argv (0600 --config file),
#                                       report contract unchanged — case_7cbfeac4
#     test/external-disclosure.test.mjs immutable task/run/artifact/principal
#                                       grants, one-shot consumption and redacted
#                                       submission receipts — case_ed522ea3
#     hooks/muse-stop-guard/*.test.mjs  the Claude Code Stop hook for Muse agents:
#                                       only muse models, a hard nudge cap, fail-open,
#                                       and an installer that touches only its own entry
#     hooks/disposition-stop-guard/**/*.test.mjs  the Claude Code Stop hook for every
#                                       agent: only a card with no live path, a hard hand-back
#                                       cap, fail-open, read-only, and the repair census
#     omniroute_combo_cli.sh selftest   containment logic, fixture catalogue
#     test_case_8968f48d_artifacts.sh          case_d06b6dba register/verify artifact contract:
#                                       fail-loud argv, dedicated catch-all,
#                                       .items envelope and verifier B4 — case_dd69744c
#     test_responsible_leader.sh        who may approve a provisioning request
#     test_provisioning_policy.sh       create-policy gates under widened ceilings
#     test_request_record_integrity.sh  whether the RECORD of a decision can
#                                       still say what was approved and why
#     test_decision_notify.sh           whether the REQUESTER ever learns a
#                                       request was decided, and that delivery
#                                       cannot influence a decision — case_1b34645a
#     test_leader_notify.sh             whether the derived LEADER is told, and
#                                       all transport invocations are contained
#                                       without disputing honest concurrent
#                                       reviews — case_3fa83f90
#     test_capability_gate.sh           who may decide a CAPABILITY request, and
#                                       which four asks stop for the owner
#                                       whatever any agent says — case_acb41886
#     test_case_bc1705d4_verify_g4.sh          whether the host acceptance gate can read
#                                       the current structured listening event,
#                                       and refuses missing/contradictory evidence
#                                       rather than scoring it green — case_b22b58a0
#     test_host_ops_broker.py           fixed read-only host verbs, executor
#                                       previews, replay/expiry, signed evidence,
#                                       and the disabled write gate — case_0d1b8a91
#     test_host_ops_install.sh          the installer's service-identity, key and
