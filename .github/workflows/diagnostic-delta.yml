name: Diagnostic identity delta

# Read-only opt-in ratchet over AX-lint diagnostic identities. Compares the
# exact supplied snapshots and fails on net-new diagnostics in scope. Does not
# change branch protection or the separately staged Tier-0 foundation. No PR
# commands, generators or consumer scripts are run: the hosted job executes
# only the pinned checker.
on:
  workflow_call:
    inputs:
      base-sha:
        description: Full base commit SHA; supplies the trusted policy snapshot
        required: true
        type: string
      head-sha:
        description: Full head commit SHA under measurement
        required: true
        type: string
      tools-ref:
        description: Full paperclip-ops commit SHA, pinned alongside the workflow ref
        required: true
        type: string
      artifact-name:
        description: Report artifact name; must be unique per invocation within one workflow run
        required: false
        default: diagnostic-delta-report
        type: string
  workflow_dispatch:
    inputs:
      base-sha:
        description: Full base commit SHA; supplies the trusted policy snapshot
        required: true
        type: string
      head-sha:
        description: Full head commit SHA under measurement
        required: true
        type: string
      tools-ref:
        description: Full paperclip-ops commit SHA, pinned alongside the workflow ref
        required: true
        type: string
      artifact-name:
        description: Report artifact name; must be unique per invocation within one workflow run
        required: false
        default: diagnostic-delta-report
        type: string

permissions:
  contents: read

jobs:
  diagnostic-delta:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_SHA: ${{ inputs.base-sha }}
      HEAD_SHA: ${{ inputs.head-sha }}
      TOOLS_REF: ${{ inputs.tools-ref }}
      CALL_INPUTS: ${{ toJSON(inputs) }}
      REPORT_PATH: ${{ github.workspace }}/diagnostic-delta-report.json
    steps:
      - name: Validate immutable inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          values = {name: os.environ[name] for name in ("BASE_SHA", "HEAD_SHA", "TOOLS_REF")}
          call_inputs = json.loads(os.environ["CALL_INPUTS"])
          if call_inputs:
              # Validate raw call inputs: empty required values must not fall
              # through to the native-event SHA expressions above.
              values = {name: call_inputs.get(key, "") for name, key in
                        (("BASE_SHA", "base-sha"), ("HEAD_SHA", "head-sha"), ("TOOLS_REF", "tools-ref"))}
          # Both pinned checkout steps support SHA-1 only. The local checker
          # also supports SHA-256, but this hosted interface must reject it
          # before checkout rather than misrouting a 64-hex value as a ref.
          patterns = {name: r"[0-9a-f]{40}" for name in values}
          for name, value in values.items():
              if not re.fullmatch(patterns[name], value):
                  raise SystemExit(f"{name}: provide a full lowercase commit SHA, not a branch or expression")
          PY
      - name: Check out the caller history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: caller
      - name: Check out pinned checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TogetherWeOwn/paperclip-ops
          ref: ${{ inputs.tools-ref }}
          persist-credentials: false
          path: diagnostic-delta-tools
      - name: Run diagnostic identity delta
        shell: bash
        env:
          CHECKER: diagnostic-delta-tools/scripts/quality-gates/diagnostic_delta.py
        run: |
          set -o pipefail
          python3 "$CHECKER" --repo caller --base "$BASE_SHA" --head "$HEAD_SHA" | tee "$REPORT_PATH"
      - name: Upload diagnostic delta report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
