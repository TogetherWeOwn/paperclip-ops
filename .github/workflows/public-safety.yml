name: public-safety

on:
  push:
    # Merge-queue commits are covered by merge_group below. Without this
    # ignore, creating the queue branch also fires a push run for the same
    # commit; both runs share the concurrency group below (no pull_request
    # number, same ref), cancel-in-progress kills one instantly, and the
    # cancelled required check ejects the entry from the merge queue.
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private artifacts and deployment identifiers
        run: python3 .github/scripts/public_safety.py
      - name: Scan working tree and fetched history with reviewed fixture exceptions
        env:
          SCANNER: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker pull "$SCANNER"
          docker run --rm --network none -v "$PWD:/repo:ro" "$SCANNER" dir /repo --config /repo/.gitleaks.toml --redact=100 --no-banner
          # Scope the history scan to commits introduced here. actions/checkout
          # with fetch-depth 0 fetches every branch, so --all scans unrelated
          # branches (e.g. vendor/offline-ci-contract.json churn elsewhere)
          # against this commit's allowlist and reds every PR for another
          # branch's fixtures. The dir scan above already covers the tree.
          #
          # Fail closed: there is no narrowed single-commit fallback. A
          # merge-base range stays correct when main advances after the
          # pull-request merge ref is created (origin/main..HEAD would then
          # fail its ancestor check, and scanning just the synthetic merge
          # commit with -p -U0 prints no patch, passing vacuously). Pushes
          # with a usable base scan before..HEAD so a multi-commit push
          # scans every pushed commit, not just the tip; new branches/tags
          # (empty or zero BEFORE) fall back to the merge-base range,
          # exactly as pull-request runs do. A push whose BEFORE is non-zero
          # but absent from this clone (force-push with a missing old tip)
          # has unknown rewritten history: scanning the merge-base range
          # would be empty on main (merge-base equals HEAD) and skip every
          # rewritten commit, so scan all reachable history instead (HEAD).
          # Unresolvable ranges fail closed via the rev-list validation
          # below. An empty pull-request range also fails closed; other
          # events with no new commits need only the tree scan.
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              RANGE="$BEFORE..HEAD"
            elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$(git merge-base origin/main HEAD)" || {
                echo "no merge-base with origin/main; failing closed" >&2
                exit 1
              }
              RANGE="$BASE_SHA..HEAD"
            else
              RANGE="HEAD"
            fi
          else
            BASE_SHA="$(git merge-base origin/main HEAD)" || {
              echo "no merge-base with origin/main; failing closed" >&2
              exit 1
            }
            RANGE="$BASE_SHA..HEAD"
          fi
          COUNT="$(git rev-list --count "$RANGE")" || {
            echo "unresolvable history range $RANGE; failing closed" >&2
            exit 1
          }
          if [ "$COUNT" = "0" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "pull-request history range $RANGE covers 0 commits; failing closed" >&2
              exit 1
            fi
            echo "no new commits in $RANGE; working-tree scan covers this event"
            exit 0
          fi
          docker run --rm --network none -v "$PWD:/repo:ro" "$SCANNER" git /repo --log-opts="$RANGE" --config /repo/.gitleaks.toml --redact=100 --no-banner
