name: public-safety

on:
  push:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private artifacts and deployment identifiers
        run: python3 .github/scripts/public_safety.py
      - name: Scan working tree and fetched history with reviewed fixture exceptions
        env:
          SCANNER: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker pull "$SCANNER"
          docker run --rm --network none -v "$PWD:/repo:ro" "$SCANNER" dir /repo --config /repo/.gitleaks.toml --redact=100 --no-banner
          # Scope the history scan to commits introduced here. actions/checkout
          # with fetch-depth 0 fetches every branch, so --all scans unrelated
          # branches (e.g. consolidate/operator-toolkit) against this commit's
          # allowlist and reds every PR for another branch's contract-hash
          # churn. The dir scan above already covers the checked-out tree.
          BASE="origin/main"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "public-safety: $BASE is missing; failing closed" >&2
            exit 1
          fi
          # Scan every commit introduced on this side of the merge base, so a
          # diverged branch (or a PR merge ref re-run after main has moved)
          # cannot hide a secret added and removed in an earlier commit. A tip
          # scan would miss those; on a merge commit it would scan nothing.
          MB="$(git merge-base "$BASE" HEAD)" || {
            echo "public-safety: no merge base with $BASE; failing closed" >&2
            exit 1
          }
          RANGE="$MB..HEAD"
          if [ "$(git rev-list "$RANGE" --count)" = "0" ]; then
            # Push to main itself: the branch range is empty, so scan the tip.
            RANGE="-1 HEAD"
          fi
          docker run --rm --network none -v "$PWD:/repo:ro" "$SCANNER" git /repo --log-opts="$RANGE" --config /repo/.gitleaks.toml --redact=100 --no-banner
