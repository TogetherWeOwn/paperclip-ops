name: test-guard

# TogetherWeOwn SDLC standard, one-click template for active repos.
# Calls the org reusable test-guard gate (Builder must not modify
# acceptance tests written by the Test Author). Lands in warn mode:
# it reports but never fails. Per-repo overrides go in
# `.github/test-guard.json` (see TEST-GUARD.md in the .github repo).
# Pinned to the merge SHA of the reusable workflow; repin the same way
# on later updates — never a moving tag.
# Do NOT add this check to any ruleset until the repo flips to enforce.
# ci-policy: non-required -- warn-only caller; enforce uses the org required workflow (TEST-GUARD.md)

on:
  # labeled/unlabeled: the marker label is usually set after the PR
  # exists; without these the gate never re-evaluates a fresh label.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read # marker-label actor audit via the issue-events API

concurrency:
  group: test-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Keep id and name byte-identical: a future org ruleset requires `test-guard`.
  test-guard:
    name: test-guard
    # Caller of the org reusable gate: passes the marker-label audit
    # scopes through; repeats the workflow floor exactly.
    permissions:
      contents: read
      pull-requests: read
    uses: TogetherWeOwn/.github/.github/workflows/test-guard.yml@866275517a9875f02110f946411401db8907ec8a
    # Private repo: no GitHub-hosted minutes; two-ephemeral is this repo's GARM pool.
    with:
      runs-on-json: '["ubuntu-latest"]' 
