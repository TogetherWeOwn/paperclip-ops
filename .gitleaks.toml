title = "Reviewed synthetic fixtures and integrity hashes only"
minVersion = "8.25.0"
[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic email body sentinel in in-memory KV redaction test; not an external credential."
condition = "AND"
paths = ['''(^|/)distribution\-kit/worker/test/email\-storage\.test\.mjs$''']
regexTarget = "line"
regexes = ['''(?m)^\ \ \ \ const\ secret\ =\ "secret\-body\-xyz\-123";$''']

[[allowlists]]
targetRules = ["curl-auth-header"]
description = "Deliberately wrong authorization header in negative authentication acceptance test."
condition = "AND"
paths = ['''(^|/)acceptance_transport\.sh$''']
regexTarget = "line"
regexes = ['''(?m)^CODE="\$\(curl\ \-s\ \-o\ /dev/null\ \-w\ '%\{http_code\}'\ \-X\ POST\ \-H\ 'Content\-Type:\ application/json'\ \\\n\ \ \ \ \ \ \ \ \-H\ 'Authorization:\ Bearer\ wrong\-bearer'\ \-d\ '\{"jsonrpc":"2\.0","id":1,"method":"tools/list"\}'\ "\$URL"\)"$''']

[[allowlists]]
targetRules = ["gcp-api-key"]
description = "Deliberately planted Google credential-shape sample in redaction self-test."
condition = "AND"
paths = ['''(^|/)omniroute/case_30ade3fb\-snapshot\-sections\.py$''']
regexTarget = "line"
regexes = ['''(?m)^\ \ \ \ \ \ \ \ \("google",\ "AIzaSyD\-9tSrke72PouQMnMX\-a7eZSW0jkFMBWY"\),$''']

[[allowlists]]
targetRules = ["jwt", "generic-api-key"]
description = "Deliberately planted JWT sample in redaction self-test, not a live session."
condition = "AND"
paths = ['''(^|/)omniroute/case_30ade3fb\-snapshot\-sections\.py$''']
regexTarget = "line"
regexes = ['''(?m)^\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "access_token":\ "eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdefghij",$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Deliberately planted repeated hexadecimal refresh-token sample in redaction self-test."
condition = "AND"
paths = ['''(^|/)omniroute/case_30ade3fb\-snapshot\-sections\.py$''']
regexTarget = "line"
regexes = ['''(?m)^\ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ "deeply":\ \{"nested":\ \{"refresh_token":\ "0123456789abcdef0123456789abcdef01234567"\}\},$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic collision fixture in historical patch; patch quarantined with private history artifacts."
condition = "AND"
paths = ['''(^|/)patches/case_f17dd2a7\-truncated\-secret\-redaction\.patch$''']
regexTarget = "line"
regexes = ['''(?m)^\+\ \ \ \ const\ keyWindow\ =\ "AZyLk9WvIh6TsFe3";$''']

