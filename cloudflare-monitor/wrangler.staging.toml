name = "cloudflare-uptime-staging"
main = "src/worker.mjs"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
ENVIRONMENT = "staging"

[triggers]
crons = ["*/5 * * * *"]

[[durable_objects.bindings]]
name = "MONITOR"
class_name = "Monitor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Monitor"]
