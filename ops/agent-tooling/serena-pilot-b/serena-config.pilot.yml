# Pilot B global Serena config template.
#
# code-nav seeds this to $SERENA_HOME/serena_config.yml when missing (sticky:
# delete the seeded copy to re-seed after template changes; Serena itself may
# normalize the seeded file's comments, which is harmless).
#
# Why this exists: Serena's default project data folder is
# $projectDir/.serena, so the first call in a fresh worktree would create an
# untracked .serena/ directory (autogenerated project.yml, .gitignore, LS
# caches) inside the repo. Redirecting it keeps the pilot's "wrote nothing
# into the repo" property. Verified against the serena-agent 2.0.0 sdist:
# SerenaConfig.project_serena_folder_location with $projectFolderName
# placeholder (config/serena_config.py).
#
# Known pilot limitation: folders are keyed by directory basename, so two
# different repos with the same basename would share one data folder. Builder
# worktree directories are card-unique, so this is acceptable for the canary.
#
# `projects` must be present (it may be empty): from_config_file raises
# SerenaConfigError when the key is missing. Every repo is activated
# dynamically via --project-from-cwd, so the list stays empty.
projects: []
project_serena_folder_location: "/tmp/serena-home/projects/$projectFolderName"
