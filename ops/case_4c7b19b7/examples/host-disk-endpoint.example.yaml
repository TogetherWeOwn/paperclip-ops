external-endpoints:
  - name: host-disk
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: discord
        description: "CI host disk at or above warn threshold (see push-host-disk log)"
      - type: custom
        description: "CI host disk at or above warn threshold (see push-host-disk log)"
