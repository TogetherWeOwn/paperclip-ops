    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 3000"
    alerts:
      - type: discord
        description: "TWO web prod unhealthy. THRESHOLD STATUS!=200 or RESPONSE_TIME>=3000ms. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
      - type: custom
        description: "TWO web prod unhealthy. THRESHOLD STATUS!=200 or RESPONSE_TIME>=3000ms. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"

