# case_658bf6b9 phase-1 Gatus config — Beszel covers hosts, Gatus covers services.
#
# DEPLOYMENT: copied to the node7b1ff338 host by the operator (see OPERATOR.md).
# Every secret is an ${ENV} reference resolved from a root-only 0600 env
# file on the host. NOTHING secret is committed here — the offline suite
# (test_case_60330d6f_status_pilot.sh) fails the build if a secret-shaped string
# or a live webhook URL lands in this file.
#
# Gatus: TwiN/gatus pinned v5.37.0 (2026-09-24), Apache-2.0.
# Akmatori: akmatori/akmatori pinned v0.3.0 (2026-08-10), Apache-2.0.
# Akmatori has NO generic webhook — only native adapters (Alertmanager,
# Grafana, Zabbix, PagerDuty, Datadog). The `custom` provider below therefore
# speaks Alertmanager-native JSON to Akmatori's per-source Alertmanager
# webhook URL (https://akmatori.com/docs/integrations/alertmanager):
# top-level receiver/status plus an alerts[] array with
# labels.alertname/severity/instance and annotations.summary/description.
# [ALERT_TRIGGERED_OR_RESOLVED] is remapped to firing/resolved so that
# send_resolved closes the Akmatori incident.
#
# Beszel alerts are NOT routed here: Beszel's generic webhook posts
# {title, body}, which matches no Akmatori adapter. Beszel notifies via
# Discord (Shoutrrr) only in phase 1.

alerting:
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
  custom:
    url: "${AKMATORI_ALERTMANAGER_URL}"
    method: "POST"
    headers:
      Content-Type: "application/json"
      Authorization: "Bearer ${AKMATORI_WEBHOOK_SECRET}"
    body: |
      {
        "receiver": "akmatori",
        "status": "[ALERT_TRIGGERED_OR_RESOLVED]",
        "alerts": [
          {
            "status": "[ALERT_TRIGGERED_OR_RESOLVED]",
            "labels": {
              "alertname": "[ENDPOINT_NAME]",
              "severity": "critical",
              "instance": "[ENDPOINT_URL]"
            },
            "annotations": {
              "summary": "[ENDPOINT_GROUP] / [ENDPOINT_NAME]",
              "description": "[ALERT_DESCRIPTION]: [RESULT_ERRORS]"
            }
          }
        ]
      }
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: "firing"
        RESOLVED: "resolved"
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
