  # NOTE: the Discord bot is push-only (heartbeat via external-endpoint
  # platform_discord-bot below); there is deliberately no pull endpoint for it.
  # --- pushed programmatically by ops/case_658bf6b9/push-*.sh cron jobs ---------
  # Keys are derived as <group>_<name> with separators mapped to '-':
  #   platform_discord-bot  platform_lxc-ci-vms  platform_oom-kills
  #   platform_ci-queue-age  platform_tls-expiry  platform_garm-pool
  #   platform_neon-staging  platform_garm-reaper
  #   platform_workers-error-rate  platform_github-rate-limit
  # Push: POST /api/v1/endpoints/<key>/external?success=<bool>&error=<msg>
  # with  Authorization: Bearer ${GATUS_EXTERNAL_TOKEN}.
  # One pilot token for all ten; rotation is a single env-file edit.

external-endpoints:
  - name: discord-bot
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: discord
        description: "Discord bot heartbeat stale or failing. THRESHOLD no successful heartbeat in 10m. OWNER automation. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
      - type: custom
        description: "Discord bot heartbeat stale or failing. THRESHOLD no successful heartbeat in 10m. OWNER automation. RUNBOOK ops/case_658bf6b9/OPERATOR.md"

  - name: lxc-ci-vms
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 15m
    alerts:
      - type: discord
        description: "CI LXC VM not running (see push-lxc-state log). THRESHOLD any listed VM not RUNNING or no push in 15m. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
      - type: custom
        description: "CI LXC VM not running (see push-lxc-state log). THRESHOLD any listed VM not RUNNING or no push in 15m. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"

  - name: oom-kills
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 15m
    alerts:
      - type: discord
        description: "OOM kill observed in host journal. THRESHOLD any Killed-process line or no push in 15m. OWNER devops. RUNBOOK docs/runbooks/runner-disk-triage.md"
      - type: custom
        description: "OOM kill observed in host journal. THRESHOLD any Killed-process line or no push in 15m. OWNER devops. RUNBOOK docs/runbooks/runner-disk-triage.md"

  - name: ci-queue-age
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      # case_60a899d5: the 60m breach threshold lives in push-ci-queue-age.sh
      # (QUEUE_AGE_THRESHOLD_MIN), so the first success=false push is already
      # a real breach. Gatus fires each alert once, then goes quiet while the
      # endpoint stays unhealthy — the sustained-firing gap (last incident:
      # 240m actual oldest wait vs reported). minimum-reminder-interval
      # re-pages hourly while the breach holds (floor 5m, v5.37.0
      # watchdog/alerting.go). send-on-resolved is inherited from each
      # provider default-alert above: recovery closes the incident.
      - type: discord
        description: "Oldest queued CI job exceeds threshold. THRESHOLD oldest runner-waiting job age>QUEUE_AGE_THRESHOLD_MIN (default 60m). OWNER devops. RUNBOOK docs/runbooks/garm-ci-oncall-alert-to-action.md"
        minimum-reminder-interval: 60m
      - type: custom
        description: "Oldest queued CI job exceeds threshold. THRESHOLD oldest runner-waiting job age>QUEUE_AGE_THRESHOLD_MIN (default 60m). OWNER devops. RUNBOOK docs/runbooks/garm-ci-oncall-alert-to-action.md"
        minimum-reminder-interval: 60m
      # case_60a899d5 escalation: a second pair with a sustained-breach
      # threshold. The push cron runs every 5m and every success=false push
      # increments the same failure streak, so failure-threshold 24 is about
      # 2h of continuous breach (queue age about 60m detector threshold plus
      # 2h). Duplicate alert types are allowed and each alert keeps its own
      # triggered state. No reminder here: the escalation firing IS the event,
      # and it refreshes the shared reminder clock, so the base pair's next
      # hourly reminder shifts by one escalation, not zero.
      - type: discord
        failure-threshold: 24
        description: "ESCALATED: oldest queued CI job still exceeds threshold after about 2h - wake the on-call owner. THRESHOLD breach holds ~2h (failure-threshold 24 at 5m push cadence). OWNER devops. RUNBOOK ops/case_658bf6b9/queue-age-escalation.md"
        send-on-resolved: true
      - type: custom
        failure-threshold: 24
        description: "ESCALATED: oldest queued CI job still exceeds threshold after about 2h - wake the on-call owner. THRESHOLD breach holds ~2h (failure-threshold 24 at 5m push cadence). OWNER devops. RUNBOOK ops/case_658bf6b9/queue-age-escalation.md"
        send-on-resolved: true

  # Pushed by push-tls-expiry.sh (case_66436e78 dependencies): leaf-certificate
  # expiry for the staging/prod domains; warn at 21d, crit at 7d, both push
  # DOWN. A missed 26h heartbeat fails closed (UNKNOWN, never healthy).
  # Daily cron; install is a separate CEO Operator card.
  - name: tls-expiry
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 26h
    alerts:
      - type: discord
        description: "TLS certificate near expiry. THRESHOLD cert expiry within warning window or no push in 26h. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
      - type: custom
        description: "TLS certificate near expiry. THRESHOLD cert expiry within warning window or no push in 26h. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"

  # Pushed by push-domain-expiry.sh: registrar (RDAP expiration event)
  # expiry for the owned registered domains; warn at 21d, crit at 7d, both
  # push DOWN. Complements tls-expiry (certificate notAfter): a renewed
  # certificate over a lapsed registration still goes dark. A missed push
  # fails closed; the 12h heartbeat plus 6h cron cadence bounds detection to
  # under 24h. Alerts track each probe result immediately. Gatus fires each
  # alert once per failure streak, so both alerts carry
  # minimum-reminder-interval 24h to re-page daily while a warn/crit window
  # holds. Install is a separate CEO Operator card.
  - name: domain-expiry
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 12h
    alerts:
      - type: discord
        failure-threshold: 1
        success-threshold: 1
        description: "Registrar domain near expiry (RDAP). THRESHOLD domain expiry within warning window or no push in 12h (detection within 24h). OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
        minimum-reminder-interval: 24h
      - type: custom
        failure-threshold: 1
        success-threshold: 1
        description: "Registrar domain near expiry (RDAP). THRESHOLD domain expiry within warning window or no push in 12h (detection within 24h). OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
        minimum-reminder-interval: 24h

  # Pushed by push-garm-pool.sh (case_6ab2cd4d D2): per-pool GARM state plus the
  # eligible-label queue age. A missed 10m heartbeat fails closed (UNKNOWN,
  # never healthy). Cron install is a separate CEO Operator card.
  - name: garm-pool
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: discord
        description: "GARM pool unhealthy or eligible queue breaching (see push-garm-pool log). THRESHOLD pool disabled/unhealthy, idle shortfall, or eligible-label queue>GARM_QUEUE_THRESHOLD_MIN. OWNER devops. RUNBOOK docs/runbooks/garm-ci-oncall-alert-to-action.md"
      - type: custom
        description: "GARM pool unhealthy or eligible queue breaching (see push-garm-pool log). THRESHOLD pool disabled/unhealthy, idle shortfall, or eligible-label queue>GARM_QUEUE_THRESHOLD_MIN. OWNER devops. RUNBOOK docs/runbooks/garm-ci-oncall-alert-to-action.md"

  # Pushed by push-neon-reachability.sh (case_66436e78 dependencies): Neon
  # STAGING-branch reachability — TCP connect plus lightweight SELECT 1 over
  # a TLS-required session, staging binding only (production-like targets
  # refuse to dial). Any probe failure pushes DOWN. A missed 10m heartbeat
  # fails closed (UNKNOWN, never healthy). Cron install is a separate CEO
  # Operator card.
  - name: neon-staging
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: discord
        description: "Neon staging branch unreachable (see push-neon-reachability log). THRESHOLD TCP or SELECT 1 failure or no push in 10m. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
      - type: custom
        description: "Neon staging branch unreachable (see push-neon-reachability log). THRESHOLD TCP or SELECT 1 failure or no push in 10m. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"

  # Pushed by push-garm-reaper.sh (case_80716129): orphan/stale GARM instance
  # audit verdict (read-only; deletes need a CEO Operator card per
  # TTL-REAPER-POLICY.md). A missed 30m heartbeat fails closed (UNKNOWN,
  # never healthy). Cron install is a separate CEO Operator card.
  - name: garm-reaper
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 30m
    alerts:
      - type: discord
        description: "GARM orphan/stale instances need operator review (see push-garm-reaper log). THRESHOLD orphan/stale instances flagged or no push in 30m. OWNER devops. RUNBOOK docs/runbooks/garm-ci-oncall-alert-to-action.md"
      - type: custom
        description: "GARM orphan/stale instances need operator review (see push-garm-reaper log). THRESHOLD orphan/stale instances flagged or no push in 30m. OWNER devops. RUNBOOK docs/runbooks/garm-ci-oncall-alert-to-action.md"
  # Pushed by push-workers-error-rate.sh (case_2d984d9b): Cloudflare Workers
  # error ratio for the staging + prod scripts vs WORKERS_ERROR_THRESHOLD_PCT
  # (default 1%). A missed 10m heartbeat fails closed (UNKNOWN, never
  # healthy). Cron install is a separate CEO Operator card.
  - name: workers-error-rate
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: discord
        description: "Cloudflare Workers error ratio breaching (see push-workers-error-rate log). THRESHOLD error ratio>WORKERS_ERROR_THRESHOLD_PCT (default 1%) or no push in 10m. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
      - type: custom
        description: "Cloudflare Workers error ratio breaching (see push-workers-error-rate log). THRESHOLD error ratio>WORKERS_ERROR_THRESHOLD_PCT (default 1%) or no push in 10m. OWNER devops. RUNBOOK ops/case_658bf6b9/OPERATOR.md"

  # Pushed by push-github-rate-limit.sh (case_2d984d9b): token-free
  # GET /rate_limit core.remaining vs GITHUB_RATELIMIT_MIN_REMAINING
  # (default 10). A missed 10m heartbeat fails closed (UNKNOWN, never
  # healthy). Cron install is a separate CEO Operator card.
  - name: github-rate-limit
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: discord
        description: "GitHub API core quota near exhaustion (see push-github-rate-limit log). THRESHOLD core.remaining<GITHUB_RATELIMIT_MIN_REMAINING (default 10) or no push in 10m. OWNER automation. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
      - type: custom
        description: "GitHub API core quota near exhaustion (see push-github-rate-limit log). THRESHOLD core.remaining<GITHUB_RATELIMIT_MIN_REMAINING (default 10) or no push in 10m. OWNER automation. RUNBOOK ops/case_658bf6b9/OPERATOR.md"
