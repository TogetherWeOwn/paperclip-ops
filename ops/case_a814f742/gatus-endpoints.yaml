# ops/case_a814f742/gatus-endpoints.yaml — case_71e7a4e9 platform_runner-disk.
#
# MERGE: append the entry below under the host Gatus config's
# `external-endpoints:` list (see ops/case_658bf6b9/gatus-config.yaml for the
# alerting providers it reuses: discord + the Akmatori Alertmanager feed).
# The value arrives via push-runner-disk.sh on cron every 5 min (twice the
# 10m heartbeat, so one slow run cannot trip a false "no update received").
# A missed 10m heartbeat fails closed (UNKNOWN, never healthy). The push
# skips the triage du size scan (the evaluator never reads sizes). Cron
# install is a separate CEO Operator card, same as the case_658bf6b9 push scripts.
#
# WHAT IT COVERS (parent case_66436e78, thresholds from the case_a814f742 document):
# host root disk (`df` Use% on `/` — the case_231b8224 killer), host inodes
# (`df -i` IUse% on `/`), LXD pool used/total (the case_e5735d46 tripwire for
# the 300/100 GiB pools), and per-VM root disks (`lxc exec <vm> -- df -P /`
# for the same VM list push-lxc-state.sh uses — case_91efe922 found
# `platform_lxc-ci-vms` is state-only). Warn at 80%, crit at 90%.
#
# ONE ENDPOINT, not two: Gatus external endpoints are boolean, so WARNING
# pushes DOWN on the same key and the message escalates warning → critical
# → unknown (same shape as the keeper-ingest module). The page fires early
# at warn; the text says which band breached.
#
# FAIL-CLOSED: triage missing/failed, any `lxc exec` failed, malformed JSON,
# or an UNKNOWN verdict all push DOWN. There is no "assume healthy" path.
#
# READ-ONLY / NO SECRETS: every probe is a read; nothing is deleted or
# restarted. Push messages carry percentages + the bound only — never paths
# beyond the mount/VM name, never payload content, never a bearer. The only
# variable is the shared external token, resolved from the root-only 0600
# env file on the host.
#
# Push key derivation (same as case_658bf6b9): <group>_<name> with separators
# mapped to '-': platform_runner-disk.
# Push: POST /api/v1/endpoints/<key>/external?success=<bool>&error=<msg>
# with Authorization: Bearer ${GATUS_EXTERNAL_TOKEN} (curl config file,
# never argv — see ops/case_658bf6b9/_gatus_push.sh).

external-endpoints:
  - name: runner-disk
    group: platform
    token: "${GATUS_EXTERNAL_TOKEN}"
    heartbeat:
      interval: 10m
    alerts:
      - type: discord
        description: "THRESHOLD host / or inode or LXD pool or VM root disk at/over warn 80% (crit 90%). OWNER devops. RUNBOOK docs/runbooks/runner-disk-triage.md"
      - type: custom
        description: "THRESHOLD host / or inode or LXD pool or VM root disk at/over warn 80% (crit 90%). OWNER devops. RUNBOOK docs/runbooks/runner-disk-triage.md"
