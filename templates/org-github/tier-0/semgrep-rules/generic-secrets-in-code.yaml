rules:
  - id: tier0-no-hardcoded-credentials
    languages: [javascript, typescript, python, php, go]
    severity: ERROR
    message: "Hardcoded credential assignment — credentials travel by environment or secret binding, never in source."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          - pattern: $KEY = "..."
          - pattern: const $KEY = "..."
          - pattern: '$KEY: "..."'
    metavariable-regex:
      metavariable: $KEY
      regex: "(?i)(api_key|apikey|secret|password|passwd|private_key|client_secret|auth_token)"
    paths:
      exclude:
        - "*.test.*"
        - test/*
        - tests/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"
