# Org extended-secrets pack (case_f3ff4554, blocker-ledger 'security' class).
#
# Blocker-ledger gap: the starter pack plus gitleaks left provider-shaped
# credential families to reviewer vigilance. These six ERROR rules pin the
# real shape of each family (long ids, long tokens) so short test-fixture
# canaries and truncated documentation examples never match. Every rule
# stays out of test/fixture/vendor paths, and the AWS/OpenAI/Slack rules
# explicitly skip the documented example placeholders.
#
# FP BUDGET (case_5789b2d5 rollout rule): report-only first via the gate `mode`
# input (ADOPTION.md: the whole gate flips report-only -> enforcing
# together; severity ERROR fires the gate only in enforcing mode).
# Promotion is all-or-nothing today; per-rule promotion needs a gate change
# upstream (PR #824). A committed match is compromised on landing: rotate
# first, then purge history.
rules:
  - id: tier0-secret-discord-webhook
    languages: [generic]
    severity: ERROR
    message: "Discord webhook URL committed — rotate the webhook, then purge history. Webhooks travel by secret binding, never in source."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          - pattern-regex: 'discord\.com/api/webhooks/[0-9]{10,}/[A-Za-z0-9_\-]{20,}'
          - pattern-regex: 'discordapp\.com/api/webhooks/[0-9]{10,}/[A-Za-z0-9_\-]{20,}'
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-secret-slack-token
    languages: [generic]
    severity: ERROR
    message: "Slack token committed — rotate it, then purge history. Tokens travel by secret binding, never in source."
    metadata:
      tier0: "live"
    patterns:
      # Real structure, not just a prefix: two long numeric groups plus a
      # long tail. A bare `xoxb-` plus 10 characters also matched short
      # synthetic canaries (a letter in the first group now fails it).
      - pattern-regex: 'xox[baprs]-[0-9]{8,}-[0-9]{8,}-[A-Za-z0-9\-]{16,}'
      # README spellings (xoxb-EXAMPLE-..., xoxb-...-TOKEN-...) are
      # placeholders, not tokens: skip the documented example markers so
      # truncated documentation examples never match.
      - pattern-not-regex: '(?i)(your|example|placeholder|x{4,}|token-here)'
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-secret-aws-key
    languages: [generic]
    severity: ERROR
    message: "AWS access key ID committed — rotate it, then purge history. Keys travel by secret binding, never in source."
    metadata:
      tier0: "live"
    patterns:
      - pattern-regex: 'AKIA[0-9A-Z]{16}'
      - pattern-not-regex: 'EXAMPLE'
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-secret-openai-key
    languages: [generic]
    severity: ERROR
    message: "OpenAI API key committed — rotate it, then purge history. Keys travel by secret binding, never in source."
    metadata:
      tier0: "live"
    patterns:
      # Current key families are sk-proj-..., sk-svcacct-... (and sk-admin-...):
      # the segment after sk- carries `-`/`_` so legacy `sk-[A-Za-z0-9]{20,}`
      # never matches them. The left boundary keeps kebab-case words
      # (e.g. risk-assessment*) from flagging. The tail floor is 40: real
      # keys are longer, and 32-char synthetic canaries matched at {32,}.
      - pattern-regex: '(?<![A-Za-z0-9])sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_\-]{40,}'
      - pattern-not-regex: '(?i)EXAMPLE'
      - pattern-not-regex: '(.)\1{9,}'
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-secret-stripe-live-key
    languages: [generic]
    severity: ERROR
    message: "Stripe live key committed — rotate it, then purge history. Keys travel by secret binding, never in source."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          - pattern-regex: 'sk_live_[A-Za-z0-9]{10,}'
          - pattern-regex: 'rk_live_[A-Za-z0-9]{10,}'
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-secret-github-token
    languages: [generic]
    severity: ERROR
    message: "GitHub token committed — rotate it, then purge history. Mirrors the repo always-run scan at org level."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          - pattern-regex: 'gh[pousr]_[A-Za-z0-9]{16,}'
          - pattern-regex: 'github_pat_[A-Za-z0-9_]{16,}'
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"
