# Org SSRF / open-redirect pack (case_f3ff4554, blocker-ledger 'security' class).
#
# Blocker-ledger gap: server-side fetches aimed at user-influenced URLs and
# redirects to user-controlled targets had no deterministic rule — every
# finding needed the expensive reviewer. These five WARN-first rules flag
# the direct shape (a fetch/redirect call whose URL expression is
# dynamically built or carries an input-ish name). Indirect flows (URL
# laundered through two+ assignments, allowlist-validated URLs) are out of
# scope for the deterministic slice and stay with the reviewer, as are
# Python Session/Client objects assigned to a variable before the call
# (direct constructor chains are covered; see the Python rule). TypeScript
# generic calls (axios.get<T>(...)) cannot be bound by a Semgrep call
# pattern, so a fifth regex rule covers their single-line forms.
#
# FP BUDGET (case_5789b2d5 rollout rule): report-only first via the gate `mode`
# input (ADOPTION.md: the whole gate flips report-only -> enforcing
# together; severity WARNING is a triage hint only and changes nothing at
# the gate). Promotion is all-or-nothing today; per-rule severity promotion
# needs a gate change upstream (PR #824). Plain string literals never match
# (pattern-not guards exclude a literal first argument on every call form),
# and the redirect rules skip literal targets in either argument position,
# plus literal-URL constructions, via pattern-not. Dynamically built URLs
# fire only when they carry an input-ish fragment; a template/concatenation
# that merely contains a bare fragment word (query, params, ...) can still
# fire without direct user influence — triage per the FP budget.
rules:
  - id: tier0-ssrf-dynamic-fetch-js
    languages: [javascript, typescript]
    severity: WARNING
    message: "Server-side fetch of a dynamically built URL — allowlist scheme+host, resolve all DNS records and reject private/reserved addresses, forbid redirects (SSRF)."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          # Bare callable forms: axios(url) / got(url) are the same direct
          # shape as their method forms. The axios config-object form
          # binds $URL to its url/baseURL property or a spread source:
          # binding the whole object made a constant url fire whenever
          # params/data mentioned req.*, so the bare branch excludes
          # objects and the config branches below match them instead. A
          # relative url rides on a user-controlled baseURL, and a spread
          # config can carry either, so both are URL positions too. The
          # literal guards for the config branches live inside their own
          # branch: a top-level literal-url guard would also suppress a
          # baseURL hit on the same call (and vice versa). The same applies
          # to the (url, config) spelling — axios.get("/x", { baseURL:
          # req... }) — so the axios/$HTTP literal-URL guards are
          # branch-local too, and dedicated branches bind baseURL/spread in
          # the config argument (second for get/delete/head and the bare
          # form, third for post/put/patch whose second argument is data).
          - patterns:
              - pattern: axios($URL, ...)
              - pattern-not: 'axios({...}, ...)'
              - pattern-not: axios("...", ...)
          - patterns:
              - pattern: 'axios({..., url: $URL, ...}, ...)'
              - pattern-not: 'axios({..., url: "...", ...}, ...)'
          - patterns:
              - pattern: 'axios({..., baseURL: $URL, ...}, ...)'
              - pattern-not: 'axios({..., baseURL: "...", ...}, ...)'
          - pattern: 'axios({..., ...$URL, ...}, ...)'
          - patterns:
              - pattern: 'axios($U, {..., baseURL: $URL, ...}, ...)'
              - pattern-not: 'axios($U, {..., baseURL: "...", ...}, ...)'
          - pattern: 'axios($U, {..., ...$URL, ...}, ...)'
          - pattern: got($URL, ...)
          # got.get/post/... take the same first-argument URL as bare
          # got(url); a dedicated method branch binds it with a literal
          # guard and a method allowlist, so extend/paginate stay silent.
          - patterns:
              - pattern: got.$METHOD($URL, ...)
              - pattern-not: got.$METHOD("...", ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|stream)$
          # Method forms take the same config object (axios.request):
          # the generic branch excludes objects, the config branches bind
          # url/baseURL/spread exactly like the bare form.
          - patterns:
              - pattern: axios.$METHOD($URL, ...)
              - pattern-not: 'axios.$METHOD({...}, ...)'
              - pattern-not: axios.$METHOD("...", ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm)$
          - patterns:
              - pattern: 'axios.$METHOD({..., url: $URL, ...}, ...)'
              - pattern-not: 'axios.$METHOD({..., url: "...", ...}, ...)'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm)$
          - patterns:
              - pattern: 'axios.$METHOD({..., baseURL: $URL, ...}, ...)'
              - pattern-not: 'axios.$METHOD({..., baseURL: "...", ...}, ...)'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm)$
          - patterns:
              - pattern: 'axios.$METHOD({..., ...$URL, ...}, ...)'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm)$
          # (url, config) spelling: a literal or constant url still rides
          # on a user-controlled baseURL/spread config (second argument for
          # get/delete/head; third for post/put/patch, whose second
          # argument is the request body).
          - patterns:
              - pattern: 'axios.$METHOD($U, {..., baseURL: $URL, ...}, ...)'
              - pattern-not: 'axios.$METHOD($U, {..., baseURL: "...", ...}, ...)'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|delete|head|options)$
          - patterns:
              - pattern: 'axios.$METHOD($U, {..., ...$URL, ...}, ...)'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|delete|head|options)$
          - patterns:
              - pattern: 'axios.$METHOD($U, $D, {..., baseURL: $URL, ...}, ...)'
              - pattern-not: 'axios.$METHOD($U, $D, {..., baseURL: "...", ...}, ...)'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(post|put|patch|postForm|putForm|patchForm)$
          - patterns:
              - pattern: 'axios.$METHOD($U, $D, {..., ...$URL, ...}, ...)'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(post|put|patch|postForm|putForm|patchForm)$
          - patterns:
              - pattern: $HTTP.$METHOD($URL, ...)
              - pattern-not: $HTTP.$METHOD("...", ...)
              - metavariable-regex:
                  metavariable: $HTTP
                  regex: ^(http|https)$
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request)$
      # Pure literals never reach the regex: a literal first argument is a
      # fixed endpoint even when its path contains a fragment word
      # ("/api/params", "https://api.example.com/v1/query"). The fetch/got
      # literal guards can stay top-level (neither takes a baseURL config);
      # the axios/$HTTP ones are branch-local above, because a top-level
      # $HTTP.$METHOD("...", ...) guard also matches axios.get("/x", {...})
      # and would suppress the (url, config) baseURL branches.
      - pattern-not: fetch("...", ...)
      - pattern-not: got("...", ...)
      # Unanchored on purpose: metavariable-regex matches from the start of
      # the metavariable text, so without `.*` only a URL expression that
      # BEGINS with an input-ish fragment fires, and wrapped (String(),
      # decodeURIComponent), templated (`...${req.query.u}...`),
      # concatenated ("https://x/" + req.query.path) and accessor
      # (url.searchParams.get("u"), body.callbackUrl, new URL(req.query.u))
      # shapes all miss.
      - metavariable-regex:
          metavariable: $URL
          regex: (?is).*(req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  # TypeScript generic calls — axios.get<T>(url), axios<T>({...}),
  # got<T>(url) — are the dominant typed idiom, but a Semgrep call pattern
  # cannot bind a call carrying type arguments, so the structural rule
  # above never matches them. A regex branch can: each alternative binds
  # $URL to the same positions the structural branches bind (direct first
  # argument; first-argument config-object url/baseURL/spread; a later
  # config argument's baseURL/spread, second for get/delete/head and the
  # bare form, third for post/put/patch) and the same fragment regex
  # decides. Method lists cover axios options/postForm/putForm/patchForm
  # everywhere the structural rule does, so generic and untyped calls agree.
  # Spreads and baseURL bind at the same object level only, so
  # payload objects (post/put/patch second argument) and nested spreads
  # (headers/params/nested url) stay silent exactly like the structural
  # rule. The config-object prefix steps over one nesting level, the
  # get/post-style first argument is template- and string-aware (a
  # backtick, double- or single-quoted span counts as one unit, plus one
  # call-paren group), so a templated path or a comma-carrying string steps
  # over to the config object while a constant first argument still ends at
  # the top-level comma, and the post-style second argument allows one
  # inline object, call-paren group or array literal, so url/baseURL behind
  # a headers/data/payload object fire, as do call/array payload shapes.
  # Template config urls scan to
  # the closing backtick, so a leading constant placeholder still fires.
  # Config url values end at the first top-level comma (three nested
  # call-paren levels and one bracket level allowed), so path.join(a, req...) and
  # new URL(a, req...).href fire, while a constant url stays silent even
  # when a shorthand property (params, query, data) or a later key:
  # property mentions req.*.
  # The direct and concatenation first-argument captures likewise stop at
  # the first top-level comma (two call-paren levels and one bracket level
  # allowed, and the template capture stays inside the backticks), so a
  # constant first argument stays silent when later arguments mention
  # req.*, while encodeURI(String(req...)), buildUrl(b, encode(req...)),
  # [b, req...].join('/') and a.b(c) + req... fire. The config url/baseURL
  # key needs a non-identifier char to its left, so callback_url: never
  # binds as url (the structural rule binds exact property names). Keys may
  # be quoted ("url":), so a quoted key fires; the value ends at the first
  # top-level comma regardless of quoting, so a quoted later key still ends
  # it. A hyphen counts as a boundary char too, so 'x-url': stays silent
  # like the structural rule. url and baseURL are
  # separate entries rather than one alternation: a pattern-regex returns
  # its leftmost match, so a constant first key would consume the match and
  # hide a tainted later one ({ baseURL: API_BASE, url: req.query.path }
  # must fire). The same leftmost rule applies to spreads, so each spread
  # capture carries a call-paren-aware taint lookahead (commas inside call
  # parens do not truncate it, and the taint word may sit up to three
  # call-paren levels deep) and matching restarts at a later
  # spread ({ ...DEFAULTS, ...req.body } fires, as does
  # { ...merge(DEFAULTS, req.body) }). The patterns
  # use single backslashes: these patterns live in
  # single-quoted YAML scalars where a backslash is literal, so a doubled
  # backslash would test for a literal backslash and never fire.
  # Literal URLs are excluded inside the regex (the captured position may
  # not start with a quote or, for the direct form, a config brace).
  # Single-line calls only; a generic call split across lines stays with
  # the reviewer, as do shapes deeper than three call-paren levels or with
  # brackets inside a spread.
  - id: tier0-ssrf-generic-fetch-ts
    languages: [typescript]
    severity: WARNING
    message: "Server-side fetch of a dynamically built URL — allowlist scheme+host, resolve all DNS records and reject private/reserved addresses, forbid redirects (SSRF)."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          - pattern-regex: '\b(?:axios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?|got(?:\.(?:get|post|put|patch|delete|head|request|stream))?)<[^()\n]*>\s*\(\s*(?P<URL>(?!\s*[{"''`])(?:[^,()\[\n]|\((?:[^()\n]|\([^()\n]*\))*\)|\[[^\]\n]*\])*)'
          # Templated/concatenated first arguments start with a quote, so
          # the direct branch above excludes them; bind the interpolation
          # or the non-literal operand instead (a pure-literal template or
          # concatenation still cannot match either shape).
          - pattern-regex: '\b(?:axios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?|got(?:\.(?:get|post|put|patch|delete|head|request|stream))?)<[^()\n]*>\s*\(\s*(?P<URL>`[^`\n]*?\$\{[^`\n]*)'
          - pattern-regex: '\b(?:axios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?|got(?:\.(?:get|post|put|patch|delete|head|request|stream))?)<[^()\n]*>\s*\(\s*["''][^"''\n]*["'']\s*\+\s*(?P<URL>(?!\s*["''`])(?:[^,()\[\n]|\((?:[^()\n]|\([^()\n]*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?<[^()\n]*>\s*\(\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?url["'']?\s*:\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?<[^()\n]*>\s*\(\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?<[^()\n]*>\s*\(\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?url["'']?\s*:\s*(?P<URL>`[^`\n]*?\$\{[^`\n]*)'
          - pattern-regex: '\baxios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?<[^()\n]*>\s*\(\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*(?P<URL>`[^`\n]*?\$\{[^`\n]*)'
          - pattern-regex: '\baxios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?<[^()\n]*>\s*\(\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?url["'']?\s*:\s*["''][^"''\n]*["'']\s*\+\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?<[^()\n]*>\s*\(\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*["''][^"''\n]*["'']\s*\+\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios(?:\.(?:get|post|put|patch|delete|head|request|options|postForm|putForm|patchForm))?<[^()\n]*>\s*\(\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?\.\.\.(?P<URL>(?=(?:[^,(){}\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\((?:[^()\n]|\([^()\n]*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\([^()\n]*?(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)\)))))(?:[^,(){}\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*)'
          - pattern-regex: '\baxios(?:\.(?:get|delete|head|options))?<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios(?:\.(?:get|delete|head|options))?<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*(?P<URL>`[^`\n]*?\$\{[^`\n]*)'
          - pattern-regex: '\baxios(?:\.(?:get|delete|head|options))?<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*["''][^"''\n]*["'']\s*\+\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios(?:\.(?:get|delete|head|options))?<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?\.\.\.(?P<URL>(?=(?:[^,(){}\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\((?:[^()\n]|\([^()\n]*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\([^()\n]*?(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)\)))))(?:[^,(){}\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*)'
          - pattern-regex: '\baxios\.(?:post|put|patch|postForm|putForm|patchForm)<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,(?:[^,{\n]|\([^()\n]*\)|\[[^\]\n]*\]|\{[^{}\n]*\})*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios\.(?:post|put|patch|postForm|putForm|patchForm)<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,(?:[^,{\n]|\([^()\n]*\)|\[[^\]\n]*\]|\{[^{}\n]*\})*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*(?P<URL>`[^`\n]*?\$\{[^`\n]*)'
          - pattern-regex: '\baxios\.(?:post|put|patch|postForm|putForm|patchForm)<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,(?:[^,{\n]|\([^()\n]*\)|\[[^\]\n]*\]|\{[^{}\n]*\})*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?(?<![\w$-])["'']?baseURL["'']?\s*:\s*["''][^"''\n]*["'']\s*\+\s*(?P<URL>(?!\s*["''`])(?:[^,(){}\[\]\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\)|\[[^\]\n]*\])*)'
          - pattern-regex: '\baxios\.(?:post|put|patch|postForm|putForm|patchForm)<[^()\n]*>\s*\((?:[^,{()"''`\n]|\([^()\n]*\)|`[^`\n]*`|"[^"\n]*"|''[^''\n]*'')*,(?:[^,{\n]|\([^()\n]*\)|\[[^\]\n]*\]|\{[^{}\n]*\})*,\s*\{(?:[^{}\n]|\{[^{}\n]*\})*?\.\.\.(?P<URL>(?=(?:[^,(){}\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\((?:[^()\n]|\([^()\n]*\))*?(?:(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)|\([^()\n]*?(?i:req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)\)))))(?:[^,(){}\n]|\((?:[^()\n]|\((?:[^()\n]|\([^()\n]*\))*\))*\))*)'
      - metavariable-regex:
          metavariable: $URL
          regex: (?is).*(req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-ssrf-dynamic-url-py
    languages: [python]
    severity: WARNING
    message: "Server-side request to a dynamically built URL — allowlist scheme+host, resolve all DNS records and reject private/reserved addresses, forbid redirects (SSRF)."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          # Verb-method forms: the URL is the first argument. `request` is
          # NOT in this alternation — for requests.request/httpx.request
          # the first argument is the HTTP method string, so binding it to
          # $URL (and then dropping literals) made that branch dead.
          - patterns:
              - pattern: requests.$METHOD($URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|options)$
          - patterns:
              - pattern: httpx.$METHOD($URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|options)$
          # Two-argument request(method, url): the URL is second.
          - pattern: requests.request($M, $URL, ...)
          - pattern: httpx.request($M, $URL, ...)
          # Keyword form: requests.get(url=...).
          - patterns:
              - pattern: requests.$METHOD(..., url=$URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options)$
          - patterns:
              - pattern: httpx.$METHOD(..., url=$URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options|stream)$
          # Keyword form on direct constructor chains and httpx.stream:
          # Session().get(url=...), Client().stream("GET", url=...), etc.
          # The literal guards below (url="...") are position-safe: the
          # literal sits in url= position, so a generic $METHOD guard cannot
          # match a method-string first argument here.
          - patterns:
              - pattern: requests.Session().$METHOD(..., url=$URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options)$
          - patterns:
              - pattern: httpx.Client().$METHOD(..., url=$URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options|stream)$
          - patterns:
              - pattern: httpx.AsyncClient().$METHOD(..., url=$URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|request|options|stream)$
          # Direct constructor chains only. A Session/Client assigned to a
          # variable first (`s = requests.Session(); s.get(...)`) cannot be
          # named without matching every `.get(` in a codebase, so it stays
          # with the reviewer, like other indirect flows (see the header).
          - patterns:
              - pattern: requests.Session().$METHOD($URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|options)$
          - patterns:
              - pattern: httpx.Client().$METHOD($URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|options)$
          - patterns:
              - pattern: httpx.AsyncClient().$METHOD($URL, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: (?i)^(get|post|put|patch|delete|head|options)$
          # Two-argument request/stream on direct constructor chains: the
          # first argument is the method string, so the URL is second. Each
          # branch carries its own second-argument literal guard below, and
          # the Session/Client first-argument guards are per-verb: a generic
          # `$METHOD("...", ...)` guard would also match the method string
          # here and silently kill these branches.
          - pattern: requests.Session().request($M, $URL, ...)
          - pattern: httpx.Client().request($M, $URL, ...)
          - pattern: httpx.AsyncClient().request($M, $URL, ...)
          - pattern: httpx.stream($M, $URL, ...)
          - pattern: httpx.Client().stream($M, $URL, ...)
          - pattern: httpx.AsyncClient().stream($M, $URL, ...)
          - pattern: urllib.request.urlopen($URL, ...)
          - pattern: urllib.request.urlopen(..., url=$URL, ...)
      # Pure literals never reach the regex (see the JS rule); the fragment
      # list stays narrow — request accessors only — so configured constants
      # (SLACK_WEBHOOK_URL, settings.EXTERNAL_API_URL) stay silent. The
      # literal guards enumerate each verb method instead of one generic
      # `requests.$METHOD("...", ...)` guard: the generic form also matches
      # `requests.request("GET", <dynamic>)` (the literal is the method, not
      # the URL) and would silently kill the two-argument form above.
      - pattern-not: requests.get("...", ...)
      - pattern-not: requests.post("...", ...)
      - pattern-not: requests.put("...", ...)
      - pattern-not: requests.patch("...", ...)
      - pattern-not: requests.delete("...", ...)
      - pattern-not: requests.head("...", ...)
      - pattern-not: requests.options("...", ...)
      - pattern-not: httpx.get("...", ...)
      - pattern-not: httpx.post("...", ...)
      - pattern-not: httpx.put("...", ...)
      - pattern-not: httpx.patch("...", ...)
      - pattern-not: httpx.delete("...", ...)
      - pattern-not: httpx.head("...", ...)
      - pattern-not: httpx.options("...", ...)
      - pattern-not: requests.request($M, "...", ...)
      - pattern-not: httpx.request($M, "...", ...)
      - pattern-not: requests.Session().request($M, "...", ...)
      - pattern-not: httpx.Client().request($M, "...", ...)
      - pattern-not: httpx.AsyncClient().request($M, "...", ...)
      - pattern-not: httpx.stream($M, "...", ...)
      - pattern-not: httpx.Client().stream($M, "...", ...)
      - pattern-not: httpx.AsyncClient().stream($M, "...", ...)
      - pattern-not: requests.$METHOD(..., url="...", ...)
      - pattern-not: httpx.$METHOD(..., url="...", ...)
      - pattern-not: requests.Session().get("...", ...)
      - pattern-not: requests.Session().post("...", ...)
      - pattern-not: requests.Session().put("...", ...)
      - pattern-not: requests.Session().patch("...", ...)
      - pattern-not: requests.Session().delete("...", ...)
      - pattern-not: requests.Session().head("...", ...)
      - pattern-not: requests.Session().options("...", ...)
      - pattern-not: httpx.Client().get("...", ...)
      - pattern-not: httpx.Client().post("...", ...)
      - pattern-not: httpx.Client().put("...", ...)
      - pattern-not: httpx.Client().patch("...", ...)
      - pattern-not: httpx.Client().delete("...", ...)
      - pattern-not: httpx.Client().head("...", ...)
      - pattern-not: httpx.Client().options("...", ...)
      - pattern-not: httpx.AsyncClient().get("...", ...)
      - pattern-not: httpx.AsyncClient().post("...", ...)
      - pattern-not: httpx.AsyncClient().put("...", ...)
      - pattern-not: httpx.AsyncClient().patch("...", ...)
      - pattern-not: httpx.AsyncClient().delete("...", ...)
      - pattern-not: httpx.AsyncClient().head("...", ...)
      - pattern-not: httpx.AsyncClient().options("...", ...)
      - pattern-not: requests.Session().$METHOD(..., url="...", ...)
      - pattern-not: httpx.Client().$METHOD(..., url="...", ...)
      - pattern-not: httpx.AsyncClient().$METHOD(..., url="...", ...)
      - pattern-not: urllib.request.urlopen("...", ...)
      - pattern-not: urllib.request.urlopen(..., url="...", ...)
      # Unanchored (see the JS rule): f-string, concat and str()-wrapped
      # request shapes must fire, not just the bare request.args["u"] form.
      # The $METHOD constraints live inside their own branches so the
      # method-less urllib branch is not gated on an unbound metavariable.
      - metavariable-regex:
          metavariable: $URL
          regex: (?is).*(request\.|user_input|untrusted|input_url|return_url)
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-open-redirect-js
    languages: [javascript, typescript]
    severity: WARNING
    message: "Redirect to a non-literal target — validate against an allowlist of paths/hosts; a user-controlled target is an open redirect."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          # Both argument orders occur in the wild: (url) / (url, status or
          # init) for Express, the Fetch/NextResponse statics and
          # Remix/React Router, and SvelteKit's (status, url). The
          # url-first branches bind $URL first and ignore the rest; on a
          # (status, url) call they bind $URL to the status, which carries
          # no input-ish fragment, and the second branch binds the target.
          - pattern: $RES.redirect($URL, ...)
          - pattern: $RES.redirect($STATUS, $URL)
          - pattern: NextResponse.redirect($URL, ...)
          # SvelteKit: throw redirect(302, <target>) — two args, no receiver.
          - pattern: redirect($URL, ...)
          - pattern: redirect($STATUS, $URL)
      - pattern-not: $RES.redirect("...", ...)
      - pattern-not: $RES.redirect($S, "...")
      - pattern-not: NextResponse.redirect("...", ...)
      - pattern-not: NextResponse.redirect(new URL("...", ...), ...)
      - pattern-not: redirect("...", ...)
      - pattern-not: redirect($S, "...")
      # Only user-influenced targets fire: literals and safe builders
      # (url_for, literal-URL constructions) carry no input-ish fragment.
      - metavariable-regex:
          metavariable: $URL
          regex: (?is).*(req\.|request\.|query|params|searchParams|userInput|untrusted|externalUrl|callbackUrl|redirectUrl|returnUrl|targetUrl|destUrl|webhookUrl|nextUrl|inputUrl)
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"

  - id: tier0-open-redirect-py
    languages: [python]
    severity: WARNING
    message: "Redirect to a non-literal target — validate against an allowlist of paths/hosts; a user-controlled target is an open redirect."
    metadata:
      tier0: "live"
    patterns:
      - pattern-either:
          - pattern: redirect($URL)
          - pattern: redirect($URL, ...)
          # Keyword spellings of the bare redirect(): the target parameter
          # is `location` in Flask/Werkzeug and `to` in Django.
          - pattern: redirect(..., location=$URL, ...)
          - pattern: redirect(..., to=$URL, ...)
          - pattern: HttpResponseRedirect($URL)
          # FastAPI/Starlette: RedirectResponse(<target>, ...) and the
          # standard keyword spelling RedirectResponse(url=<target>, ...).
          - pattern: RedirectResponse($URL)
          - pattern: RedirectResponse($URL, ...)
          - pattern: RedirectResponse(..., url=$URL, ...)
      - pattern-not: redirect("...")
      - pattern-not: redirect($S, "...")
      - pattern-not: redirect(url_for(...))
      - pattern-not: redirect(..., location="...", ...)
      - pattern-not: redirect(..., location=url_for(...), ...)
      - pattern-not: redirect(..., to="...", ...)
      - pattern-not: HttpResponseRedirect("...")
      - pattern-not: RedirectResponse("...")
      - pattern-not: RedirectResponse(..., url="...", ...)
      # Only user-influenced targets fire (see the JS redirect rule); the
      # fragment list stays narrow — request accessors only — so configured
      # constants stay silent here too.
      - metavariable-regex:
          metavariable: $URL
          regex: (?is).*(request\.|user_input|untrusted|input_url|return_url)
    paths:
      exclude:
        - "*.test.*"
        - "*.spec.*"
        - test/*
        - tests/*
        - __tests__/*
        - spec/*
        - e2e/*
        - vendor/*
        - fixtures/*
        - "*.fixture.*"
