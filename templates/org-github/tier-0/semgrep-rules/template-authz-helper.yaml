# TEMPLATE — disabled until a repo names its own authz helper (case_5789b2d5).
#
# The report asks for "route handlers must call the authz helper". A generic
# regex cannot know what a repo calls that function, so this rule ships
# matching NOTHING: `paths.include` is empty on purpose. To enable, a repo
# copies this file, sets the handler path and the helper name, and measures
# the false-positive rate over 20 PRs before promoting it to required.
#
# Example (a repo whose handlers live in routes/ and whose helper is
# requireAuth): set paths.include to ['routes/*.ts'] and replace
# NOT_REQUIRE_AUTH_HELPER with `pattern-not: requireAuth(...)` semantics
# per the Semgrep docs for the repo's language.
rules:
  - id: tier0-template-route-handlers-call-authz
    languages: [javascript]
    severity: WARNING
    message: "TEMPLATE — route handler without a call to the repo authz helper. Name the helper to enable."
    metadata:
      tier0: "template-disabled"
    # Matches nothing until a repo replaces this stub with its real helper
    # call shape. A named-call pattern keeps the file valid Semgrep config
    # (provable with `semgrep --validate`) while firing on zero code.
    pattern: __tier0_template_name_your_authz_helper__(...)
